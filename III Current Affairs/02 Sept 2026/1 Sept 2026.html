  &lt;style&gt;
    /* ==========================================================================
       CORE TYPOGRAPHY &amp; COLOR TOKENS (CALIBRI + ULTRA-DARK CRISP PRINTABLE INK)
       ========================================================================== */
    :root {
      --font-main: &#x27;Calibri&#x27;, &#x27;Carlito&#x27;, &#x27;Segoe UI&#x27;, -apple-system, BlinkMacSystemFont, Arial, sans-serif;

      --cat-intl: #1e3a8a;

      --cat-sports: #0f766e;

      --cat-sports-border: #5eead4;
    }

    * {

    html {

      -webkit-font-smoothing: antialiased;

    body {

    /* ==========================================================================

    .hero-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #1e40af 100%);

      padding: 28px 32px;

    .hero-top-row {

      color: #1e40af;
      display: none;
    }

    /* ==========================================================================
       SECTION BLOCKS &amp; HEADINGS
       ========================================================================== */
    .ca-section {
      background: var(--bg-surface);
      border-radius: 14px;
      border: 1.5px solid var(--border-light);
      padding: 24px 26px;
      margin-bottom: 26px;

    /* ==========================================================================
       HOVERING CARDS &amp; RESPONSIVE GRIDS
       ========================================================================== */
    .cards-grid {
      display: grid;

    /* ==========================================================================

       ========================================================================== */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 14px 0 20px;
      border-radius: 10px;
      border: 1.5px solid #94a3b8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-main);
      background: #ffffff;
      color: var(--text-primary);
    }

    thead th {
      background: #1e293b;
      color: #ffffff;

      border-bottom: 2px solid #0f172a;

      color: var(--text-primary);
      vertical-align: top;
      line-height: 1.45;
    }

    tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    tbody tr:hover {
      background-color: #eff6ff;
    }

    td strong {
      color: #000000;
    }

    /* ==========================================================================
       FOOTER
       ========================================================================== */
    .page-footer {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-secondary);
      font-size: 0.92rem;
      border-top: 2px solid var(--border-light);
      margin-top: 32px;
    }

       ========================================================================== */
    @media (max-width: 768px) {

        padding: 12px 14px 40px;

        padding: 20px 18px;

      .hero-banner h1 {

      .ca-section {

      }
      .cards-grid, .cards-grid-3 {
        grid-template-columns: 1fr;
      }

        &lt;article class=&quot;ca-card&quot;&gt;
          &lt;div class=&quot;card-top-bar&quot;&gt;
            &lt;span class=&quot;card-badge badge-days&quot;&gt;11 September&lt;/span&gt;
            &lt;span class=&quot;card-badge badge-env&quot;&gt;Environment History&lt;/span&gt;
          &lt;/div&gt;
          &lt;h3&gt;1. National Forest Martyrs&#x27; Day (राष्ट्रीय वन शहीद दिवस)&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;Observed On:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;11 September&lt;/span&gt; annually across India.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Instituted By:&lt;/strong&gt; Ministry of Environment, Forest and Climate Change (MoEFCC) in &lt;strong&gt;2013&lt;/strong&gt; to honour forest personnel and citizens who laid down their lives protecting forests and wildlife.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Historical Event Commemorated:&lt;/strong&gt; The &lt;span class=&quot;high-yield&quot;&gt;Khejarli Massacre (1730 AD)&lt;/span&gt; in Khejarli village, Marwar Kingdom (Jodhpur, Rajasthan).&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Leader &amp;amp; Community:&lt;/strong&gt; Led by &lt;span class=&quot;high-yield&quot;&gt;Amrita Devi Bishnoi&lt;/span&gt;, who sacrificed her life along with her three daughters (Asu, Ratni, Bhagu) and &lt;strong&gt;363 members of the Bishnoi community&lt;/strong&gt; on the orders of Maharaja Abhai Singh&#x27;s minister Giridhar Bhandari to protect sacred &lt;strong&gt;Khejri trees&lt;/strong&gt; (&lt;em&gt;Prosopis cineraria&lt;/em&gt; — State Tree of Rajasthan &amp;amp; Telangana).&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Exam Distinction (Khejarli vs. Chipko Movement):&lt;/strong&gt;
              &lt;ul&gt;
                &lt;li&gt;&lt;strong&gt;Khejarli Massacre:&lt;/strong&gt; Took place in &lt;strong&gt;1730&lt;/strong&gt; in &lt;strong&gt;Rajasthan&lt;/strong&gt; (inspired the Chipko Movement).&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Chipko Movement:&lt;/strong&gt; Took place in &lt;strong&gt;1973&lt;/strong&gt; in &lt;strong&gt;Chamoli district, Uttarakhand&lt;/strong&gt; (then UP), led by Sunderlal Bahuguna, Chandi Prasad Bhatt, and Gaura Devi.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/li&gt;
          &lt;/ul&gt;
          &lt;div class=&quot;memory-box&quot;&gt;
            &lt;strong&gt;💡 Memory Trick:&lt;/strong&gt; Draw two tree trunks side-by-side (&lt;code&gt;1 1&lt;/code&gt;) → &lt;strong&gt;11 September&lt;/strong&gt; is National Forest Martyrs&#x27; Day.
          &lt;/div&gt;
        &lt;/article&gt;

        &lt;!-- Card 2: Hindi Diwas &amp; Official Languages --&gt;
        &lt;article class=&quot;ca-card&quot;&gt;
          &lt;div class=&quot;card-top-bar&quot;&gt;
            &lt;span class=&quot;card-badge badge-days&quot;&gt;14 September&lt;/span&gt;
            &lt;span class=&quot;card-badge badge-env&quot;&gt;Polity &amp;amp; Constitutional GK&lt;/span&gt;
          &lt;/div&gt;
          &lt;h3&gt;2. Hindi Diwas (हिंदी दिवस) vs. World Hindi Day&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;National Hindi Diwas:&lt;/strong&gt; Observed on &lt;span class=&quot;high-yield&quot;&gt;14 September&lt;/span&gt; every year.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Historical Context:&lt;/strong&gt; On &lt;strong&gt;14 September 1949&lt;/strong&gt;, the Constituent Assembly of India officially adopted &lt;strong&gt;Hindi written in the Devanagari script&lt;/strong&gt; as the Official Language of the Union of India (while retaining the international form of Indian numerals). First celebrated in &lt;strong&gt;1953&lt;/strong&gt;.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Constitutional &amp;amp; Legal Provisions:&lt;/strong&gt;
              &lt;ul&gt;
                &lt;li&gt;&lt;strong&gt;Article 343(1):&lt;/strong&gt; Declares Hindi in Devanagari script and &lt;strong&gt;English&lt;/strong&gt; as the &lt;strong&gt;2 Official Languages&lt;/strong&gt; of the Union Government. (&lt;em&gt;Note: India has NO National Language and NO National Sport&lt;/em&gt;).&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Official Languages Act, 1963:&lt;/strong&gt; Enacted to continue the use of English for official purposes alongside Hindi beyond the initial 15-year transition period (post-1965) following protests in South India.&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Eighth Schedule (8th Schedule):&lt;/strong&gt; Recognises &lt;span class=&quot;high-yield&quot;&gt;22 Scheduled Languages&lt;/span&gt; (including Hindi; English is NOT in the 8th Schedule).&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;World Hindi Day (विश्व हिंदी दिवस):&lt;/strong&gt; Observed on &lt;span class=&quot;high-yield&quot;&gt;10 January&lt;/span&gt; (commemorating the 1st World Hindi Conference held in Nagpur on 10 January 1975).&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;

        &lt;!-- Card 3: World Ozone Day --&gt;
        &lt;article class=&quot;ca-card&quot;&gt;
          &lt;div class=&quot;card-top-bar&quot;&gt;
            &lt;span class=&quot;card-badge badge-days&quot;&gt;16 September&lt;/span&gt;
            &lt;span class=&quot;card-badge badge-env&quot;&gt;Science &amp;amp; Ecology&lt;/span&gt;
          &lt;/div&gt;
          &lt;h3&gt;3. International Day for the Preservation of the Ozone Layer (World Ozone Day)&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;Observed On:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;16 September&lt;/span&gt; (proclaimed by UNGA in &lt;strong&gt;1994&lt;/strong&gt;).&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;2026 Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Global Action for a Cooler Planet&quot;&lt;/span&gt; (&lt;a href=&quot;https://ozone.unep.org/ozone-day/global-action-cooler-planet&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;UNEP Ozone Secretariat&lt;/a&gt; — marking 10 years of the Kigali Amendment).&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Scientific &amp;amp; Atmospheric Context:&lt;/strong&gt;
              &lt;ul&gt;
                &lt;li&gt;&lt;strong&gt;Molecular Formula:&lt;/strong&gt; O&lt;sub&gt;3&lt;/sub&gt; (Trioxygen).&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Atmospheric Layer:&lt;/strong&gt; Located in the &lt;strong&gt;Stratosphere&lt;/strong&gt; (~15–35 km altitude), where it absorbs harmful solar &lt;strong&gt;Ultraviolet (UV-B) radiation&lt;/strong&gt;. Unlike the Troposphere (where temperature decreases with height due to the normal lapse rate), temperature in the &lt;strong&gt;Stratosphere increases with altitude&lt;/strong&gt; due to UV absorption by ozone.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Treaties &amp;amp; Amendments:&lt;/strong&gt;
              &lt;ul&gt;
                &lt;li&gt;&lt;strong&gt;Vienna Convention (1985):&lt;/strong&gt; Framework for ozone protection.&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Montreal Protocol (Signed 16 Sept 1987):&lt;/strong&gt; Legally binding treaty to phase out &lt;strong&gt;Ozone Depleting Substances (ODS)&lt;/strong&gt; such as CFCs (Chlorofluorocarbons), Halons, and Carbon Tetrachloride (CCl&lt;sub&gt;4&lt;/sub&gt;).&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Kigali Amendment (2016, Rwanda):&lt;/strong&gt; Phase-down of &lt;strong&gt;HFCs (Hydrofluorocarbons)&lt;/strong&gt; — potent greenhouse gases that warm the planet.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/li&gt;
          &lt;/ul&gt;
          &lt;div class=&quot;memory-box&quot;&gt;
            &lt;strong&gt;💡 Memory Trick:&lt;/strong&gt; On your &quot;Sweet &lt;strong&gt;16th&lt;/strong&gt; Birthday&quot; (16 Sept), wish for a &lt;strong&gt;Cooler Planet&lt;/strong&gt; with a healthy Ozone Layer to protect against UV rays.
          &lt;/div&gt;
        &lt;/article&gt;

            &lt;li&gt;&lt;strong&gt;2026 Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Ayurveda for a Healthier Tomorrow&quot;&lt;/span&gt;.&lt;/li&gt;

            &lt;li&gt;&lt;strong&gt;Observed On:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;27 September&lt;/span&gt; (first celebrated in &lt;strong&gt;1980&lt;/strong&gt;; marks the adoption of the UNWTO Statutes on 27 September 1970).&lt;/li&gt;

              &lt;th style=&quot;width: 30%;&quot;&gt;Day / Observance Name&lt;/th&gt;
              &lt;th style=&quot;width: 56%;&quot;&gt;2026 Official Theme, Observing Body &amp;amp; Key Exam Facts&lt;/th&gt;
            &lt;/tr&gt;
          &lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;1 – 7 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;National Nutrition Week&lt;/strong&gt; &amp;amp; &lt;strong&gt;9th Rashtriya Poshan Maah&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Observed from 1st to 7th September (since 1982). The month-long &lt;strong&gt;9th Rashtriya Poshan Maah 2026&lt;/strong&gt; was launched in &lt;span class=&quot;high-yield&quot;&gt;Varanasi, Uttar Pradesh&lt;/span&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;2 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Coconut Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Observed by the Asian and Pacific Coconut Community (APCC). &lt;strong&gt;2026 Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Coconut in the Times of Uncertainty: Securing Food, Energy, and Livelihood&quot;&lt;/span&gt;. On this day, &lt;strong&gt;ICAR–CPCRI&lt;/strong&gt; launched &lt;strong&gt;Kshithi 2.0&lt;/strong&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;3 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Skyscraper Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Marks the birth anniversary of architect Louis Sullivan (&quot;Father of Skyscrapers&quot;).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;4 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;National Wildlife Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Global observance promoting wildlife conservation. (&lt;em&gt;Mnemonic: W-I-L-D has 4 letters → 4 September&lt;/em&gt;).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;5 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;National Teachers&#x27; Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Marks the birth anniversary of Bharat Ratna &lt;strong&gt;Dr. Sarvepalli Radhakrishnan&lt;/strong&gt; (1st Vice-President &amp;amp; 2nd President of India). President Droupadi Murmu conferred the &lt;strong&gt;National Teachers&#x27; Awards 2026 on 82 educators&lt;/strong&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;5 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Day of Charity&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Marks the death anniversary of &lt;strong&gt;Mother Teresa&lt;/strong&gt; (5 Sept 1997; Nobel Peace Prize 1979). &lt;strong&gt;2026 Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;The Power of Charity in Global Solidarity&quot;&lt;/span&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;5 Sept&lt;/strong&gt; (1st Sat)&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Vulture Awareness Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Observed on the first Saturday of September. Highlighted Maharashtra&#x27;s vulture reintroduction success in &lt;strong&gt;Melghat (70% survival)&lt;/strong&gt; and &lt;strong&gt;Pench (60% survival)&lt;/strong&gt; Tiger Reserves.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;7 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Day of Clean Air for Blue Skies&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;UN observance (started in 2020). &lt;strong&gt;2026 Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Clean Air for Climatic Action&quot;&lt;/span&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;7 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Day of Police Cooperation&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;UN observance (first held in 2023, marking INTERPOL&#x27;s 1923 founding). &lt;strong&gt;2026 Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Protecting Against Vulnerability: Building Trust and Legitimacy in Policing&quot;&lt;/span&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;8 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Literacy Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Observed by &lt;strong&gt;UNESCO&lt;/strong&gt; (since 1967). &lt;strong&gt;2026 Global Host:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;Mexico&lt;/span&gt;. &lt;strong&gt;2026 Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Literacy for People, the Planet, and Prosperity&quot;&lt;/span&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;8 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Physiotherapy (Physical Therapy) Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Marks the founding of World Physiotherapy in 1951.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;9 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Day to Protect Education from Attack&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Established by UNGA resolution spearheaded by Qatar and UNESCO (since 2020). Also observed as &lt;strong&gt;Himalaya Diwas&lt;/strong&gt; in Uttarakhand.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;10 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Suicide Prevention Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Organised by IASP and WHO. Linked with India&#x27;s 24×7 mental health helpline &lt;strong&gt;Tele-MANAS (14416)&lt;/strong&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;11 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;National Forest Martyrs&#x27; Day&lt;/strong&gt;, &lt;strong&gt;Digvijay Diwas&lt;/strong&gt; &amp;amp; &lt;strong&gt;Vinoba Bhave Jayanti&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Commemorates &lt;strong&gt;1730 Khejarli Massacre&lt;/strong&gt;; &lt;strong&gt;Digvijay Diwas&lt;/strong&gt; marks Swami Vivekananda&#x27;s historic 1893 Chicago Parliament of the World&#x27;s Religions address; Birth anniversary of &lt;strong&gt;Acharya Vinoba Bhave&lt;/strong&gt; (Bhoodan Movement founder &amp;amp; 1st Indian Ramon Magsaysay winner).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;12 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;UN Day for South-South Cooperation&lt;/strong&gt; &amp;amp; &lt;strong&gt;Saragarhi Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Marks adoption of the 1978 Buenos Aires Plan of Action (BAPA); &lt;strong&gt;Saragarhi Day&lt;/strong&gt; commemorates the 1897 Battle of Saragarhi fought by 21 soldiers of the &lt;strong&gt;36th Sikhs&lt;/strong&gt; led by Havildar Ishar Singh.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;14 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;Hindi Diwas (राष्ट्रीय हिंदी दिवस)&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Marks Constituent Assembly&#x27;s adoption of Hindi in Devanagari script on 14 Sept 1949. Home Ministry conferred &lt;strong&gt;Rajbhasha Kirti &amp;amp; Gaurav Awards&lt;/strong&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;15 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;National Engineers&#x27; Day&lt;/strong&gt;, &lt;strong&gt;International Day of Democracy&lt;/strong&gt;, &lt;strong&gt;Doordarshan 67th Foundation Day&lt;/strong&gt; &amp;amp; &lt;strong&gt;Sarat Chandra Chattopadhyay 150th Birth Anniversary&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Engineers&#x27; Day marks the birth anniversary of Bharat Ratna &lt;strong&gt;Sir M. Visvesvaraya&lt;/strong&gt; (author of &lt;em&gt;Planned Economy for India&lt;/em&gt;, 1934); UN International Day of Democracy; &lt;strong&gt;Doordarshan&lt;/strong&gt; founded on &lt;strong&gt;15 Sept 1959&lt;/strong&gt;; 150th Birth Anniversary of Bengali novelist &lt;strong&gt;Sarat Chandra Chattopadhyay&lt;/strong&gt; (&lt;em&gt;Devdas&lt;/em&gt;, &lt;em&gt;Srikanta&lt;/em&gt;, &lt;em&gt;Pather Dabi&lt;/em&gt;).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;16 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Ozone Day&lt;/strong&gt; &amp;amp; &lt;strong&gt;International Day for Interventional Cardiology&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;Ozone Day 2026 Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Global Action for a Cooler Planet&quot;&lt;/span&gt;. Interventional Cardiology Day commemorates the first coronary angioplasty by Dr. Andreas Grüntzig in 1977.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;17 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Patient Safety Day&lt;/strong&gt;, &lt;strong&gt;Hyderabad Liberation Day&lt;/strong&gt; &amp;amp; &lt;strong&gt;Social Justice Day (TN)&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;Hyderabad Liberation Day&lt;/strong&gt; commemorates &lt;strong&gt;Operation Polo (17 Sept 1948)&lt;/strong&gt; led by Major General J. N. Chaudhuri; birth anniversary of &lt;strong&gt;E. V. Ramasamy &#x27;Periyar&#x27;&lt;/strong&gt; (Self-Respect Movement, 1925) observed as Social Justice Day in Tamil Nadu; also marks &lt;strong&gt;PM Narendra Modi&#x27;s 76th Birthday&lt;/strong&gt; (Seva Pakhwada) &amp;amp; &lt;strong&gt;Vishwakarma Jayanti&lt;/strong&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;18 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Bamboo Day&lt;/strong&gt; &amp;amp; &lt;strong&gt;International Equal Pay Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;World Bamboo Day (established by World Bamboo Organization in 2009, Bangkok). International Equal Pay Day promotes equal remuneration for work of equal value.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;19 Sept&lt;/strong&gt; (3rd Sat)&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Red Panda Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Observed on the third Saturday of September to conserve the endangered Red Panda (&lt;em&gt;Ailurus fulgens&lt;/em&gt; — State Animal of Sikkim).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;20 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Cleanup Day&lt;/strong&gt; &amp;amp; &lt;strong&gt;RPF Raising Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;UN World Cleanup Day; Railway Protection Force (RPF) Raising Day.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;21 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Day of Peace&lt;/strong&gt; &amp;amp; &lt;strong&gt;World Alzheimer&#x27;s Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;UN Peace Day and global awareness day for neurological dementia/Alzheimer&#x27;s disease.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;22 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Rhino Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Raises awareness of all 5 rhinoceros species: &lt;strong&gt;Greater One-Horned Rhino&lt;/strong&gt; (Vulnerable — found in Kaziranga &amp;amp; Pobitora, Assam), White Rhino (Near Threatened), Black Rhino, Javan Rhino, and Sumatran Rhino (Critically Endangered).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;23 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;11th National Ayurveda Day&lt;/strong&gt;, &lt;strong&gt;International Day of Sign Languages&lt;/strong&gt; &amp;amp; &lt;strong&gt;Dinkar Jayanti&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;Ayurveda Day Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Ayurveda for a Healthier Tomorrow&quot;&lt;/span&gt; (Nagpur). Also marks birth anniversary of Rashtrakavi &lt;strong&gt;Ramdhari Singh Dinkar&lt;/strong&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;24 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Maritime Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Observed by the International Maritime Organization (IMO; HQ: London) on the last Thursday of September.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;25 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Pharmacists Day&lt;/strong&gt; &amp;amp; &lt;strong&gt;Antyodaya Diwas&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;World Pharmacists Day (FIP founding in 1912); &lt;strong&gt;Antyodaya Diwas&lt;/strong&gt; marks the birth anniversary of &lt;strong&gt;Pandit Deendayal Upadhyaya&lt;/strong&gt; (propounder of &lt;em&gt;Integral Humanism&lt;/em&gt;).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;26 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Lung Day&lt;/strong&gt;, &lt;strong&gt;World Environmental Health Day&lt;/strong&gt;, &lt;strong&gt;Nuclear Weapons Elimination Day&lt;/strong&gt; &amp;amp; &lt;strong&gt;Vidyasagar Jayanti&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;UN International Day for the Total Elimination of Nuclear Weapons; Birth anniversary of social reformer &lt;strong&gt;Ishwar Chandra Vidyasagar&lt;/strong&gt; (champion of the Hindu Widows&#x27; Remarriage Act, 1856).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;27 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Tourism Day 2026&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;2026 Host Cities:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;San Salvador &amp;amp; Surf City, El Salvador&lt;/span&gt;.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;28 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Rabies Day&lt;/strong&gt; &amp;amp; &lt;strong&gt;Shaheed Bhagat Singh Birth Anniversary&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Marks death anniversary of Louis Pasteur (developer of first rabies vaccine) and birth anniversary of revolutionary freedom fighter &lt;strong&gt;Bhagat Singh&lt;/strong&gt; (born 28 Sept 1907).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;29 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;World Heart Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;Organised by the World Heart Federation to combat cardiovascular diseases.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;30 Sept&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Translation Day&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;UN observance marking the feast of St. Jerome (patron saint of translators).&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;New UN Day&lt;/strong&gt; (Adopted 4 Sept)&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;International Day for the Elimination of Child, Early and Forced Marriage&lt;/strong&gt;&lt;/td&gt;
              &lt;td&gt;On 4 September 2026, the 193-member UN General Assembly adopted a resolution designating &lt;span class=&quot;high-yield&quot;&gt;27 November&lt;/span&gt; annually for this observance.&lt;/td&gt;
            &lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/section&gt;

      &lt;h3 class=&quot;sub-heading&quot;&gt;3A. National Appointments (September 2026)&lt;/h3&gt;
      &lt;div class=&quot;cards-grid&quot;&gt;
        &lt;article class=&quot;ca-card&quot;&gt;
          &lt;div class=&quot;card-top-bar&quot;&gt;

      &lt;h3 class=&quot;sub-heading&quot;&gt;10A. Major Multilateral Summits: 18th BRICS Summit (New Delhi) &amp;amp; 26th SCO Summit (Bishkek)&lt;/h3&gt;
      &lt;div class=&quot;cards-grid&quot;&gt;
        &lt;article class=&quot;ca-card&quot;&gt;
          &lt;span class=&quot;card-badge badge-intl&quot;&gt;12–13 Sept 2026 • New Delhi&lt;/span&gt;
          &lt;h3&gt;18th BRICS Summit 2026 — Complete Exam Breakdown&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;Host &amp;amp; Chairship:&lt;/strong&gt; Hosted by &lt;strong&gt;India in New Delhi&lt;/strong&gt; on 12–13 September 2026 (&lt;a href=&quot;https://www.pib.gov.in/PressNoteDetails.aspx?NoteId=159946&amp;amp;ModuleId=3&amp;amp;reg=3&amp;amp;lang=1&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;PIB&lt;/a&gt;), marking &lt;strong&gt;India&#x27;s 4th BRICS Chairship&lt;/strong&gt; (after 2012, 2016, and 2021) and &lt;strong&gt;20 years of BRICS&lt;/strong&gt; (established 2006; term &#x27;BRIC&#x27; coined by &lt;strong&gt;Jim O&#x27;Neill&lt;/strong&gt; of Goldman Sachs in 2001; 1st Summit: 2009 Yekaterinburg, Russia; South Africa joined Dec 2010).&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;2026 Official Theme:&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;&quot;Building for Resilience, Innovation, Cooperation and Sustainability&quot;&lt;/span&gt;.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;11 Full Member Nations (49.5% Global Pop., 40% Global GDP, 26% Trade):&lt;/strong&gt;
              &lt;ul&gt;
                &lt;li&gt;&lt;strong&gt;Core 5 (BRICS):&lt;/strong&gt; Brazil, Russia, India, China, South Africa.&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Joined Jan 2024 (5):&lt;/strong&gt; Egypt, Ethiopia, Iran, Saudi Arabia, UAE.&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;11th Full Member (Joined Jan 2025):&lt;/strong&gt; &lt;span class=&quot;high-yield&quot;&gt;Indonesia&lt;/span&gt;.&lt;/li&gt;

            &lt;/li&gt;
          &lt;/ul&gt;

            &lt;li&gt;&lt;strong&gt;&lt;span class=&quot;high-yield&quot;&gt;UN Equal Earth Map Resolution&lt;/span&gt;:&lt;/strong&gt; UN backed the &lt;em&gt;Equal Earth map projection&lt;/em&gt; to correct the size distortion of Africa and developing nations caused by the 16th-century Mercator projection.&lt;/li&gt;

    (function () {
      const searchInput = document.getElementById(&#x27;searchInput&#x27;);
      const filterChips = document.querySelectorAll(&#x27;.filter-chip&#x27;);
      const sections = document.querySelectorAll(&#x27;.ca-section&#x27;);
      const toggleHighlightBtn = document.getElementById(&#x27;toggleHighlightBtn&#x27;);
      const toggleStaticBtn = document.getElementById(&#x27;toggleStaticBtn&#x27;);
      const resetFiltersBtn = document.getElementById(&#x27;resetFiltersBtn&#x27;);
      const printNotesBtn = document.getElementById(&#x27;printNotesBtn&#x27;);
      const searchStatus = document.getElementById(&#x27;searchStatus&#x27;);

      let activeCategory = &#x27;all&#x27;;

      function applyFilters() {
        const query = (searchInput.value || &#x27;&#x27;).trim().toLowerCase();
        let visibleCardsAndRows = 0;

        sections.forEach(function (sec) {
          const secCat = sec.getAttribute(&#x27;data-category&#x27;);
          const categoryMatch = (activeCategory === &#x27;all&#x27; || activeCategory === secCat);

          if (!categoryMatch) {
            sec.style.display = &#x27;none&#x27;;
            return;
          }

          if (!query) {
            sec.style.display = &#x27;block&#x27;;
            sec.querySelectorAll(&#x27;.ca-card, tbody tr, .table-wrapper, .cards-grid, .cards-grid-3, .sub-heading&#x27;).forEach(function (el) {
              el.style.display = &#x27;&#x27;;
            });
            return;
          }

          let sectionHasMatch = false;

          // Filter card grids
          sec.querySelectorAll(&#x27;.cards-grid, .cards-grid-3&#x27;).forEach(function (grid) {
            let gridHasMatch = false;
            grid.querySelectorAll(&#x27;.ca-card&#x27;).forEach(function (card) {
              const text = (card.textContent || &#x27;&#x27;).toLowerCase();
              if (text.indexOf(query) !== -1) {
                card.style.display = &#x27;&#x27;;
                gridHasMatch = true;
                sectionHasMatch = true;
                visibleCardsAndRows++;
              } else {
                card.style.display = &#x27;none&#x27;;
              }
            });
            grid.style.display = gridHasMatch ? &#x27;&#x27; : &#x27;none&#x27;;
          });

          // Filter tables
          sec.querySelectorAll(&#x27;.table-wrapper&#x27;).forEach(function (wrap) {
            let tableHasMatch = false;
            wrap.querySelectorAll(&#x27;tbody tr&#x27;).forEach(function (row) {
              const text = (row.textContent || &#x27;&#x27;).toLowerCase();
              if (text.indexOf(query) !== -1) {
                row.style.display = &#x27;&#x27;;
                tableHasMatch = true;
                sectionHasMatch = true;
                visibleCardsAndRows++;
              } else {
                row.style.display = &#x27;none&#x27;;
              }
            });
            wrap.style.display = tableHasMatch ? &#x27;&#x27; : &#x27;none&#x27;;
          });

          // Hide sub-headings whose immediately following content block is hidden
          sec.querySelectorAll(&#x27;.sub-heading&#x27;).forEach(function (heading) {
            let nextEl = heading.nextElementSibling;
            let hasVisibleContent = false;
            while (nextEl &amp;&amp; !nextEl.classList.contains(&#x27;sub-heading&#x27;)) {
              if (nextEl.style.display !== &#x27;none&#x27;) {
                hasVisibleContent = true;
                break;
              }
              nextEl = nextEl.nextElementSibling;
            }
            heading.style.display = hasVisibleContent ? &#x27;&#x27; : &#x27;none&#x27;;
          });

          sec.style.display = sectionHasMatch ? &#x27;block&#x27; : &#x27;none&#x27;;
        });

        if (query) {
          searchStatus.style.display = &#x27;block&#x27;;
          searchStatus.textContent = &#x27;Showing &#x27; + visibleCardsAndRows + &#x27; matching current affairs entries for &quot;&#x27; + searchInput.value.trim() + &#x27;&quot;.&#x27;;
        } else {
          searchStatus.style.display = &#x27;none&#x27;;
          searchStatus.textContent = &#x27;&#x27;;
        }
      }

      if (searchInput) {
        searchInput.addEventListener(&#x27;input&#x27;, applyFilters);
      }

      filterChips.forEach(function (chip) {
        chip.addEventListener(&#x27;click&#x27;, function () {
          filterChips.forEach(function (c) { c.classList.remove(&#x27;active&#x27;); });
          chip.classList.add(&#x27;active&#x27;);
          activeCategory = chip.getAttribute(&#x27;data-filter&#x27;) || &#x27;all&#x27;;
          applyFilters();
        });
      });

      if (toggleHighlightBtn) {
        toggleHighlightBtn.addEventListener(&#x27;click&#x27;, function () {
          document.body.classList.toggle(&#x27;exam-highlight-active&#x27;);
          const isOn = document.body.classList.contains(&#x27;exam-highlight-active&#x27;);
          toggleHighlightBtn.classList.toggle(&#x27;active&#x27;, isOn);
          toggleHighlightBtn.textContent = isOn ? &#x27;★ High-Yield Highlights: ON&#x27; : &#x27;☆ High-Yield Highlights: OFF&#x27;;
        });
      }

      if (toggleStaticBtn) {
        toggleStaticBtn.addEventListener(&#x27;click&#x27;, function () {
          document.body.classList.toggle(&#x27;hide-static&#x27;);
          const isVisible = !document.body.classList.contains(&#x27;hide-static&#x27;);
          toggleStaticBtn.classList.toggle(&#x27;active&#x27;, isVisible);
          toggleStaticBtn.textContent = isVisible ? &#x27;🧠 Static GK &amp; Memory Hints: ON&#x27; : &#x27;🧠 Static GK &amp; Memory Hints: OFF&#x27;;
        });
      }

      if (resetFiltersBtn) {
        resetFiltersBtn.addEventListener(&#x27;click&#x27;, function () {
          if (searchInput) searchInput.value = &#x27;&#x27;;
          activeCategory = &#x27;all&#x27;;
          filterChips.forEach(function (c) {
            c.classList.toggle(&#x27;active&#x27;, c.getAttribute(&#x27;data-filter&#x27;) === &#x27;all&#x27;);
          });
          applyFilters();
        });
      }

      if (printNotesBtn) {
        printNotesBtn.addEventListener(&#x27;click&#x27;, function () {
          window.print();
        });
      }
    })();
  &lt;/script&gt;

      accent-color: var(--tcs-blue);
      cursor: pointer;
      flex-shrink: 0;
    }

    .option-text {
      font-size: 0.96rem;
      color: var(--text-primary);
      line-height: 1.45;
    }

    /* Pinned Bottom Exam Action Bar (Always Visible) */
    .exam-footer-bar {
      background: #f8fafc;
      border-top: 1px solid var(--border-color);
      padding: 10px 18px;
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .footer-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn-exam {
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 0.86rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-primary);
      transition: background 0.12s ease;
    }

    .btn-exam:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .btn-exam:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-mark {
      background: #f3e8ff;
      color: #581c87;
      border-color: #c084fc;
    }

    .btn-mark:hover {
      background: #e9d5ff;
    }

    .btn-next {
      background: var(--tcs-blue);
      color: #ffffff;
      border-color: var(--tcs-blue-dark);
    }

    .btn-next:hover {
      background: var(--tcs-blue-dark);
    }

    .btn-submit-exam {
      background: #15803d;
      color: #ffffff;
      border-color: #166534;
    }

    .btn-submit-exam:hover {
      background: #166534;
    }

    /* Right Side Small Question-Number Palette */
    .exam-sidebar {
      width: 265px;
      flex-shrink: 0;
      border-left: 1px solid var(--border-color);
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .palette-legend-box {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      flex-shrink: 0;
    }

    .palette-legend-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 6px;
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    .pl-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pl-row.full-span {
      grid-column: 1 / -1;
    }

    .palette-heading {
      background: var(--tcs-blue-light);
      color: var(--tcs-blue-dark);
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    /* Independently Scrollable Question Number Grid */
    .palette-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      min-height: 0;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .p-btn {
      height: 34px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: var(--st-not-visited);
      color: var(--st-not-visited-text);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .p-btn.st-not-answered {
      background: var(--st-not-answered);
      color: #ffffff;
      border-color: #991b1b;
    }

    .p-btn.st-answered {
      background: var(--st-answered);
      color: #ffffff;
      border-color: #1b5e20;
    }

    .p-btn.st-marked {
      background: var(--st-marked);
      color: #ffffff;
      border-color: #4a148c;
      border-radius: 50%;
    }

    .p-btn.st-marked-ans {
      background: var(--st-marked);
      color: #ffffff;
      border-color: #4a148c;
      border-radius: 50%;
    }

    .p-btn.st-marked-ans::after {
      content: &#x27;&#x27;;
      width: 9px;
      height: 9px;
      background: #22c55e;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      bottom: -2px;
      right: -2px;
    }

    .p-btn.is-current {
      outline: 2.5px solid #1d4ed8;
      outline-offset: 2px;
    }

    /* Hide right-side question palette on mobile phones */
    @media (max-width: 768px) {
      .exam-sidebar {
        display: none !important;
      }
      .exam-header {
        padding: 0 10px;
      }
      .exam-title-bar {
        font-size: 0.86rem;
      }
      .question-scroll-area {
        padding: 14px 14px;
      }
      .exam-footer-bar {
        padding: 8px 10px;
      }
      .btn-exam {
        padding: 7px 10px;
        font-size: 0.8rem;
      }
      .mock-grid {
        grid-template-columns: 1fr;
      }
    }

    /* =========================================================================
       VIEW 4: SUBMISSION RESULT &amp; ANALYSIS SCREEN
       ========================================================================= */
    .result-wrapper {
      min-height: 100vh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
    }

    .result-body {
      max-width: 1040px;
      width: 100%;
      margin: 22px auto 48px;
      padding: 0 18px;
      flex: 1;
    }

    .score-banner {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--tcs-blue);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    .score-banner-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .score-banner-top h2 {
      font-size: 1.24rem;
      color: var(--tcs-blue-dark);
    }

    .score-metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
    }

    .metric-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      text-align: center;
    }

    .metric-box .m-val {
      display: block;
      font-size: 1.38rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .metric-box .m-lbl {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .m-score .m-val { color: var(--tcs-blue); }
    .m-correct .m-val { color: #15803d; }
    .m-wrong .m-val { color: #b91c1c; }
    .m-unatt .m-val { color: #475569; }

    .solutions-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .solutions-header h3 {
      font-size: 1.08rem;
      color: var(--text-primary);
    }

    .sol-filter-group {
      display: flex;
      gap: 6px;
    }

    .sol-filter-btn {
      padding: 5px 11px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-secondary);
    }

    .sol-filter-btn.active {
      background: var(--tcs-blue);
      color: #ffffff;
      border-color: var(--tcs-blue);
    }

    .sol-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-left: 4px solid #64748b;
      border-radius: 6px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .sol-card.sol-wrong {
      border-left-color: #c62828;
    }

    .sol-card.sol-unattempted {
      border-left-color: #d97706;
    }

    .sol-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sol-q-num {
      font-weight: 700;
      color: var(--tcs-blue-dark);
      font-size: 0.9rem;
    }

    .sol-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .sol-badge.badge-wrong { background: #fee2e2; color: #991b1b; }
    .sol-badge.badge-unatt { background: #fef3c7; color: #92400e; }

    .sol-q-text {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .sol-answers {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .sol-user-ans {
      color: #991b1b;
      font-weight: 600;
    }

    .sol-correct-ans {
      color: #166534;
      font-weight: 700;
    }

    .sol-exp {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 9px 12px;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .all-correct-box {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: #166534;
      font-weight: 600;
    }

    /* =========================================================================
       MODALS (PAUSE, SUBMIT CONFIRM, RESET CONFIRM)
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      max-width: 460px;
      width: 100%;
      padding: 22px 24px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
    }

    .modal-card h3 {
      font-size: 1.12rem;
      color: var(--tcs-blue-dark);
      margin-bottom: 10px;
    }

    .modal-card p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .modal-summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 18px;
      font-size: 0.88rem;
    }

    .modal-summary-table td {
      padding: 7px 10px;
      border: 1px solid var(--border-color);
    }

    .modal-summary-table td:last-child {
      text-align: right;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

  &lt;!-- =========================================================================
       VIEW 1: MAIN DASHBOARD
       ========================================================================= --&gt;
  &lt;div id=&quot;view-dashboard&quot; class=&quot;dash-wrapper&quot;&gt;
    &lt;header class=&quot;dash-header&quot;&gt;
      &lt;div class=&quot;dash-header-inner&quot;&gt;
        &lt;div class=&quot;dash-brand&quot;&gt;
          &lt;h1&gt;September 2026 Current Affairs — Mock Test Dashboard&lt;/h1&gt;
          &lt;p&gt;SSC &amp;amp; Railway CBT Pattern | +2.0 Correct, -0.5 Incorrect | 36 Seconds per Question&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;dash-header-actions&quot;&gt;
          &lt;span id=&quot;dashCompletedPill&quot; class=&quot;dash-stat-pill&quot;&gt;Completed: 0 / 10&lt;/span&gt;
          &lt;button type=&quot;button&quot; id=&quot;btnResetStorage&quot; class=&quot;btn-outline-light&quot;&gt;Clear Saved Scores&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;main class=&quot;dash-main&quot;&gt;
      &lt;div class=&quot;dash-summary-bar&quot;&gt;
        &lt;div class=&quot;summary-meta&quot;&gt;
          &lt;span&gt;&lt;strong&gt;Total Mock Tests:&lt;/strong&gt; 10 Topics&lt;/span&gt;
          &lt;span&gt;&lt;strong&gt;Total Questions:&lt;/strong&gt; &lt;span id=&quot;dashTotalQs&quot;&gt;0&lt;/span&gt; MCQs&lt;/span&gt;
          &lt;span&gt;&lt;strong&gt;Marking Scheme:&lt;/strong&gt; +2 / -0.5&lt;/span&gt;
          &lt;span&gt;&lt;strong&gt;Timer Rule:&lt;/strong&gt; 36 sec / Q (Auto-Submit)&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div id=&quot;mockGrid&quot; class=&quot;mock-grid&quot;&gt;&lt;/div&gt;
    &lt;/main&gt;
  &lt;/div&gt;

  &lt;!-- =========================================================================
       VIEW 2: INTRODUCTORY INSTRUCTIONS SCREEN
       ========================================================================= --&gt;
  &lt;div id=&quot;view-intro&quot; class=&quot;intro-wrapper hidden&quot;&gt;
    &lt;header class=&quot;intro-topbar&quot;&gt;
      &lt;h2 id=&quot;introTopTitle&quot;&gt;Mock Test Instructions&lt;/h2&gt;
      &lt;button type=&quot;button&quot; id=&quot;btnIntroBackTop&quot; class=&quot;btn-outline-light&quot;&gt;Back to Dashboard&lt;/button&gt;
    &lt;/header&gt;

    &lt;div class=&quot;intro-body&quot;&gt;
      &lt;div class=&quot;intro-card&quot;&gt;
        &lt;h3 id=&quot;introTestTitle&quot;&gt;Test Instructions&lt;/h3&gt;

        &lt;div class=&quot;intro-meta-grid&quot;&gt;
          &lt;div class=&quot;intro-meta-item&quot;&gt;
            &lt;span&gt;Total Questions&lt;/span&gt;
            &lt;strong id=&quot;introQCount&quot;&gt;25 MCQs&lt;/strong&gt;
          &lt;/div&gt;
          &lt;div class=&quot;intro-meta-item&quot;&gt;
            &lt;span&gt;Duration&lt;/span&gt;
            &lt;strong id=&quot;introDuration&quot;&gt;15 min 00 sec&lt;/strong&gt;
          &lt;/div&gt;
          &lt;div class=&quot;intro-meta-item&quot;&gt;
            &lt;span&gt;Maximum Marks&lt;/span&gt;
            &lt;strong id=&quot;introMaxMarks&quot;&gt;50 Marks&lt;/strong&gt;
          &lt;/div&gt;
          &lt;div class=&quot;intro-meta-item&quot;&gt;
            &lt;span&gt;Marking Scheme&lt;/span&gt;
            &lt;strong&gt;+2.0 / -0.5&lt;/strong&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;ol class=&quot;inst-list&quot;&gt;
          &lt;li&gt;Each question carries &lt;strong&gt;+2 marks&lt;/strong&gt; for a correct response and &lt;strong&gt;-0.5 marks&lt;/strong&gt; negative marking for an incorrect response. Unattempted questions carry &lt;strong&gt;0 marks&lt;/strong&gt;.&lt;/li&gt;
          &lt;li&gt;The countdown timer is set strictly at &lt;strong&gt;36 seconds per question&lt;/strong&gt;. When the timer reaches 00:00, the test will be submitted automatically.&lt;/li&gt;
          &lt;li&gt;One question is displayed at a time. Answer options are randomized on every attempt, while the question sequence remains fixed.&lt;/li&gt;
          &lt;li&gt;Selecting an option does not auto-advance to the next question. Use &lt;strong&gt;Next&lt;/strong&gt;, &lt;strong&gt;Previous&lt;/strong&gt;, &lt;strong&gt;Clear&lt;/strong&gt;, or &lt;strong&gt;Mark for Review &amp;amp; Next&lt;/strong&gt; to navigate.&lt;/li&gt;
          &lt;li&gt;Your score and detailed solutions (for &lt;strong&gt;incorrect and unattempted questions only&lt;/strong&gt;) will be displayed upon submission and saved in your browser.&lt;/li&gt;
          &lt;li&gt;The test enters &lt;strong&gt;Fullscreen Mode&lt;/strong&gt; automatically when started. You may exit fullscreen or pause the exam at any time from the top bar.&lt;/li&gt;
        &lt;/ol&gt;

        &lt;div class=&quot;legend-preview&quot;&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-not-visited&quot;&gt;1&lt;/span&gt; Not Visited&lt;/div&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-not-answered&quot;&gt;2&lt;/span&gt; Not Answered&lt;/div&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-answered&quot;&gt;3&lt;/span&gt; Answered&lt;/div&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-marked&quot;&gt;4&lt;/span&gt; Marked for Review&lt;/div&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-marked-ans&quot;&gt;5&lt;/span&gt; Answered &amp;amp; Marked for Review&lt;/div&gt;
        &lt;/div&gt;

        &lt;label class=&quot;declaration-row&quot;&gt;
          &lt;input type=&quot;checkbox&quot; id=&quot;chkDeclaration&quot; checked /&gt;
          &lt;span&gt;I have read and understood the instructions. I am ready to begin this mock test in CBT mode.&lt;/span&gt;
        &lt;/label&gt;

        &lt;div id=&quot;introError&quot; class=&quot;intro-error&quot;&gt;&lt;/div&gt;

        &lt;div class=&quot;intro-footer-actions&quot;&gt;
          &lt;button type=&quot;button&quot; id=&quot;btnIntroBack&quot; class=&quot;btn-secondary&quot;&gt;Back to Dashboard&lt;/button&gt;
          &lt;button type=&quot;button&quot; id=&quot;btnStartTest&quot; class=&quot;btn-start-exam&quot;&gt;Start Test&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- =========================================================================
       VIEW 3: LIVE EXAM INTERFACE (TCS iON / EDUQUITY)
       ========================================================================= --&gt;
  &lt;div id=&quot;view-exam&quot; class=&quot;exam-shell hidden&quot;&gt;
    &lt;header class=&quot;exam-header&quot;&gt;
      &lt;div class=&quot;exam-header-left&quot;&gt;
        &lt;span id=&quot;examTitleBar&quot; class=&quot;exam-title-bar&quot;&gt;Mock Test&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;exam-header-right&quot;&gt;
        &lt;div id=&quot;examTimerBox&quot; class=&quot;timer-box&quot;&gt;Time Left: &lt;span id=&quot;examTimerText&quot;&gt;15:00&lt;/span&gt;&lt;/div&gt;
        &lt;button type=&quot;button&quot; id=&quot;btnPauseExam&quot; class=&quot;btn-header-tool&quot;&gt;Pause&lt;/button&gt;
        &lt;button type=&quot;button&quot; id=&quot;btnToggleFullscreen&quot; class=&quot;btn-header-tool&quot;&gt;Exit Fullscreen&lt;/button&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;div class=&quot;exam-workspace&quot;&gt;
      &lt;!-- Left Main Question Panel --&gt;
      &lt;section class=&quot;exam-main-col&quot;&gt;
        &lt;div class=&quot;question-meta-strip&quot;&gt;
          &lt;span id=&quot;qNumberLabel&quot; class=&quot;q-number-label&quot;&gt;Question No. 1 of 25&lt;/span&gt;
          &lt;span class=&quot;q-marks-label&quot;&gt;
            &lt;span class=&quot;mark-pos&quot;&gt;+2.0&lt;/span&gt;
            &lt;span class=&quot;mark-neg&quot;&gt;-0.5&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;

        &lt;div id=&quot;questionScrollArea&quot; class=&quot;question-scroll-area&quot;&gt;
          &lt;div id=&quot;questionStem&quot; class=&quot;question-stem&quot;&gt;&lt;/div&gt;
          &lt;div id=&quot;optionsContainer&quot; class=&quot;options-container&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;exam-footer-bar&quot;&gt;
          &lt;div class=&quot;footer-btn-group&quot;&gt;
            &lt;button type=&quot;button&quot; id=&quot;btnPrev&quot; class=&quot;btn-exam&quot;&gt;Previous&lt;/button&gt;
            &lt;button type=&quot;button&quot; id=&quot;btnClear&quot; class=&quot;btn-exam&quot;&gt;Clear&lt;/button&gt;
            &lt;button type=&quot;button&quot; id=&quot;btnMarkNext&quot; class=&quot;btn-exam btn-mark&quot;&gt;Mark for Review &amp;amp; Next&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;footer-btn-group&quot;&gt;
            &lt;button type=&quot;button&quot; id=&quot;btnNext&quot; class=&quot;btn-exam btn-next&quot;&gt;Next&lt;/button&gt;
            &lt;button type=&quot;button&quot; id=&quot;btnSubmitExam&quot; class=&quot;btn-exam btn-submit-exam&quot;&gt;Submit&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;!-- Right Small Question-Number Palette (Hidden on Mobile) --&gt;
      &lt;aside class=&quot;exam-sidebar&quot; aria-label=&quot;Question Palette&quot;&gt;
        &lt;div class=&quot;palette-legend-box&quot;&gt;
          &lt;div class=&quot;palette-legend-grid&quot;&gt;
            &lt;div class=&quot;pl-row&quot;&gt;&lt;span id=&quot;cntAnswered&quot; class=&quot;swatch sw-answered&quot;&gt;0&lt;/span&gt; Answered&lt;/div&gt;
            &lt;div class=&quot;pl-row&quot;&gt;&lt;span id=&quot;cntNotAnswered&quot; class=&quot;swatch sw-not-answered&quot;&gt;0&lt;/span&gt; Not Answered&lt;/div&gt;
            &lt;div class=&quot;pl-row&quot;&gt;&lt;span id=&quot;cntNotVisited&quot; class=&quot;swatch sw-not-visited&quot;&gt;0&lt;/span&gt; Not Visited&lt;/div&gt;
            &lt;div class=&quot;pl-row&quot;&gt;&lt;span id=&quot;cntMarked&quot; class=&quot;swatch sw-marked&quot;&gt;0&lt;/span&gt; Marked&lt;/div&gt;
            &lt;div class=&quot;pl-row full-span&quot;&gt;&lt;span id=&quot;cntMarkedAns&quot; class=&quot;swatch sw-marked-ans&quot;&gt;0&lt;/span&gt; Answered &amp;amp; Marked for Review&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;palette-heading&quot;&gt;Question Palette&lt;/div&gt;
        &lt;div class=&quot;palette-scroll-area&quot;&gt;
          &lt;div id=&quot;paletteGrid&quot; class=&quot;palette-grid&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/aside&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- =========================================================================
       VIEW 4: SUBMISSION SCORE &amp; ANALYSIS SCREEN
       ========================================================================= --&gt;
  &lt;div id=&quot;view-result&quot; class=&quot;result-wrapper hidden&quot;&gt;

      /* -----------------------------------------------------------------------

      function loadSavedResults() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      function saveTestResult(testId, record) {
        try {
          const all = loadSavedResults();
          all[testId] = record;
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
        } catch (e) {
          // Ignore storage quota or sandbox restrictions
        }
      }

      function clearAllSavedResults() {
        try {
          window.localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
          // Ignore
        }
      }

      /* -----------------------------------------------------------------------
         UTILITIES
         ----------------------------------------------------------------------- */
      function formatSeconds(totalSec) {
        const s = Math.max(0, Math.floor(totalSec));
        const m = Math.floor(s / 60);
        const rem = s % 60;
        return String(m).padStart(2, &#x27;0&#x27;) + &#x27;:&#x27; + String(rem).padStart(2, &#x27;0&#x27;);
      }

      function formatDurationReadable(totalSec) {
        const m = Math.floor(totalSec / 60);
        const rem = totalSec % 60;
        return rem === 0 ? m + &#x27; min&#x27; : m + &#x27; min &#x27; + rem + &#x27; sec&#x27;;
      }

      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i &gt; 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      function enterFullscreenSafe() {
        try {
          const el = document.documentElement;
          if (!document.fullscreenElement &amp;&amp; el.requestFullscreen) {
            const p = el.requestFullscreen();
            if (p &amp;&amp; typeof p.catch === &#x27;function&#x27;) p.catch(function () {});
          }
        } catch (e) {}
      }

      function exitFullscreenSafe() {
        try {
          if (document.fullscreenElement &amp;&amp; document.exitFullscreen) {
            const p = document.exitFullscreen();
            if (p &amp;&amp; typeof p.catch === &#x27;function&#x27;) p.catch(function () {});
          }
        } catch (e) {}
      }
