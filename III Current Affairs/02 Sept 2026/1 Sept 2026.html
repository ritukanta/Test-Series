    (function () {
      const searchInput = document.getElementById(&#x27;searchInput&#x27;);
      const filterChips = document.querySelectorAll(&#x27;.filter-chip&#x27;);
      const sections = document.querySelectorAll(&#x27;.ca-section&#x27;);
      const toggleHighlightBtn = document.getElementById(&#x27;toggleHighlightBtn&#x27;);
      const toggleStaticBtn = document.getElementById(&#x27;toggleStaticBtn&#x27;);
      const resetFiltersBtn = document.getElementById(&#x27;resetFiltersBtn&#x27;);
      const printNotesBtn = document.getElementById(&#x27;printNotesBtn&#x27;);
      const searchStatus = document.getElementById(&#x27;searchStatus&#x27;);

      let activeCategory = &#x27;all&#x27;;

      function applyFilters() {
        const query = (searchInput.value || &#x27;&#x27;).trim().toLowerCase();
        let visibleCardsAndRows = 0;

        sections.forEach(function (sec) {
          const secCat = sec.getAttribute(&#x27;data-category&#x27;);
          const categoryMatch = (activeCategory === &#x27;all&#x27; || activeCategory === secCat);

          if (!categoryMatch) {
            sec.style.display = &#x27;none&#x27;;
            return;
          }

          if (!query) {
            sec.style.display = &#x27;block&#x27;;
            sec.querySelectorAll(&#x27;.ca-card, tbody tr, .table-wrapper, .cards-grid, .cards-grid-3, .sub-heading&#x27;).forEach(function (el) {
              el.style.display = &#x27;&#x27;;
            });
            return;
          }

          let sectionHasMatch = false;

          sec.querySelectorAll(&#x27;.cards-grid, .cards-grid-3&#x27;).forEach(function (grid) {
            let gridHasMatch = false;
            grid.querySelectorAll(&#x27;.ca-card&#x27;).forEach(function (card) {
              const text = (card.textContent || &#x27;&#x27;).toLowerCase();
              if (text.indexOf(query) !== -1) {
                card.style.display = &#x27;&#x27;;
                gridHasMatch = true;
                sectionHasMatch = true;
                visibleCardsAndRows++;
              } else {
                card.style.display = &#x27;none&#x27;;
              }
            });
            grid.style.display = gridHasMatch ? &#x27;&#x27; : &#x27;none&#x27;;
          });

          sec.querySelectorAll(&#x27;.table-wrapper&#x27;).forEach(function (wrap) {
            let tableHasMatch = false;
            wrap.querySelectorAll(&#x27;tbody tr&#x27;).forEach(function (row) {
              const text = (row.textContent || &#x27;&#x27;).toLowerCase();
              if (text.indexOf(query) !== -1) {
                row.style.display = &#x27;&#x27;;
                tableHasMatch = true;
                sectionHasMatch = true;
                visibleCardsAndRows++;
              } else {
                row.style.display = &#x27;none&#x27;;
              }
            });
            wrap.style.display = tableHasMatch ? &#x27;&#x27; : &#x27;none&#x27;;
          });

          sec.querySelectorAll(&#x27;.sub-heading&#x27;).forEach(function (heading) {
            let nextEl = heading.nextElementSibling;
            let hasVisibleContent = false;
            while (nextEl &amp;&amp; !nextEl.classList.contains(&#x27;sub-heading&#x27;)) {
              if (nextEl.style.display !== &#x27;none&#x27;) {
                hasVisibleContent = true;
                break;
              }
              nextEl = nextEl.nextElementSibling;
            }
            heading.style.display = hasVisibleContent ? &#x27;&#x27; : &#x27;none&#x27;;
          });

          sec.style.display = sectionHasMatch ? &#x27;block&#x27; : &#x27;none&#x27;;
        });

        if (query) {
          searchStatus.style.display = &#x27;block&#x27;;
          searchStatus.textContent = &#x27;Showing &#x27; + visibleCardsAndRows + &#x27; matching current affairs entries for &quot;&#x27; + searchInput.value.trim() + &#x27;&quot;.&#x27;;
        } else {
          searchStatus.style.display = &#x27;none&#x27;;
          searchStatus.textContent = &#x27;&#x27;;
        }
      }

      if (searchInput) searchInput.addEventListener(&#x27;input&#x27;, applyFilters);

      filterChips.forEach(function (chip) {
        chip.addEventListener(&#x27;click&#x27;, function () {
          filterChips.forEach(function (c) { c.classList.remove(&#x27;active&#x27;); });
          chip.classList.add(&#x27;active&#x27;);
          activeCategory = chip.getAttribute(&#x27;data-filter&#x27;) || &#x27;all&#x27;;
          applyFilters();
        });
      });

      if (toggleHighlightBtn) {
        toggleHighlightBtn.addEventListener(&#x27;click&#x27;, function () {
          document.body.classList.toggle(&#x27;exam-highlight-active&#x27;);
          const isOn = document.body.classList.contains(&#x27;exam-highlight-active&#x27;);
          toggleHighlightBtn.classList.toggle(&#x27;active&#x27;, isOn);
          toggleHighlightBtn.textContent = isOn ? &#x27;★ High-Yield Highlights: ON&#x27; : &#x27;☆ High-Yield Highlights: OFF&#x27;;
        });
      }

      if (toggleStaticBtn) {
        toggleStaticBtn.addEventListener(&#x27;click&#x27;, function () {
          document.body.classList.toggle(&#x27;hide-static&#x27;);
          const isVisible = !document.body.classList.contains(&#x27;hide-static&#x27;);
          toggleStaticBtn.classList.toggle(&#x27;active&#x27;, isVisible);
          toggleStaticBtn.textContent = isVisible ? &#x27;🧠 Static GK Links: ON&#x27; : &#x27;🧠 Static GK Links: OFF&#x27;;
        });
      }

      if (resetFiltersBtn) {
        resetFiltersBtn.addEventListener(&#x27;click&#x27;, function () {
          if (searchInput) searchInput.value = &#x27;&#x27;;
          activeCategory = &#x27;all&#x27;;
          filterChips.forEach(function (c) {
            c.classList.toggle(&#x27;active&#x27;, c.getAttribute(&#x27;data-filter&#x27;) === &#x27;all&#x27;);
          });
          applyFilters();
        });
      }

      if (printNotesBtn) {
        printNotesBtn.addEventListener(&#x27;click&#x27;, function () {
          window.print();
        });
      }
    })();
  &lt;/script&gt;

    .dash-summary-bar .summary-meta strong {
      color: var(--text-primary);
    }

    .mock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }

    .mock-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .mock-card:hover {
      border-color: var(--tcs-blue);
      box-shadow: 0 4px 14px rgba(26, 79, 139, 0.08);
    }

    .mock-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .mock-num {
      display: inline-block;
      background: var(--tcs-blue-light);
      color: var(--tcs-blue);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .mock-status-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .tag-attempted {
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #a5d6a7;
    }

    .tag-pending {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .mock-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 8px;
    }

    .mock-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .mock-saved-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.83rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mock-saved-box strong {
      color: var(--tcs-blue);
    }

    .mock-card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn-primary {
      background: var(--tcs-blue);
      color: #ffffff;
      border: 1px solid var(--tcs-blue-dark);
      padding: 9px 14px;
      border-radius: 5px;
      font-size: 0.88rem;
      font-weight: 600;
      flex: 1;
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--tcs-blue-dark);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--tcs-blue);
      border: 1px solid var(--tcs-blue);
      padding: 9px 12px;
      border-radius: 5px;
      font-size: 0.86rem;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--tcs-blue-light);
    }

    /* =========================================================================
       VIEW 2: INTRODUCTORY INSTRUCTIONS SCREEN
       ========================================================================= */
    .intro-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
    }

    .intro-topbar {
      background: var(--tcs-blue);
      color: #ffffff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--tcs-blue-dark);
    }

    .intro-topbar h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .intro-body {
      max-width: 920px;
      width: 100%;
      margin: 24px auto;
      padding: 0 18px 32px;
      flex: 1;
    }

    .intro-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px 28px;
    }

    .intro-card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--tcs-blue);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .intro-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .intro-meta-item {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
    }

    .intro-meta-item span {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .intro-meta-item strong {
      font-size: 1.02rem;
      color: var(--text-primary);
    }

    .inst-list {
      padding-left: 20px;
      margin-bottom: 18px;
      color: var(--text-secondary);
      font-size: 0.92rem;
    }

    .inst-list li {
      margin-bottom: 7px;
    }

    .legend-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.84rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      position: relative;
      flex-shrink: 0;
    }

    .sw-not-visited { background: var(--st-not-visited); color: var(--st-not-visited-text); border: 1px solid #cbd5e1; }
    .sw-not-answered { background: var(--st-not-answered); color: #ffffff; }
    .sw-answered { background: var(--st-answered); color: #ffffff; }
    .sw-marked { background: var(--st-marked); color: #ffffff; border-radius: 50%; }
    .sw-marked-ans { background: var(--st-marked); color: #ffffff; border-radius: 50%; }
    .sw-marked-ans::after {
      content: &#x27;&#x27;;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      bottom: -2px;
      right: -2px;
    }

    .declaration-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      color: var(--text-primary);
    }

    .declaration-row input {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .intro-error {
      color: #b91c1c;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 10px;
      min-height: 18px;
    }

    .intro-footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-start-exam {
      background: #2e7d32;
      color: #ffffff;
      border: 1px solid #1b5e20;
      padding: 11px 26px;
      border-radius: 5px;
      font-size: 0.96rem;
      font-weight: 700;
    }

    .btn-start-exam:hover {
      background: #1b5e20;
    }

    /* =========================================================================
       VIEW 3: TCS iON / EDUQUITY LIVE EXAM INTERFACE (FIXED VIEWPORT, NO PAGE SCROLL)
       ========================================================================= */
    .exam-shell {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      overflow: hidden;
    }

    .exam-header {
      background: var(--tcs-blue);
      color: #ffffff;
      padding: 0 16px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px solid var(--tcs-blue-dark);
    }

    .exam-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .exam-title-bar {
      font-size: 0.98rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .exam-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .timer-box {
      background: #ffffff;
      color: var(--tcs-blue-dark);
      font-weight: 700;
      font-size: 0.94rem;
      padding: 5px 11px;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .timer-box.timer-low {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #f87171;
    }

    .btn-header-tool {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn-header-tool:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Main Split Body */
    .exam-workspace {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* Left Question Panel */
    .exam-main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg-surface);
    }

    .question-meta-strip {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border-color);
      padding: 9px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
    }

    .q-number-label {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--tcs-blue-dark);
    }

    .q-marks-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      gap: 10px;
    }

    .mark-pos { color: #15803d; }
    .mark-neg { color: #b91c1c; }

    /* Independently Scrollable Question Container */
    .question-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      min-height: 0;
    }

    .question-stem {
      font-size: 1.03rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 18px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 820px;
    }

    .option-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
      user-select: none;
    }

    .option-row:hover {
      background: #f8fafc;
      border-color: var(--tcs-blue);
    }

    .option-row.selected {
      background: #eff6ff;
      border-color: var(--tcs-blue);
    }

    .option-row input[type=&quot;radio&quot;] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--tcs-blue);
      cursor: pointer;
      flex-shrink: 0;
    }

    .option-text {
      font-size: 0.96rem;
      color: var(--text-primary);
      line-height: 1.45;
    }

    /* Pinned Bottom Exam Action Bar (Always Visible) */
    .exam-footer-bar {
      background: #f8fafc;
      border-top: 1px solid var(--border-color);
      padding: 10px 18px;
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .footer-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn-exam {
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 0.86rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-primary);
      transition: background 0.12s ease;
    }

    .btn-exam:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .btn-exam:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-mark {
      background: #f3e8ff;
      color: #581c87;
      border-color: #c084fc;
    }

    .btn-mark:hover {
      background: #e9d5ff;
    }

    .btn-next {
      background: var(--tcs-blue);
      color: #ffffff;
      border-color: var(--tcs-blue-dark);
    }

    .btn-next:hover {
      background: var(--tcs-blue-dark);
    }

    .btn-submit-exam {
      background: #15803d;
      color: #ffffff;
      border-color: #166534;
    }

    .btn-submit-exam:hover {
      background: #166534;
    }

    /* Right Side Small Question-Number Palette */
    .exam-sidebar {
      width: 265px;
      flex-shrink: 0;
      border-left: 1px solid var(--border-color);
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .palette-legend-box {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      flex-shrink: 0;
    }

    .palette-legend-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 6px;
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    .pl-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pl-row.full-span {
      grid-column: 1 / -1;
    }

    .palette-heading {
      background: var(--tcs-blue-light);
      color: var(--tcs-blue-dark);
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    /* Independently Scrollable Question Number Grid */
    .palette-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      min-height: 0;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .p-btn {
      height: 34px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: var(--st-not-visited);
      color: var(--st-not-visited-text);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .p-btn.st-not-answered {
      background: var(--st-not-answered);
      color: #ffffff;
      border-color: #991b1b;
    }

    .p-btn.st-answered {
      background: var(--st-answered);
      color: #ffffff;
      border-color: #1b5e20;
    }

    .p-btn.st-marked {
      background: var(--st-marked);
      color: #ffffff;
      border-color: #4a148c;
      border-radius: 50%;
    }

    .p-btn.st-marked-ans {
      background: var(--st-marked);
      color: #ffffff;
      border-color: #4a148c;
      border-radius: 50%;
    }

    .p-btn.st-marked-ans::after {
      content: &#x27;&#x27;;
      width: 9px;
      height: 9px;
      background: #22c55e;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      bottom: -2px;
      right: -2px;
    }

    .p-btn.is-current {
      outline: 2.5px solid #1d4ed8;
      outline-offset: 2px;
    }

    /* Hide right-side question palette on mobile phones */
    @media (max-width: 768px) {
      .exam-sidebar {
        display: none !important;
      }
      .exam-header {
        padding: 0 10px;
      }
      .exam-title-bar {
        font-size: 0.86rem;
      }
      .question-scroll-area {
        padding: 14px 14px;
      }
      .exam-footer-bar {
        padding: 8px 10px;
      }
      .btn-exam {
        padding: 7px 10px;
        font-size: 0.8rem;
      }
      .mock-grid {
        grid-template-columns: 1fr;
      }
    }

    /* =========================================================================
       VIEW 4: SUBMISSION RESULT &amp; ANALYSIS SCREEN
       ========================================================================= */
    .result-wrapper {
      min-height: 100vh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
    }

    .result-body {
      max-width: 1040px;
      width: 100%;
      margin: 22px auto 48px;
      padding: 0 18px;
      flex: 1;
    }

    .score-banner {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--tcs-blue);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    .score-banner-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .score-banner-top h2 {
      font-size: 1.24rem;
      color: var(--tcs-blue-dark);
    }

    .score-metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
    }

    .metric-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      text-align: center;
    }

    .metric-box .m-val {
      display: block;
      font-size: 1.38rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .metric-box .m-lbl {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .m-score .m-val { color: var(--tcs-blue); }
    .m-correct .m-val { color: #15803d; }
    .m-wrong .m-val { color: #b91c1c; }
    .m-unatt .m-val { color: #475569; }

    .solutions-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .solutions-header h3 {
      font-size: 1.08rem;
      color: var(--text-primary);
    }

    .sol-filter-group {
      display: flex;
      gap: 6px;
    }

    .sol-filter-btn {
      padding: 5px 11px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-secondary);
    }

    .sol-filter-btn.active {
      background: var(--tcs-blue);
      color: #ffffff;
      border-color: var(--tcs-blue);
    }

    .sol-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-left: 4px solid #64748b;
      border-radius: 6px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .sol-card.sol-wrong {
      border-left-color: #c62828;
    }

    .sol-card.sol-unattempted {
      border-left-color: #d97706;
    }

    .sol-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sol-q-num {
      font-weight: 700;
      color: var(--tcs-blue-dark);
      font-size: 0.9rem;
    }

    .sol-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .sol-badge.badge-wrong { background: #fee2e2; color: #991b1b; }
    .sol-badge.badge-unatt { background: #fef3c7; color: #92400e; }

    .sol-q-text {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .sol-answers {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .sol-user-ans {
      color: #991b1b;
      font-weight: 600;
    }

    .sol-correct-ans {
      color: #166534;
      font-weight: 700;
    }

    .sol-exp {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 9px 12px;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .all-correct-box {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: #166534;
      font-weight: 600;
    }

    /* =========================================================================
       MODALS (PAUSE, SUBMIT CONFIRM, RESET CONFIRM)
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      max-width: 460px;
      width: 100%;
      padding: 22px 24px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
    }

    .modal-card h3 {
      font-size: 1.12rem;
      color: var(--tcs-blue-dark);
      margin-bottom: 10px;
    }

    .modal-card p {
      font-size: 0.9rem;

      text-align: right;
      font-weight: 700;

      gap: 10px;

  &lt;!-- =========================================================================

       ========================================================================= --&gt;
  &lt;div id=&quot;view-intro&quot; class=&quot;intro-wrapper hidden&quot;&gt;
    &lt;header class=&quot;intro-topbar&quot;&gt;
      &lt;h2 id=&quot;introTopTitle&quot;&gt;Mock Test Instructions&lt;/h2&gt;

    &lt;div class=&quot;intro-body&quot;&gt;
      &lt;div class=&quot;intro-card&quot;&gt;
        &lt;h3 id=&quot;introTestTitle&quot;&gt;Test Instructions&lt;/h3&gt;

        &lt;div class=&quot;intro-meta-grid&quot;&gt;
          &lt;div class=&quot;intro-meta-item&quot;&gt;
            &lt;span&gt;Total Questions&lt;/span&gt;
            &lt;strong id=&quot;introQCount&quot;&gt;25 MCQs&lt;/strong&gt;
          &lt;/div&gt;
          &lt;div class=&quot;intro-meta-item&quot;&gt;
            &lt;span&gt;Duration&lt;/span&gt;
            &lt;strong id=&quot;introDuration&quot;&gt;15 min 00 sec&lt;/strong&gt;
          &lt;/div&gt;
          &lt;div class=&quot;intro-meta-item&quot;&gt;
            &lt;span&gt;Maximum Marks&lt;/span&gt;
            &lt;strong id=&quot;introMaxMarks&quot;&gt;50 Marks&lt;/strong&gt;
          &lt;/div&gt;
          &lt;div class=&quot;intro-meta-item&quot;&gt;
            &lt;span&gt;Marking Scheme&lt;/span&gt;
            &lt;strong&gt;+2.0 / -0.5&lt;/strong&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;ol class=&quot;inst-list&quot;&gt;
          &lt;li&gt;Each question carries &lt;strong&gt;+2 marks&lt;/strong&gt; for a correct response and &lt;strong&gt;-0.5 marks&lt;/strong&gt; negative marking for an incorrect response. Unattempted questions carry &lt;strong&gt;0 marks&lt;/strong&gt;.&lt;/li&gt;
          &lt;li&gt;The countdown timer is set strictly at &lt;strong&gt;36 seconds per question&lt;/strong&gt;. When the timer reaches 00:00, the test will be submitted automatically.&lt;/li&gt;
          &lt;li&gt;One question is displayed at a time. Answer options are randomized on every attempt, while the question sequence remains fixed.&lt;/li&gt;
          &lt;li&gt;Selecting an option does not auto-advance to the next question. Use &lt;strong&gt;Next&lt;/strong&gt;, &lt;strong&gt;Previous&lt;/strong&gt;, &lt;strong&gt;Clear&lt;/strong&gt;, or &lt;strong&gt;Mark for Review &amp;amp; Next&lt;/strong&gt; to navigate.&lt;/li&gt;
          &lt;li&gt;Your score and detailed solutions (for &lt;strong&gt;incorrect and unattempted questions only&lt;/strong&gt;) will be displayed upon submission and saved in your browser.&lt;/li&gt;
          &lt;li&gt;The test enters &lt;strong&gt;Fullscreen Mode&lt;/strong&gt; automatically when started. You may exit fullscreen or pause the exam at any time from the top bar.&lt;/li&gt;
        &lt;/ol&gt;

        &lt;div class=&quot;legend-preview&quot;&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-not-visited&quot;&gt;1&lt;/span&gt; Not Visited&lt;/div&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-not-answered&quot;&gt;2&lt;/span&gt; Not Answered&lt;/div&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-answered&quot;&gt;3&lt;/span&gt; Answered&lt;/div&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-marked&quot;&gt;4&lt;/span&gt; Marked for Review&lt;/div&gt;
          &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;swatch sw-marked-ans&quot;&gt;5&lt;/span&gt; Answered &amp;amp; Marked for Review&lt;/div&gt;

        &lt;div class=&quot;intro-footer-actions&quot;&gt;
          &lt;button type=&quot;button&quot; id=&quot;btnIntroBack&quot; class=&quot;btn-secondary&quot;&gt;Back to Dashboard&lt;/button&gt;
          &lt;button type=&quot;button&quot; id=&quot;btnStartTest&quot; class=&quot;btn-start-exam&quot;&gt;Start Test&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

       ========================================================================= --&gt;

            &lt;button type=&quot;button&quot; id=&quot;btnSubmitExam&quot; class=&quot;btn-exam btn-submit-exam&quot;&gt;Submit&lt;/button&gt;

    &lt;main class=&quot;result-body&quot;&gt;
      &lt;section class=&quot;score-banner&quot;&gt;
        &lt;div class=&quot;score-banner-top&quot;&gt;
          &lt;div&gt;
            &lt;h2 id=&quot;resultTestName&quot;&gt;Mock Test&lt;/h2&gt;
            &lt;p id=&quot;resultTimestamp&quot; style=&quot;font-size: 0.84rem; color: var(--text-muted); margin-top: 2px;&quot;&gt;&lt;/p&gt;

      &lt;h3&gt;Clear All Saved Scores?&lt;/h3&gt;

      &lt;div class=&quot;modal-actions&quot;&gt;
        &lt;button type=&quot;button&quot; id=&quot;btnCancelReset&quot; class=&quot;btn-secondary&quot;&gt;Cancel&lt;/button&gt;

    &lt;/div&gt;
  &lt;/div&gt;

      /* -----------------------------------------------------------------------
         STORAGE HELPERS (SANDBOX-SAFE)
         ----------------------------------------------------------------------- */
      function loadSavedResults() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      function saveTestResult(testId, record) {
        try {
          const all = loadSavedResults();
          all[testId] = record;
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
        } catch (e) {
          // Ignore storage quota or sandbox restrictions
        }
      }

      function clearAllSavedResults() {
        try {
          window.localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
          // Ignore
        }
      }

      /* -----------------------------------------------------------------------
         UTILITIES
         ----------------------------------------------------------------------- */
      function formatSeconds(totalSec) {
        const s = Math.max(0, Math.floor(totalSec));
        const m = Math.floor(s / 60);
        const rem = s % 60;
        return String(m).padStart(2, &#x27;0&#x27;) + &#x27;:&#x27; + String(rem).padStart(2, &#x27;0&#x27;);
      }

      function formatDurationReadable(totalSec) {
        const m = Math.floor(totalSec / 60);
        const rem = totalSec % 60;
        return rem === 0 ? m + &#x27; min&#x27; : m + &#x27; min &#x27; + rem + &#x27; sec&#x27;;
      }

      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i &gt; 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      function enterFullscreenSafe() {
        try {
          const el = document.documentElement;
          if (!document.fullscreenElement &amp;&amp; el.requestFullscreen) {
            const p = el.requestFullscreen();
            if (p &amp;&amp; typeof p.catch === &#x27;function&#x27;) p.catch(function () {});
          }
        } catch (e) {}
      }

      function exitFullscreenSafe() {
        try {
          if (document.fullscreenElement &amp;&amp; document.exitFullscreen) {
            const p = document.exitFullscreen();
            if (p &amp;&amp; typeof p.catch === &#x27;function&#x27;) p.catch(function () {});
          }
        } catch (e) {}
      }

      function updateFullscreenBtnLabel() {
        const btn = document.getElementById(&#x27;btnToggleFullscreen&#x27;);
        if (!btn) return;
        btn.textContent = document.fullscreenElement ? &#x27;Exit Fullscreen&#x27; : &#x27;Enter Fullscreen&#x27;;
      }

          const card = document.createElement(&#x27;article&#x27;);

                &#x27;&lt;span&gt;Accuracy: &lt;strong&gt;&#x27; + rec.accuracy + &#x27;%&lt;/strong&gt;&lt;/span&gt;&#x27; +

        document.getElementById(&#x27;introQCount&#x27;).textContent = qCount + &#x27; MCQs&#x27;;

      /* -----------------------------------------------------------------------
         LIVE EXAM INITIALIZATION &amp; ENGINE
         ----------------------------------------------------------------------- */
      function startExam() {
        if (!activeTest) return;
        if (!document.getElementById(&#x27;chkDeclaration&#x27;).checked) {
          document.getElementById(&#x27;introError&#x27;).textContent = &#x27;Please check the declaration box to start the mock test.&#x27;;
          return;
        }

        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        // Preserve exact question order; randomize ONLY the 4 options per question
        const preparedQuestions = activeTest.questions.map(function (item, idx) {
          const indexedOptions = item.options.map(function (optText, optIdx) {
            return { text: optText, origIdx: optIdx };
          });
          return {
            index: idx,
            q: item.q,
            options: shuffleArray(indexedOptions),
            correctOrigIdx: item.ans,
            exp: item.exp
          };
        });

        const totalDuration = preparedQuestions.length * 36;

        examState = {
          test: activeTest,
          questions: preparedQuestions,
          currentIndex: 0,
          answers: new Array(preparedQuestions.length).fill(null), // stores origIdx or null
          visited: new Array(preparedQuestions.length).fill(false),
          marked: new Array(preparedQuestions.length).fill(false),
          totalDuration: totalDuration,
          timeLeft: totalDuration,
          paused: false,
          submitted: false
        };

        examState.visited[0] = true;

        document.getElementById(&#x27;examTitleBar&#x27;).textContent =
          &#x27;Mock &#x27; + activeTest.num + &#x27;: &#x27; + activeTest.title;
        document.getElementById(&#x27;modalPause&#x27;).classList.add(&#x27;hidden&#x27;);
        document.getElementById(&#x27;modalSubmit&#x27;).classList.add(&#x27;hidden&#x27;);

        showView(&#x27;view-exam&#x27;);
        enterFullscreenSafe();
        updateFullscreenBtnLabel();

        renderQuestion();
        renderPalette();
        updateTimerUI();

        timerInterval = setInterval(function () {
          if (!examState || examState.paused || examState.submitted) return;
          examState.timeLeft -= 1;
          updateTimerUI();
          if (examState.timeLeft &lt;= 0) {
            submitExam(true);
          }
        }, 1000);
      }

      function updateTimerUI() {
        if (!examState) return;
        const textEl = document.getElementById(&#x27;examTimerText&#x27;);
        const boxEl = document.getElementById(&#x27;examTimerBox&#x27;);
        textEl.textContent = formatSeconds(examState.timeLeft);
        boxEl.classList.toggle(&#x27;timer-low&#x27;, examState.timeLeft &lt;= 120);
      }

      function renderQuestion() {
        if (!examState) return;
        const idx = examState.currentIndex;
        const total = examState.questions.length;
        const qObj = examState.questions[idx];
        const selectedOrigIdx = examState.answers[idx];

        document.getElementById(&#x27;qNumberLabel&#x27;).textContent = &#x27;Question No. &#x27; + (idx + 1) + &#x27; of &#x27; + total;
        document.getElementById(&#x27;questionStem&#x27;).textContent = qObj.q;

        const container = document.getElementById(&#x27;optionsContainer&#x27;);
        container.innerHTML = &#x27;&#x27;;

        qObj.options.forEach(function (opt, displayIdx) {
          const isSelected = selectedOrigIdx === opt.origIdx;
          const label = document.createElement(&#x27;label&#x27;);
          label.className = &#x27;option-row&#x27; + (isSelected ? &#x27; selected&#x27; : &#x27;&#x27;);

          const radio = document.createElement(&#x27;input&#x27;);
          radio.type = &#x27;radio&#x27;;
          radio.name = &#x27;mcq_option&#x27;;
          radio.value = String(opt.origIdx);
          radio.checked = isSelected;

          radio.addEventListener(&#x27;change&#x27;, function () {
            if (!examState || examState.paused || examState.submitted) return;
            examState.answers[idx] = opt.origIdx;
            // Update selection highlight without jumping or revealing correctness
            container.querySelectorAll(&#x27;.option-row&#x27;).forEach(function (row) {
              row.classList.remove(&#x27;selected&#x27;);
            });
            label.classList.add(&#x27;selected&#x27;);
            renderPalette();
          });

          const textSpan = document.createElement(&#x27;span&#x27;);
          textSpan.className = &#x27;option-text&#x27;;
          textSpan.textContent = String.fromCharCode(65 + displayIdx) + &#x27;. &#x27; + opt.text;

          label.appendChild(radio);
          label.appendChild(textSpan);
          container.appendChild(label);
        });

        document.getElementById(&#x27;btnPrev&#x27;).disabled = idx === 0;
        document.getElementById(&#x27;btnNext&#x27;).textContent = idx === total - 1 ? &#x27;Save&#x27; : &#x27;Next&#x27;;
        document.getElementById(&#x27;questionScrollArea&#x27;).scrollTop = 0;
      }

      function getStatusCounts() {
        let answered = 0;
        let notAnswered = 0;
        let notVisited = 0;
        let markedOnly = 0;
        let markedAndAnswered = 0;

        for (let i = 0; i &lt; examState.questions.length; i++) {
          const hasAns = examState.answers[i] !== null;
          const isMark = examState.marked[i];
          const isVis = examState.visited[i];

          if (isMark &amp;&amp; hasAns) markedAndAnswered++;
          else if (isMark &amp;&amp; !hasAns) markedOnly++;
          else if (hasAns) answered++;
          else if (isVis) notAnswered++;
          else notVisited++;
        }

        return {
          answered: answered,
          notAnswered: notAnswered,
          notVisited: notVisited,
          markedOnly: markedOnly,
          markedAndAnswered: markedAndAnswered
        };
      }

      function renderPalette() {
        if (!examState) return;
        const counts = getStatusCounts();

        document.getElementById(&#x27;cntAnswered&#x27;).textContent = String(counts.answered);
        document.getElementById(&#x27;cntNotAnswered&#x27;).textContent = String(counts.notAnswered);
        document.getElementById(&#x27;cntNotVisited&#x27;).textContent = String(counts.notVisited);
        document.getElementById(&#x27;cntMarked&#x27;).textContent = String(counts.markedOnly);
        document.getElementById(&#x27;cntMarkedAns&#x27;).textContent = String(counts.markedAndAnswered);

        const grid = document.getElementById(&#x27;paletteGrid&#x27;);
        grid.innerHTML = &#x27;&#x27;;

        for (let i = 0; i &lt; examState.questions.length; i++) {
          const btn = document.createElement(&#x27;button&#x27;);
          btn.type = &#x27;button&#x27;;
          btn.className = &#x27;p-btn&#x27;;
          btn.textContent = String(i + 1);

          const hasAns = examState.answers[i] !== null;
          const isMark = examState.marked[i];
          const isVis = examState.visited[i];

          if (isMark &amp;&amp; hasAns) btn.classList.add(&#x27;st-marked-ans&#x27;);
          else if (isMark) btn.classList.add(&#x27;st-marked&#x27;);
          else if (hasAns) btn.classList.add(&#x27;st-answered&#x27;);
          else if (isVis) btn.classList.add(&#x27;st-not-answered&#x27;);

          if (i === examState.currentIndex) btn.classList.add(&#x27;is-current&#x27;);

          btn.addEventListener(&#x27;click&#x27;, (function (targetIdx) {
            return function () {
              if (!examState || examState.paused || examState.submitted) return;
              examState.currentIndex = targetIdx;
              examState.visited[targetIdx] = true;
              renderQuestion();
              renderPalette();
            };
          })(i));

          grid.appendChild(btn);
        }
      }

      function goToQuestion(newIdx) {
        if (!examState) return;
        if (newIdx &lt; 0 || newIdx &gt;= examState.questions.length) return;
        examState.currentIndex = newIdx;
        examState.visited[newIdx] = true;
        renderQuestion();
        renderPalette();
      }

      /* -----------------------------------------------------------------------
         SUBMISSION &amp; ANALYSIS (SOLUTIONS ONLY FOR INCORRECT &amp; UNATTEMPTED)
         ----------------------------------------------------------------------- */
      function openSubmitModal() {
        if (!examState || examState.submitted) return;
        const c = getStatusCounts();
        document.getElementById(&#x27;subTotal&#x27;).textContent = String(examState.questions.length);
        document.getElementById(&#x27;subAnswered&#x27;).textContent = String(c.answered);
        document.getElementById(&#x27;subNotAnswered&#x27;).textContent = String(c.notAnswered);
        document.getElementById(&#x27;subMarked&#x27;).textContent = String(c.markedOnly);
        document.getElementById(&#x27;subMarkedAns&#x27;).textContent = String(c.markedAndAnswered);
        document.getElementById(&#x27;subNotVisited&#x27;).textContent = String(c.notVisited);
        document.getElementById(&#x27;modalSubmit&#x27;).classList.remove(&#x27;hidden&#x27;);
      }

      function submitExam(autoSubmitted) {
        if (!examState || examState.submitted) return;
        examState.submitted = true;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        document.getElementById(&#x27;modalSubmit&#x27;).classList.add(&#x27;hidden&#x27;);
        document.getElementById(&#x27;modalPause&#x27;).classList.add(&#x27;hidden&#x27;);
        exitFullscreenSafe();

        let correct = 0;
        let wrong = 0;
        let unattempted = 0;
        const reviewItems = []; // ONLY incorrect &amp; unattempted questions

        examState.questions.forEach(function (qObj, idx) {
          const userOrigIdx = examState.answers[idx];
          const correctText = examState.test.questions[idx].options[qObj.correctOrigIdx];

          if (userOrigIdx === null) {
            unattempted++;
            reviewItems.push({
              qNum: idx + 1,
              status: &#x27;unattempted&#x27;,
              q: qObj.q,
              userAnswer: null,
              correctAnswer: correctText,
              exp: qObj.exp
            });
          } else if (userOrigIdx === qObj.correctOrigIdx) {
            correct++;
          } else {
            wrong++;
            const userText = examState.test.questions[idx].options[userOrigIdx];
            reviewItems.push({
              qNum: idx + 1,
              status: &#x27;wrong&#x27;,
              q: qObj.q,
              userAnswer: userText,
              correctAnswer: correctText,
              exp: qObj.exp
            });
          }
        });

        const totalQs = examState.questions.length;
        const maxMarks = totalQs * 2;
        const score = (correct * 2) - (wrong * 0.5);
        const attempted = correct + wrong;
        const accuracy = attempted &gt; 0 ? Math.round((correct / attempted) * 100) : 0;
        const timeTaken = examState.totalDuration - examState.timeLeft;

        const record = {
          testId: examState.test.id,
          testNum: examState.test.num,
          testTitle: examState.test.title,
          totalQs: totalQs,
          maxMarks: maxMarks,
          score: score,
          correct: correct,
          wrong: wrong,
          unattempted: unattempted,
          accuracy: accuracy,
          timeTaken: timeTaken,
          autoSubmitted: !!autoSubmitted,
          timestamp: new Date().toLocaleString(),
          reviewItems: reviewItems
        };

        saveTestResult(examState.test.id, record);
        renderResultScreen(record);
      }

      function renderResultScreen(record) {
        currentResultRecord = record;
        currentSolFilter = &#x27;all&#x27;;

        activeTest = MOCK_TESTS.find(function (t) { return t.id === record.testId; }) || activeTest;

        document.getElementById(&#x27;resultTopTitle&#x27;).textContent = &#x27;Mock Test &#x27; + record.testNum + &#x27; — Analysis&#x27;;
        document.getElementById(&#x27;resultTestName&#x27;).textContent = record.testNum + &#x27;. &#x27; + record.testTitle;
        document.getElementById(&#x27;resultTimestamp&#x27;).textContent =
          &#x27;Submitted: &#x27; + record.timestamp + (record.autoSubmitted ? &#x27; (Auto-submitted on timeout)&#x27; : &#x27;&#x27;);

        document.getElementById(&#x27;resScore&#x27;).textContent = record.score.toFixed(1) + &#x27; / &#x27; + record.maxMarks;
        document.getElementById(&#x27;resCorrect&#x27;).textContent = String(record.correct);
        document.getElementById(&#x27;resWrong&#x27;).textContent = String(record.wrong);
        document.getElementById(&#x27;resUnatt&#x27;).textContent = String(record.unattempted);
        document.getElementById(&#x27;resAccuracy&#x27;).textContent = record.accuracy + &#x27;%&#x27;;
        document.getElementById(&#x27;resTimeTaken&#x27;).textContent = formatSeconds(record.timeTaken);

        document.querySelectorAll(&#x27;.sol-filter-btn&#x27;).forEach(function (btn) {
          btn.classList.toggle(&#x27;active&#x27;, btn.getAttribute(&#x27;data-sol-filter&#x27;) === &#x27;all&#x27;);
        });

        renderSolutionsList();
        showView(&#x27;view-result&#x27;);
      }

      function renderSolutionsList() {
        if (!currentResultRecord) return;
        const container = document.getElementById(&#x27;solutionsContainer&#x27;);
        const heading = document.getElementById(&#x27;solutionsHeading&#x27;);
        const items = currentResultRecord.reviewItems || [];

        const filtered = items.filter(function (item) {
          if (currentSolFilter === &#x27;all&#x27;) return true;
          return item.status === currentSolFilter;
        });

        heading.textContent =
          &#x27;Solutions for Incorrect &amp; Unattempted Questions (&#x27; + filtered.length + &#x27; shown)&#x27;;

        container.innerHTML = &#x27;&#x27;;

        if (items.length === 0) {
          container.innerHTML =
            &#x27;&lt;div class=&quot;all-correct-box&quot;&gt;All questions were answered correctly. There are no incorrect or unattempted questions to review.&lt;/div&gt;&#x27;;
          return;
        }

        if (filtered.length === 0) {
          container.innerHTML =
            &#x27;&lt;div class=&quot;all-correct-box&quot; style=&quot;background: #f8fafc; border-color: #cbd5e1; color: #334155;&quot;&gt;No questions match this filter.&lt;/div&gt;&#x27;;
          return;
        }

        filtered.forEach(function (item) {
          const card = document.createElement(&#x27;article&#x27;);
          card.className = &#x27;sol-card &#x27; + (item.status === &#x27;wrong&#x27; ? &#x27;sol-wrong&#x27; : &#x27;sol-unattempted&#x27;);

          const badgeHtml = item.status === &#x27;wrong&#x27;
            ? &#x27;&lt;span class=&quot;sol-badge badge-wrong&quot;&gt;Incorrect (-0.5)&lt;/span&gt;&#x27;
            : &#x27;&lt;span class=&quot;sol-badge badge-unatt&quot;&gt;Unattempted (0)&lt;/span&gt;&#x27;;

          const userAnsHtml = item.status === &#x27;wrong&#x27;
            ? &#x27;&lt;div class=&quot;sol-user-ans&quot;&gt;Your Answer: &#x27; + escapeHtml(item.userAnswer) + &#x27;&lt;/div&gt;&#x27;
            : &#x27;&lt;div class=&quot;sol-user-ans&quot; style=&quot;color: #92400e;&quot;&gt;Your Answer: Not Attempted&lt;/div&gt;&#x27;;

          card.innerHTML =
            &#x27;&lt;div class=&quot;sol-card-head&quot;&gt;&#x27; +
              &#x27;&lt;span class=&quot;sol-q-num&quot;&gt;Question &#x27; + item.qNum + &#x27;&lt;/span&gt;&#x27; +
              badgeHtml +
            &#x27;&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;sol-q-text&quot;&gt;&#x27; + escapeHtml(item.q) + &#x27;&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;sol-answers&quot;&gt;&#x27; +
              userAnsHtml +
              &#x27;&lt;div class=&quot;sol-correct-ans&quot;&gt;Correct Answer: &#x27; + escapeHtml(item.correctAnswer) + &#x27;&lt;/div&gt;&#x27; +
            &#x27;&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;sol-exp&quot;&gt;&lt;strong&gt;Solution:&lt;/strong&gt; &#x27; + escapeHtml(item.exp) + &#x27;&lt;/div&gt;&#x27;;

          container.appendChild(card);
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&amp;/g, &#x27;&amp;amp;&#x27;)
          .replace(/&lt;/g, &#x27;&amp;lt;&#x27;)
          .replace(/&gt;/g, &#x27;&amp;gt;&#x27;)
          .replace(/&quot;/g, &#x27;&amp;quot;&#x27;);
      }

      /* -----------------------------------------------------------------------
         EVENT LISTENERS
         ----------------------------------------------------------------------- */
      document.getElementById(&#x27;mockGrid&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
        const btn = e.target.closest(&#x27;button[data-action]&#x27;);
        if (!btn) return;
        const action = btn.getAttribute(&#x27;data-action&#x27;);
        const testId = btn.getAttribute(&#x27;data-test-id&#x27;);

        if (action === &#x27;open-intro&#x27;) {
          openIntro(testId);
        } else if (action === &#x27;view-analysis&#x27;) {
          const saved = loadSavedResults();
          if (saved[testId]) {
            renderResultScreen(saved[testId]);
          }
        }
      });

      document.getElementById(&#x27;btnIntroBackTop&#x27;).addEventListener(&#x27;click&#x27;, function () {
        renderDashboard();
        showView(&#x27;view-dashboard&#x27;);
      });

      document.getElementById(&#x27;btnIntroBack&#x27;).addEventListener(&#x27;click&#x27;, function () {
        renderDashboard();
        showView(&#x27;view-dashboard&#x27;);
      });

      document.getElementById(&#x27;btnStartTest&#x27;).addEventListener(&#x27;click&#x27;, startExam);

      document.getElementById(&#x27;btnPrev&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (!examState || examState.paused) return;
        goToQuestion(examState.currentIndex - 1);
      });

      document.getElementById(&#x27;btnNext&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (!examState || examState.paused) return;
        // Clear mark-for-review flag only if user explicitly saves &amp; moves next? Keep TCS standard: Save &amp; Next clears review mark on current Q
        examState.marked[examState.currentIndex] = false;
        if (examState.currentIndex &lt; examState.questions.length - 1) {
          goToQuestion(examState.currentIndex + 1);
        } else {
          renderPalette();
        }
      });

      document.getElementById(&#x27;btnClear&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (!examState || examState.paused) return;
        examState.answers[examState.currentIndex] = null;
        renderQuestion();
        renderPalette();
      });

      document.getElementById(&#x27;btnMarkNext&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (!examState || examState.paused) return;
        examState.marked[examState.currentIndex] = true;
        if (examState.currentIndex &lt; examState.questions.length - 1) {
          goToQuestion(examState.currentIndex + 1);
        } else {
          renderPalette();
        }
      });

      document.getElementById(&#x27;btnPauseExam&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (!examState || examState.submitted) return;
        examState.paused = true;
        document.getElementById(&#x27;modalPause&#x27;).classList.remove(&#x27;hidden&#x27;);
      });

      document.getElementById(&#x27;btnResumeExam&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (!examState || examState.submitted) return;
        examState.paused = false;
        document.getElementById(&#x27;modalPause&#x27;).classList.add(&#x27;hidden&#x27;);
      });

      document.getElementById(&#x27;btnToggleFullscreen&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (document.fullscreenElement) {
          exitFullscreenSafe();
        } else {
          enterFullscreenSafe();
        }
      });

      document.addEventListener(&#x27;fullscreenchange&#x27;, updateFullscreenBtnLabel);

      document.getElementById(&#x27;btnSubmitExam&#x27;).addEventListener(&#x27;click&#x27;, openSubmitModal);
      document.getElementById(&#x27;btnCancelSubmit&#x27;).addEventListener(&#x27;click&#x27;, function () {
        document.getElementById(&#x27;modalSubmit&#x27;).classList.add(&#x27;hidden&#x27;);
      });
      document.getElementById(&#x27;btnConfirmSubmit&#x27;).addEventListener(&#x27;click&#x27;, function () {
        submitExam(false);
      });

      document.getElementById(&#x27;btnResultBackTop&#x27;).addEventListener(&#x27;click&#x27;, function () {
        renderDashboard();
        showView(&#x27;view-dashboard&#x27;);
      });

      document.getElementById(&#x27;btnResultBack&#x27;).addEventListener(&#x27;click&#x27;, function () {
        renderDashboard();
        showView(&#x27;view-dashboard&#x27;);
      });

      document.getElementById(&#x27;btnRetakeTest&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (activeTest) {
          openIntro(activeTest.id);
        } else {
          renderDashboard();
          showView(&#x27;view-dashboard&#x27;);
        }
      });

      document.querySelectorAll(&#x27;.sol-filter-btn&#x27;).forEach(function (btn) {
        btn.addEventListener(&#x27;click&#x27;, function () {
          currentSolFilter = btn.getAttribute(&#x27;data-sol-filter&#x27;) || &#x27;all&#x27;;
          document.querySelectorAll(&#x27;.sol-filter-btn&#x27;).forEach(function (b) {
            b.classList.toggle(&#x27;active&#x27;, b === btn);
          });
          renderSolutionsList();
        });
      });

      document.getElementById(&#x27;btnResetStorage&#x27;).addEventListener(&#x27;click&#x27;, function () {
        document.getElementById(&#x27;modalResetStorage&#x27;).classList.remove(&#x27;hidden&#x27;);
      });

      document.getElementById(&#x27;btnCancelReset&#x27;).addEventListener(&#x27;click&#x27;, function () {
        document.getElementById(&#x27;modalResetStorage&#x27;).classList.add(&#x27;hidden&#x27;);
      });

      document.getElementById(&#x27;btnConfirmReset&#x27;).addEventListener(&#x27;click&#x27;, function () {
        clearAllSavedResults();
        document.getElementById(&#x27;modalResetStorage&#x27;).classList.add(&#x27;hidden&#x27;);
        renderDashboard();
      });

      // Initial render
      renderDashboard();
      showView(&#x27;view-dashboard&#x27;);
    })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
      </section>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      const tabNotes = document.getElementById('tab-notes');
      const tabMock = document.getElementById('tab-mock');
      const secNotes = document.getElementById('section-notes');
      const secMock = document.getElementById('section-mock');

      function switchSection(section) {
        const isNotes = section === 'notes';

        tabNotes.classList.toggle('active', isNotes);
        tabNotes.setAttribute('aria-selected', String(isNotes));
        secNotes.classList.toggle('active', isNotes);

        tabMock.classList.toggle('active', !isNotes);
        tabMock.setAttribute('aria-selected', String(!isNotes));
        secMock.classList.toggle('active', !isNotes);
      }

      tabNotes.addEventListener('click', function () {
        switchSection('notes');
      });

      tabMock.addEventListener('click', function () {
        switchSection('mock');
      });
    })();
  </script>
