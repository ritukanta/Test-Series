span id=\"statNotAnswered\" class=\"p-stat-badge st-not-answered\">0<\/span> Not Answered<\/div>\n          <div class=\"p-stat-row\"><span id=\"statMarked\" class=\"p-stat-badge st-marked\">0<\/span> Marked<\/div>\n          <div class=\"p-stat-row\"><span id=\"statNotVisited\" class=\"p-stat-badge st-not-visited\">24<\/span> Not Visited<\/div>\n        <\/div>\n        <div id=\"paletteScroll\" class=\"palette-grid-scroll\">\n          <div id=\"paletteGrid\" class=\"palette-grid\"><\/div>\n        <\/div>\n        <div class=\"palette-footer-submit\">\n          <button type=\"button\" id=\"paletteSubmitBtn\" class=\"btn-submit\">Submit Test<\/button>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n\n  <!-- ================= VIEW 3: RESULT & ANALYSIS SCREEN ================= -->\n  <div id=\"resultView\" class=\"hidden\">\n    <header class=\"exam-header\">\n      <div class=\"header-brand\">\n        <span class=\"header-badge\">SCORE ANALYSIS<\/span>\n        <span class=\"header-title\">RRB NTPC Physics \u2014 Units &amp; Measurements<\/span>\n      <\/div>\n      <div class=\"header-controls\">\n        <button type=\"button\" id=\"backToIntroBtn\" class=\"hdr-btn\">Back to Home<\/button>\n        <button type=\"button\" id=\"retakeBtn\" class=\"hdr-btn hdr-btn-submit\">Retake Test<\/button>\n      <\/div>\n    <\/header>\n\n    <main class=\"result-container\">\n      <section class=\"card score-banner\">\n        <div class=\"score-banner-top\">\n          <div>\n            <h1>Test Submission Summary<\/h1>\n            <div id=\"resultTimestamp\" class=\"score-meta-time\"><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"score-cards\">\n          <div class=\"sc-card primary\">\n            <div class=\"sc-label\">Total Score<\/div>\n            <div id=\"resScore\" class=\"sc-val\">0 / 48<\/div>\n            <div id=\"resPercent\" class=\"sc-sub\">0%<\/div>\n          <\/div>\n          <div class=\"sc-card\">\n            <div class=\"sc-label\">Correct<\/div>\n            <div id=\"resCorrect\" class=\"sc-val\" style=\"color:#15803d;\">0<\/div>\n            <div id=\"resCorrectMarks\" class=\"sc-sub\">+0.0<\/div>\n          <\/div>\n          <div class=\"sc-card\">\n            <div class=\"sc-label\">Incorrect<\/div>\n            <div id=\"resIncorrect\" class=\"sc-val\" style=\"color:#b91c1c;\">0<\/div>\n            <div id=\"resIncorrectMarks\" class=\"sc-sub\">&minus;0.0<\/div>\n          <\/div>\n          <div class=\"sc-card\">\n            <div class=\"sc-label\">Unattempted<\/div>\n            <div id=\"resUnattempted\" class=\"sc-val\" style=\"color:#b45309;\">0<\/div>\n            <div class=\"sc-sub\">0.0<\/div>\n          <\/div>\n          <div class=\"sc-card\">\n            <div class=\"sc-label\">Accuracy<\/div>\n            <div id=\"resAccuracy\" class=\"sc-val\">0%<\/div>\n            <div class=\"sc-sub\">of attempted<\/div>\n          <\/div>\n          <div class=\"sc-card\">\n            <div class=\"sc-label\">Time Taken<\/div>\n            <div id=\"resTimeTaken\" class=\"sc-val\">00:00<\/div>\n            <div class=\"sc-sub\">of 14:24<\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <section class=\"card solutions-card\">\n        <div class=\"solutions-header\">\n          <h2>Solutions (Incorrect &amp; Unattempted Questions Only)<\/h2>\n          <div class=\"filter-tabs\">\n            <button type=\"button\" id=\"tabAll\" class=\"filter-tab active\" data-filter=\"all\">All (0)<\/button>\n            <button type=\"button\" id=\"tabIncorrect\" class=\"filter-tab\" data-filter=\"incorrect\">Incorrect (0)<\/button>\n            <button type=\"button\" id=\"tabUnattempted\" class=\"filter-tab\" data-filter=\"unattempted\">Unattempted (0)<\/button>\n          <\/div>\n        <\/div>\n        <div id=\"solutionsList\" class=\"sol-list\"><\/div>\n      <\/section>\n    <\/main>\n  <\/div>\n\n  <!-- ================= PAUSE OVERLAY MODAL ================= -->\n  <div id=\"pauseModal\" class=\"modal-backdrop opaque hidden\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"pauseModalTitle\">\n    <div class=\"modal-box\">\n      <h3 id=\"pauseModalTitle\">Test Paused<\/h3>\n      <p>The countdown timer has been paused and the question screen is hidden. Remaining time: <strong id=\"pauseRemainingTime\">14:24<\/strong>.<\/p>\n      <div class=\"modal-actions\">\n        <button type=\"button\" id=\"resumeBtn\" class=\"btn-primary\">Resume Test<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ================= SUBMIT CONFIRMATION MODAL ================= -->\n  <div id=\"submitModal\" class=\"modal-backdrop hidden\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"submitModalTitle\">\n    <div class=\"modal-box\">\n      <h3 id=\"submitModalTitle\">Confirm Test Submission<\/h3>\n      <p>Are you sure you want to submit the mock test? You will not be able to change your answers after submission.<\/p>\n      <div class=\"modal-summary-grid\">\n        <div class=\"ms-item\"><span>Answered<\/span><strong id=\"modalAnswered\">0<\/strong><\/div>\n        <div class=\"ms-item\"><span>Not Answered<\/span><strong id=\"modalNotAnswered\">0<\/strong><\/div>\n        <div class=\"ms-item\"><span>Marked for Review<\/span><strong id=\"modalMarked\">0<\/strong><\/div>\n        <div class=\"ms-item\"><span>Not Visited<\/span><strong id=\"modalNotVisited\">24<\/strong><\/div>\n      <\/div>\n      <div class=\"modal-actions\">\n        <button type=\"button\" id=\"cancelSubmitBtn\" class=\"btn-secondary\">Cancel<\/button>\n        <button type=\"button\" id=\"confirmSubmitBtn\" class=\"btn-submit\">Confirm Submit<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ================= CLEAR HISTORY CONFIRMATION MODAL ================= -->\n  <div id=\"clearHistoryModal\" class=\"modal-backdrop hidden\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"clearHistoryTitle\">\n    <div class=\"modal-box\">\n      <h3 id=\"clearHistoryTitle\">Clear Saved Attempts?<\/h3>\n      <p>This will permanently remove all saved mock test scores and analyses from your browser storage.<\/p>\n      <div class=\"modal-actions\">\n        <button type=\"button\" id=\"cancelClearHistoryBtn\" class=\"btn-secondary\">Cancel<\/button>\n        <button type=\"button\" id=\"confirmClearHistoryBtn\" class=\"btn-danger-outline\">Clear All<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <script>\n    (function () {\n      'use strict';\n\n      const RAW_QUESTIONS = [{\"id\": 1, \"question\": \"Momentum of an object is defined as the product of its mass and velocity, hence what are its SI units?\", \"tag\": \"RRB NTPC GRADUATE CBT 1 22/03/2026 9:00 AM - 10:30 AM\", \"options\": [\"kg m s\\u207b\\u00b9\", \"kg m s\\u207b\\u00b2\", \"kg m s\", \"g m s\\u207b\\u00b9\"], \"correctAnswer\": \"kg m s\\u207b\\u00b9\", \"explanation\": \"Momentum (p) is defined as the product of mass (m) and velocity (v): p = m \\u00d7 v. Mass has SI unit kilogram (kg), and velocity has SI unit meter per second (m s\\u207b\\u00b9). Therefore, the SI unit of momentum is kg \\u00d7 m s\\u207b\\u00b9 = kg m s\\u207b\\u00b9.\"}, {\"id\": 2, \"question\": \"_______ is the SI unit used for measuring thermodynamic temperature.\", \"tag\": \"RRB NTPC GRADUATE CBT 1 25/03/2026 9:00 AM - 10:30 AM\", \"options\": [\"Kelvin\", \"Celsius\", \"Fahrenheit\", \"Rankine\"], \"correctAnswer\": \"Kelvin\", \"explanation\": \"The SI base unit for measuring thermodynamic temperature is the kelvin (K). Since the 2019 SI redefinition, the kelvin is defined by fixing the numerical value of the Boltzmann constant k to 1.380649 \\u00d7 10\\u207b\\u00b2\\u00b3 J K\\u207b\\u00b9. Celsius (\\u00b0C), Fahrenheit (\\u00b0F), and Rankine (\\u00b0R) are not SI base units.\"}, {\"id\": 3, \"question\": \"_______ is measured using the unit \\\"quintal\\\".\", \"tag\": \"RRB NTPC GRADUATE CBT 1 27/03/2026 9:00 AM - 10:30 AM\", \"options\": [\"Weight\", \"Temperature\", \"Length\", \"Volume\"], \"correctAnswer\": \"Weight\", \"explanation\": \"The quintal is a non-SI unit used to measure mass or weight in certain contexts. In Physics, weight is the force exerted by gravity on a mass (W = mg), but in everyday usage, \\\"weight\\\" often refers to mass. One quintal equals 100 kilograms.\"}, {\"id\": 4, \"question\": \"What is the complete set of both base and derived units called?\", \"tag\": \"RRB NTPC Graduate Level CBT-I : 23 Jun, 2025 Shift 3\", \"options\": [\"Scientific model\", \"Universal constant system\", \"System of units\", \"Measurement set\"], \"correctAnswer\": \"System of units\", \"explanation\": \"In Physics, a system of units is defined as a complete set of both base units (fundamental units) and derived units (units derived from base units through physical laws). The International System of Units (SI) is the modern metric system with seven base units: meter (length), kilogram (mass), second (time), ampere (electric current), kelvin (temperature), mole (amount of substance), and candela (luminous intensity). All other units like newton (force), joule (energy), and watt (power) are derived from these base units.\"}, {\"id\": 5, \"question\": \"What is the formula for density?\", \"tag\": \"RRB NTPC Graduate Level CBT-I : 11 Jun, 2025 Shift 3\", \"options\": [\"Density = Mass \\u00d7 Volume\", \"Density = Weight / Volume\", \"Density = Mass / Volume\", \"Density = Volume / Mass\"], \"correctAnswer\": \"Density = Mass / Volume\", \"explanation\": \"The density of a substance is defined as its mass per unit volume. The correct formula is \\u03c1 = m/V, where \\u03c1 (rho) represents density, m is mass, and V is volume. This is a fundamental definition in Physics.\"}, {\"id\": 6, \"question\": \"Which device is used to identify the presence of electric charge on an object?\", \"tag\": \"RRB NTPC CBT-I : 19 Mar 2021 Shift 1\", \"options\": [\"Electroscope\", \"Ohmmeter\", \"Multimeter\", \"Ampere meter\"], \"correctAnswer\": \"Electroscope\", \"explanation\": \"The device used to detect the presence of electric charge on an object is an electroscope. An electroscope works on the principle of electrostatic induction and charge separation. When a charged object is brought near the metal knob, it induces opposite charges in the metal leaves, causing them to diverge due to repulsion between like charges.\"}, {\"id\": 7, \"question\": \"If we derive an expression for velocity, its dimension should be ________.\", \"tag\": \"RRB NTPC UG CBT-I : 22 Aug, 2025 Shift 2\", \"options\": [\"M\\u2070L\\u00b9T\\u00b9\", \"M\\u00b9L\\u207b\\u00b9T\\u207b\\u00b2\", \"M\\u207b\\u00b9L\\u00b9T\\u207b\\u00b9\", \"M\\u2070L\\u00b9T\\u207b\\u00b9\"], \"correctAnswer\": \"M\\u2070L\\u00b9T\\u207b\\u00b9\", \"explanation\": \"The dimensional formula of any physical quantity expresses its dependence on the fundamental quantities: mass (M), length (L), and time (T). Velocity is defined as the rate of change of displacement with respect to time. Displacement has the dimension of length [L], and time has the dimension [T].\"}, {\"id\": 8, \"question\": \"The unit of Force is:\", \"tag\": \"RRB NTPC CBT-I : 13 Mar 2021 Shift 1\", \"options\": [\"kg m s\\u207b\\u00b2\", \"g m s\\u207b\\u00b2\", \"kg m s\\u207b\\u00b9\", \"g m s\\u207b\\u00b9\"], \"correctAnswer\": \"kg m s\\u207b\\u00b2\", \"explanation\": \"According to Newton's Second Law of Motion, force is defined as the product of mass and acceleration: F = m \\u00d7 a. Mass (m) is measured in kilograms (kg), and acceleration (a) is measured in meters per second squared (ms -2). Therefore, the SI unit of force is kg\\u00b7ms -2, which is named the newton (N).\"}, {\"id\": 9, \"question\": \"The speed limit on a highway has the dimension of:\", \"tag\": \"RRB NTPC Graduate Level CBT-I : 18 Jun, 2025 Shift 1\", \"options\": [\"Time over length\", \"Mass\", \"Length over time\", \"Time\"], \"correctAnswer\": \"Length over time\", \"explanation\": \"The speed limit on a highway specifies the maximum allowed speed, which is a physical quantity defined as the distance traveled per unit time. In Physics, speed is a derived quantity with the dimension of length divided by time (L/T). This is expressed as [v] = [L][T]\\u207b\\u00b9 in dimensional analysis.\"}, {\"id\": 10, \"question\": \"What is the dimensional formula for mechanical energy that refers to the total energy of an object due to its position and motion?\", \"tag\": \"RRB NTPC UG CBT-I : 12 Aug, 2025 Shift 2\", \"options\": [\"[ML\\u00b2T\\u207b\\u00b3]\", \"[M\\u00b9L\\u00b2]\", \"[M\\u00b2L\\u00b2T\\u207b\\u00b9]\", \"[M\\u00b9L\\u00b2T\\u207b\\u00b2]\"], \"correctAnswer\": \"[M\\u00b9L\\u00b2T\\u207b\\u00b2]\", \"explanation\": \"Mechanical energy is the sum of kinetic energy and potential energy. The dimensional formula for energy is derived from the work-energy principle: Work = Force \\u00d7 Displacement. Force has dimensional formula [MLT -2] (from Newton's second law: F = ma).\"}, {\"id\": 11, \"question\": \"Which of the following does NOT match?\", \"tag\": \"RRB NTPC CBT-I : 23 Feb 2021 Shift 1\", \"options\": [\"Compass- used for navigation and indicates north-south directions\", \"Cyclotron- measures small magnitude cyclones\", \"Electroscope- detects the presence of electric charge\", \"Actinometer- measures the intensity of radiation\"], \"correctAnswer\": \"Cyclotron- measures small magnitude cyclones\", \"explanation\": \"This question tests knowledge of scientific instruments and their correct functions. A compass indeed uses Earth's magnetic field for navigation, indicating north-south directions. An electroscope detects electric charge through the divergence of metal leaves or a needle.\"}, {\"id\": 12, \"question\": \"The SI unit of magnetic flux is:\", \"tag\": \"RRB NTPC CBT-I : 3 Mar 2021 Shift 2\", \"options\": [\"Weber\", \"Pascal\", \"Farad\", \"Henry\"], \"correctAnswer\": \"Weber\", \"explanation\": \"Magnetic flux (\\u03a6) is defined as the total magnetic field passing through a given area. According to Faraday's Law of Electromagnetic Induction, magnetic flux is mathematically expressed as \\u03a6 = B \\u22c5A \\u22c5cos\\u03b8, where B is magnetic field strength (Tesla), A is area (m\\u00b2), and \\u03b8 is the angle between magnetic field lines and area vector. The SI unit of magnetic flux is Weber (Wb), named after physicist Wilhelm Eduard Weber.\"}, {\"id\": 13, \"question\": \"How many significant figures are there in 2.308 cm?\", \"tag\": \"RRB NTPC UG CBT-I : 22 Aug, 2025 Shift 2\", \"options\": [\"2\", \"3\", \"4\", \"5\"], \"correctAnswer\": \"4\", \"explanation\": \"The number 2.308 cm has 4 significant figures. According to the rules for counting significant figures: (1) All non-zero digits are significant. (2) Zeros between non-zero digits are significant.\"}, {\"id\": 14, \"question\": \"What are the units for base quantities called?\", \"tag\": \"RRB NTPC Graduate Level CBT-I : 24 Jun, 2025 Shift 3\", \"options\": [\"Standard basic units\", \"Fundamental or base units\", \"Basic constants\", \"Derived basic units\"], \"correctAnswer\": \"Fundamental or base units\", \"explanation\": \"In the International System of Units (SI), physical quantities are classified into base quantities and derived quantities. The units for base quantities are called fundamental units or base units. There are seven base quantities in SI: length (meter), mass (kilogram), time (second), electric current (ampere), thermodynamic temperature (kelvin), amount of substance (mole), and luminous intensity (candela).\"}, {\"id\": 15, \"question\": \"Which of the following is a unit of the dimension 'length'?\", \"tag\": \"RRB NTPC Graduate Level CBT-I : 19 Jun, 2025 Shift 3\", \"options\": [\"Metre\", \"Kilogram\", \"Ampere\", \"Joule\"], \"correctAnswer\": \"Metre\", \"explanation\": \"The dimension of a physical quantity refers to the fundamental quantities (like length, mass, time) it is derived from. The SI base units for the seven fundamental quantities are: metre (m) for length, kilogram (kg) for mass, second (s) for time, ampere for electric current, kelvin (K) for temperature, mole (mol) for amount of substance, and candela (cd) for luminous intensity. Here, metre is the SI unit for the dimension length.\"}, {\"id\": 16, \"question\": \"What is the unit of measurement for frequency?\", \"tag\": \"RRB NTPC Graduate Level CBT-I : 20 Jun, 2025 Shift 3\", \"options\": [\"Millisecond\", \"Pascal\", \"Joule\", \"Hertz (Hz)\"], \"correctAnswer\": \"Hertz (Hz)\", \"explanation\": \"The question asks for the unit of measurement for frequency. Frequency is defined as the number of cycles or oscillations per unit time. According to the SI system, the unit of frequency is the hertz (Hz), named after physicist Heinrich Hertz.\"}, {\"id\": 17, \"question\": \"The ampere magnitude is determined by setting the numerical value of the elementary charge equal to _______ .\", \"tag\": \"RRB NTPC UG CBT-I : 08 Sept, 2025 Shift 1\", \"options\": [\"1.624432754 \\u00d7 10\\u207b\\u00b9\\u2077 C\", \"1.655908436 \\u00d7 10\\u207b\\u00b9\\u2078 C\", \"1.602176634 \\u00d7 10\\u207b\\u00b9\\u2079 C\", \"1.611547243 \\u00d7 10\\u207b\\u00b9\\u2079 C\"], \"correctAnswer\": \"1.602176634 \\u00d7 10\\u207b\\u00b9\\u2079 C\", \"explanation\": \"The ampere is the SI base unit of electric current. Since the 2019 SI redefinition, all seven base units are defined by fixing the numerical values of fundamental constants. The ampere is defined by fixing the exact numerical value of the elementary charge (e), which is the electric charge carried by a single proton.\"}, {\"id\": 18, \"question\": \"How many mutually independent base quantities are there in the current International System of Units (SI)?\", \"tag\": \"RRB NTPC UG CBT-I : 20 Aug, 2025 Shift 1\", \"options\": [\"7\", \"10\", \"6\", \"13\"], \"correctAnswer\": \"7\", \"explanation\": \"The International System of Units (SI) defines seven mutually independent base quantities that form the foundation for all physical measurements. These base quantities are: length (meter), mass (kilogram), time (second), electric current (ampere), thermodynamic temperature (kelvin), amount of substance (mole), and luminous intensity (candela). All other physical quantities (derived quantities) are expressed in terms of these seven base quantities through multiplication, division, or exponentiation.\"}, {\"id\": 19, \"question\": \"What is the SI unit of energy?\", \"tag\": \"RRB NTPC Graduate Level CBT-I : 06 Jun, 2025 Shift 3\", \"options\": [\"Joule\", \"Watt\", \"Kelvin\", \"Newton\"], \"correctAnswer\": \"Joule\", \"explanation\": \"The SI unit of energy is the joule (J). Energy is defined as the capacity to do work, and according to the work-energy theorem, work done equals the change in energy. The joule is derived from base SI units: 1 J = 1 N\\u00b7m = 1 kg\\u00b7m\\u00b2/s\\u00b2.\"}, {\"id\": 20, \"question\": \"What is the dimensional formula of pressure?\", \"tag\": \"RRB NTPC Graduate Level CBT-I : 16 Jun, 2025 Shift 1\", \"options\": [\"[ML\\u207b\\u00b2T\\u207b\\u00b2]\", \"[ML\\u00b2T\\u207b\\u00b2]\", \"[ML\\u207b\\u00b9T\\u207b\\u00b2]\", \"[MLT\\u207b\\u00b2]\"], \"correctAnswer\": \"[ML\\u207b\\u00b9T\\u207b\\u00b2]\", \"explanation\": \"The dimensional formula of pressure is derived from its definition. Pressure (P) is defined as force per unit area. The dimensional formula of force is [M L T\\u207b\\u00b2] (from Newton's second law: F = ma, where mass [M] and acceleration [L T\\u207b\\u00b2]).\"}, {\"id\": 21, \"question\": \"The rate of doing work is called power. The unit of power is:\", \"tag\": \"RRB NTPC CBT-I : 11 Feb 2021 Shift 1\", \"options\": [\"watt\", \"ampere\", \"volt\", \"kelvin\"], \"correctAnswer\": \"watt\", \"explanation\": \"The rate of doing work is defined as power. According to Physics, Power (P) = Work done (W) / Time taken (t). The SI unit of work is joule (J) and time is second (s), so the SI unit of power is joule per second (J/s), which is named watt (W) in honor of James Watt.\"}, {\"id\": 22, \"question\": \"The luminous efficacy of monochromatic radiation of frequency 540 \\u00d7 10\\u00b9\\u00b2 Hz, K_cd, is to be ____ when expressed in the unit lumen per watt.\", \"tag\": \"RRB NTPC UG CBT-I : 21 Aug, 2025 Shift 1\", \"options\": [\"641\", \"679\", \"655\", \"683\"], \"correctAnswer\": \"683\", \"explanation\": \"The luminous efficacy of monochromatic radiation at frequency 540\\u00d710\\u00b9\\u00b2 Hz is defined by international agreement. According to the SI definition, the luminous efficacy K cd for monochromatic radiation at exactly 540\\u00d710\\u00b9\\u00b2 Hz (which corresponds to wavelength 555 nm in standard air) is precisely 683 lumens per watt. This value establishes the relationship between radiometric units (watts) and photometric units (lumens).\"}, {\"id\": 23, \"question\": \"What is the SI unit of resistance?\", \"tag\": \"RRB NTPC CBT-I : 21 Jan 2021 Shift 2\", \"options\": [\"Coulomb\", \"Siemens\", \"Ohm\", \"Mho\"], \"correctAnswer\": \"Ohm\", \"explanation\": \"The SI unit of electrical resistance is the ohm (symbol: \\u03a9). This is defined by Ohm's Law, which states that the current through a conductor between two points is directly proportional to the voltage across the two points, with resistance as the constant of proportionality: V = IR. From this, R = V/I, so resistance is measured in volts per ampere (V/A), which is defined as one ohm.\"}, {\"id\": 24, \"question\": \"What is the preferred unit used in the scientific literature to express the ratio between two sound intensities?\", \"tag\": \"RRB NTPC UG CBT-I : 28 Aug, 2025 Shift 3\", \"options\": [\"Phon\", \"Pascal\", \"Hertz\", \"Decibels\"], \"correctAnswer\": \"Decibels\", \"explanation\": \"The decibel (dB) is the preferred unit in scientific literature for expressing the ratio between two sound intensities. This is because sound intensity varies over an enormous range (from the threshold of hearing to the threshold of pain), and a logarithmic scale is needed to compress this wide range into manageable numbers. The decibel scale is defined as: L = 10 log\\u2081\\u2080(I/I\\u2080), where L is the sound level in decibels, I is the measured intensity, and I\\u2080 is the reference intensity (typically 10\\u207b\\u00b9\\u00b2 W/m\\u00b2).\"}];\n      const SECONDS_PER_QUESTION = 36;\n      const TOTAL_SECONDS = RAW_QUESTIONS.length * SECONDS_PER_QUESTION; // 24 * 36 = 864s (14:24)\n      const MARKS_CORRECT = 2;\n      const MARKS_INCORRECT = 0.5;\n      const MAX_MARKS = RAW_QUESTIONS.length * MARKS_CORRECT; // 48\n      const STORAGE_KEY = 'rrb_ntpc_units_measurements_mock_v2';\n      const OPTION_LETTERS = ['A', 'B', 'C', 'D'];\n\n      // Application State\n      let questions = [];\n      let currentIndex = 0;\n      let responses = [];\n      let visited = [];\n      let marked = [];\n      let remainingSeconds = TOTAL_SECONDS;\n      let timerId = null;\n      let isPaused = false;\n      let isSubmitted = false;\n      let activeResultRecord = null;\n      let activeFilter = 'all';\n\n      // DOM Elements\n      const introView = document.getElementById('introView');\n      const examView = document.getElementById('examView');\n      const resultView = document.getElementById('resultView');\n\n      const startTestBtn = document.getElementById('startTestBtn');\n      const historySection = document.getElementById('historySection');\n      const historyTableBody = document.getElementById('historyTableBody');\n      const clearHistoryBtn = document.getElementById('clearHistoryBtn');\n\n      const timerDisplay = document.getElementById('timerDisplay');\n      const pauseBtn = document.getElementById('pauseBtn');\n      const fullscreenBtn = document.getElementById('fullscreenBtn');\n      const headerSubmitBtn = document.getElementById('headerSubmitBtn');\n      const footerSubmitBtn = document.getElementById('footerSubmitBtn');\n      const paletteSubmitBtn = document.getElementById('paletteSubmitBtn');\n\n      const qNumberLabel = document.getElementById('qNumberLabel');\n      const qExamTag = document.getElementById('qExamTag');\n      const qStem = document.getElementById('qStem');\n      const optionsList = document.getElementById('optionsList');\n      const qScrollArea = document.getElementById('qScrollArea');\n\n      const prevBtn = document.getElementById('prevBtn');\n      const clearBtn = document.getElementById('clearBtn');\n      const markNextBtn = document.getElementById('markNextBtn');\n      const nextBtn = document.getElementById('nextBtn');\n\n      const statAnswered = document.getElementById('statAnswered');\n      const statNotAnswered = document.getElementById('statNotAnswered');\n      const statMarked = document.getElementById('statMarked');\n      const statNotVisited = document.getElementById('statNotVisited');\n      const paletteGrid = document.getElementById('paletteGrid');\n      const paletteScroll = document.getElementById('paletteScroll');\n\n      const pauseModal = document.getElementById('pauseModal');\n      const pauseRemainingTime = document.getElementById('pauseRemainingTime');\n      const resumeBtn = document.getElementById('resumeBtn');\n\n      const submitModal = document.getElementById('submitModal');\n      const modalAnswered = document.getElementById('modalAnswered');\n      const modalNotAnswered = document.getElementById('modalNotAnswered');\n      const modalMarked = document.getElementById('modalMarked');\n      const modalNotVisited = document.getElementById('modalNotVisited');\n      const cancelSubmitBtn = document.getElementById('cancelSubmitBtn');\n      const confirmSubmitBtn = document.getElementById('confirmSubmitBtn');\n\n      const clearHistoryModal = document.getElementById('clearHistoryModal');\n      const cancelClearHistoryBtn = document.getElementById('cancelClearHistoryBtn');\n      const confirmClearHistoryBtn = document.getElementById('confirmClearHistoryBtn');\n\n      const backToIntroBtn = document.getElementById('backToIntroBtn');\n      const retakeBtn = document.getElementById('retakeBtn');\n      const resultTimestamp = document.getElementById('resultTimestamp');\n      const resScore = document.getElementById('resScore');\n      const resPercent = document.getElementById('resPercent');\n      const resCorrect = document.getElementById('resCorrect');\n      const resCorrectMarks = document.getElementById('resCorrectMarks');\n      const resIncorrect = document.getElementById('resIncorrect');\n      const resIncorrectMarks = document.getElementById('resIncorrectMarks');\n      const resUnattempted = document.getElementById('resUnattempted');\n      const resAccuracy = document.getElementById('resAccuracy');\n      const resTimeTaken = document.getElementById('resTimeTaken');\n      const tabAll = document.getElementById('tabAll');\n      const tabIncorrect = document.getElementById('tabIncorrect');\n      const tabUnattempted = document.getElementById('tabUnattempted');\n      const solutionsList = document.getElementById('solutionsList');\n\n      // Utility: Fisher-Yates shuffle (used ONLY on options, NEVER on questions)\n      function shuffleArray(arr) {\n        const copy = arr.slice();\n        for (let i = copy.length - 1; i > 0; i--) {\n          const j = Math.floor(Math.random() * (i + 1));\n          const temp = copy[i];\n          copy[i] = copy[j];\n          copy[j] = temp;\n        }\n        return copy;\n      }\n\n      function formatTime(sec) {\n        const s = Math.max(0, Math.floor(sec));\n        const mins = Math.floor(s / 60);\n        const rem = s % 60;\n        return String(mins).padStart(2, '0') + ':' + String(rem).padStart(2, '0');\n      }\n\n      function escapeHtml(str) {\n        return String(str)\n          .replace(/&/g, '&amp;')\n          .replace(/<\/g, '&lt;')\n          .replace(/>/g, '&gt;')\n          .replace(/\"/g, '&quot;')\n          .replace(/'/g, '&#39;');\n      }\n\n      // Safe localStorage helpers\n      function loadHistory() {\n        try {\n          const raw = window.localStorage.getItem(STORAGE_KEY);\n          if (!raw) return [];\n          const parsed = JSON.parse(raw);\n          return Array.isArray(parsed) ? parsed : [];\n        } catch (e) {\n          return [];\n        }\n      }\n\n      function saveHistory(list) {\n        try {\n          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));\n        } catch (e) {\n          // Ignore storage quota or sandbox restrictions gracefully\n        }\n      }\n\n      // Prepare fixed-order questions with randomized options on each load/test start\n      function prepareQuestions() {\n        questions = RAW_QUESTIONS.map(function (q) {\n          return {\n            id: q.id,\n            question: q.question,\n            tag: q.tag,\n            shuffledOptions: shuffleArray(q.options),\n            correctAnswer: q.correctAnswer,\n            explanation: q.explanation\n          };\n        });\n      }\n\n      function resetExamState() {\n        clearTimer();\n        prepareQuestions();\n        currentIndex = 0;\n        responses = new Array(questions.length).fill(null);\n        visited = new Array(questions.length).fill(false);\n        marked = new Array(questions.length).fill(false);\n        remainingSeconds = TOTAL_SECONDS;\n        isPaused = false;\n        isSubmitted = false;\n      }\n\n      function clearTimer() {\n        if (timerId !== null) {\n          clearInterval(timerId);\n          timerId = null;\n        }\n      }\n\n      function updateTimerDisplay() {\n        timerDisplay.textContent = formatTime(remainingSeconds);\n        timerDisplay.classList.remove('warning', 'danger');\n        if (remainingSeconds <= 180) {\n          timerDisplay.classList.add('danger');\n        } else if (remainingSeconds <= 300) {\n          timerDisplay.classList.add('warning');\n        }\n      }\n\n      function startTimer() {\n        clearTimer();\n        updateTimerDisplay();\n        timerId = setInterval(function () {\n          if (isPaused || isSubmitted) return;\n          remainingSeconds -= 1;\n          updateTimerDisplay();\n          if (remainingSeconds <= 0) {\n            remainingSeconds = 0;\n            updateTimerDisplay();\n            submitTest(true);\n          }\n        }, 1000);\n      }\n\n      // Fullscreen helpers\n      function enterFullscreen() {\n        try {\n          const el = document.documentElement;\n          if (!document.fullscreenElement && el.requestFullscreen) {\n            const p = el.requestFullscreen();\n            if (p && typeof p.catch === 'function') p.catch(function () {});\n          }\n        } catch (e) {\n          // Graceful fallback if fullscreen is blocked\n        }\n        updateFullscreenButton();\n      }\n\n      function toggleFullscreen() {\n        try {\n          if (document.fullscreenElement) {\n            if (document.exitFullscreen) {\n              const p = document.exitFullscreen();\n              if (p && typeof p.catch === 'function') p.catch(function () {});\n            }\n          } else {\n            enterFullscreen();\n          }\n        } catch (e) {\n          // Ignore\n        }\n      }\n\n      function updateFullscreenButton() {\n        fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Enter Fullscreen';\n      }\n\n      document.addEventListener('fullscreenchange', updateFullscreenButton);\n\n      // View switching\n      function showView(name) {\n        introView.classList.toggle('hidden', name !== 'intro');\n        examView.classList.toggle('hidden', name !== 'exam');\n        resultView.classList.toggle('hidden', name !== 'result');\n      }\n\n      // Render Intro Saved Attempts History\n      function renderHistory() {\n        const list = loadHistory();\n        if (!list.length) {\n          historySection.classList.add('hidden');\n          return;\n        }\n        historySection.classList.remove('hidden');\n        historyTableBody.innerHTML = '';\n        list.forEach(function (rec, idx) {\n          const tr = document.createElement('tr');\n          tr.innerHTML =\n            '<td>' + escapeHtml(rec.timestampLabel) + '<\/td>' +\n            '<td><strong>' + rec.score.toFixed(1) + ' / ' + MAX_MARKS + '<\/strong><\/td>' +\n            '<td style=\"color:#15803d;font-weight:600;\">' + rec.correct + '<\/td>' +\n            '<td style=\"color:#b91c1c;font-weight:600;\">' + rec.incorrect + '<\/td>' +\n            '<td style=\"color:#b45309;font-weight:600;\">' + rec.unattempted + '<\/td>' +\n            '<td>' + rec.accuracy.toFixed(1) + '%<\/td>' +\n            '<td><button type=\"button\" class=\"btn-secondary view-history-btn\" data-idx=\"' + idx + '\" style=\"padding:4px 10px;font-size:0.78rem;\">View Analysis<\/button><\/td>';\n          historyTableBody.appendChild(tr);\n        });\n      }\n\n      // Compute Palette Statuses\n      function getCounts() {\n        let answered = 0;\n        let notAnswered = 0;\n        let markedCount = 0;\n        let notVisited = 0;\n        for (let i = 0; i < questions.length; i++) {\n          const hasAns = responses[i] !== null;\n          const isVis = visited[i];\n          const isM = marked[i];\n          if (isM) {\n            markedCount++;\n            if (hasAns) answered++;\n          } else if (hasAns) {\n            answered++;\n          } else if (isVis) {\n            notAnswered++;\n          } else {\n            notVisited++;\n          }\n        }\n        return { answered: answered, notAnswered: notAnswered, marked: markedCount, notVisited: notVisited };\n      }\n\n      function getPaletteClass(i) {\n        const hasAns = responses[i] !== null;\n        const isVis = visited[i];\n        const isM = marked[i];\n        if (hasAns && isM) return 'st-answered-marked';\n        if (isM) return 'st-marked';\n        if (hasAns) return 'st-answered';\n        if (isVis) return 'st-not-answered';\n        return 'st-not-visited';\n      }\n\n      function renderPalette() {\n        const counts = getCounts();\n        statAnswered.textContent = counts.answered;\n        statNotAnswered.textContent = counts.notAnswered;\n        statMarked.textContent = counts.marked;\n        statNotVisited.textContent = counts.notVisited;\n\n        paletteGrid.innerHTML = '';\n        for (let i = 0; i < questions.length; i++) {\n          const btn = document.createElement('button');\n          btn.type = 'button';\n          btn.className = 'pal-btn ' + getPaletteClass(i) + (i === currentIndex ? ' current' : '');\n          btn.textContent = String(i + 1);\n          btn.setAttribute('data-qidx', String(i));\n          btn.setAttribute('aria-label', 'Go to Question ' + (i + 1));\n          paletteGrid.appendChild(btn);\n        }\n\n        // Scroll active palette button into view inside the palette container\n        const activeBtn = paletteGrid.querySelector('.pal-btn.current');\n        if (activeBtn && paletteScroll) {\n          const top = activeBtn.offsetTop;\n          const bottom = top + activeBtn.offsetHeight;\n          const viewTop = paletteScroll.scrollTop;\n          const viewBottom = viewTop + paletteScroll.clientHeight;\n          if (top < viewTop + 12) {\n            paletteScroll.scrollTop = Math.max(0, top - 16);\n          } else if (bottom > viewBottom - 12) {\n            paletteScroll.scrollTop = bottom - paletteScroll.clientHeight + 16;\n          }\n        }\n      }\n\n      function renderQuestion() {\n        visited[currentIndex] = true;\n        const q = questions[currentIndex];\n        qNumberLabel.textContent = 'Question No. ' + (currentIndex + 1) + ' of ' + questions.length;\n        qExamTag.textContent = q.tag ? '(' + q.tag + ')' : '';\n        qStem.textContent = q.question;\n\n        optionsList.innerHTML = '';\n        const selectedVal = responses[currentIndex];\n\n        q.shuffledOptions.forEach(function (optText, idx) {\n          const label = document.createElement('label');\n          const isSelected = selectedVal === optText;\n          label.className = 'option-card' + (isSelected ? ' selected' : '');\n\n          const radio = document.createElement('input');\n          radio.type = 'radio';\n          radio.name = 'mcq_option';\n          radio.value = optText;\n          radio.checked = isSelected;\n          radio.className = 'option-radio';\n\n          const letterSpan = document.createElement('span');\n          letterSpan.className = 'option-letter';\n          letterSpan.textContent = '(' + OPTION_LETTERS[idx] + ')';\n\n          const textSpan = document.createElement('span');\n          textSpan.className = 'option-text';\n          textSpan.textContent = optText;\n\n          radio.addEventListener('change', function () {\n            responses[currentIndex] = optText;\n            // Do NOT reveal answer and do NOT jump to next question automatically\n            const cards = optionsList.querySelectorAll('.option-card');\n            cards.forEach(function (c) { c.classList.remove('selected'); });\n            label.classList.add('selected');\n            renderPalette();\n          });\n\n          label.appendChild(radio);\n          label.appendChild(letterSpan);\n          label.appendChild(textSpan);\n          optionsList.appendChild(label);\n        });\n\n        prevBtn.disabled = currentIndex === 0;\n        nextBtn.disabled = currentIndex === questions.length - 1;\n        qScrollArea.scrollTop = 0;\n        renderPalette();\n      }\n\n      function startTest() {\n        resetExamState();\n        showView('exam');\n        renderQuestion();\n        startTimer();\n        enterFullscreen();\n      }\n\n      function openSubmitModal() {\n        const counts = getCounts();\n        modalAnswered.textContent = counts.answered;\n        modalNotAnswered.textContent = counts.notAnswered;\n        modalMarked.textContent = counts.marked;\n        modalNotVisited.textContent = counts.notVisited;\n        submitModal.classList.remove('hidden');\n      }\n\n      function closeSubmitModal() {\n        submitModal.classList.add('hidden');\n      }\n\n      function submitTest(isAuto) {\n        if (isSubmitted) return;\n        isSubmitted = true;\n        clearTimer();\n        closeSubmitModal();\n        pauseModal.classList.add('hidden');\n\n        // Exit fullscreen cleanly on submission\n        try {\n          if (document.fullscreenElement && document.exitFullscreen) {\n            const p = document.exitFullscreen();\n            if (p && typeof p.catch === 'function') p.catch(function () {});\n          }\n        } catch (e) {}\n\n        let correct = 0;\n        let incorrect = 0;\n        let unattempted = 0;\n        const reviewItems = []; // ONLY incorrect & unattempted questions\n\n        for (let i = 0; i < questions.length; i++) {\n          const q = questions[i];\n          const userAns = responses[i];\n          if (userAns === null) {\n            unattempted++;\n            reviewItems.push({\n              id: q.id,\n              status: 'unattempted',\n              question: q.question,\n              tag: q.tag,\n              userAnswer: null,\n              correctAnswer: q.correctAnswer,\n              explanation: q.explanation\n            });\n          } else if (userAns === q.correctAnswer) {\n            correct++;\n          } else {\n            incorrect++;\n            reviewItems.push({\n              id: q.id,\n              status: 'incorrect',\n              question: q.question,\n              tag: q.tag,\n              userAnswer: userAns,\n              correctAnswer: q.correctAnswer,\n              explanation: q.explanation\n            });\n          }\n        }\n\n        const attempted = correct + incorrect;\n        const score = (correct * MARKS_CORRECT) - (incorrect * MARKS_INCORRECT);\n        const accuracy = attempted > 0 ? (correct / attempted) * 100 : 0;\n        const timeTakenSec = TOTAL_SECONDS - remainingSeconds;\n\n        const now = new Date();\n        const timestampLabel = now.toLocaleString(undefined, {\n          year: 'numeric', month: 'short', day: 'numeric',\n          hour: '2-digit', minute: '2-digit'\n        }) + (isAuto ? ' (Auto-Submitted)' : '');\n\n        const record = {\n          timestampLabel: timestampLabel,\n          score: score,\n          correct: correct,\n          incorrect: incorrect,\n          unattempted: unattempted,\n          accuracy: accuracy,\n          timeTakenSec: timeTakenSec,\n          reviewItems: reviewItems\n        };\n\n        const history = loadHistory();\n        history.unshift(record);\n        if (history.length > 20) history.length = 20;\n        saveHistory(history);\n\n        showResult(record);\n      }\n\n      function showResult(record) {\n        activeResultRecord = record;\n        activeFilter = 'all';\n        showView('result');\n\n        resultTimestamp.textContent = 'Submitted on ' + record.timestampLabel;\n        resScore.textContent = record.score.toFixed(1) + ' / ' + MAX_MARKS;\n        const pct = Math.max(0, (record.score / MAX_MARKS) * 100);\n        resPercent.textContent = pct.toFixed(1) + '%';\n        resCorrect.textContent = String(record.correct);\n        resCorrectMarks.textContent = '+' + (record.correct * MARKS_CORRECT).toFixed(1);\n        resIncorrect.textContent = String(record.incorrect);\n        resIncorrectMarks.textContent = '\\u2212' + (record.incorrect * MARKS_INCORRECT).toFixed(1);\n        resUnattempted.textContent = String(record.unattempted);\n        resAccuracy.textContent = record.accuracy.toFixed(1) + '%';\n        resTimeTaken.textContent = formatTime(record.timeTakenSec);\n\n        const totalReview = record.reviewItems.length;\n        tabAll.textContent = 'All (' + totalReview + ')';\n        tabIncorrect.textContent = 'Incorrect (' + record.incorrect + ')';\n        tabUnattempted.textContent = 'Unattempted (' + record.unattempted + ')';\n\n        updateFilterTabs();\n        renderSolutionsList();\n        window.scrollTo(0, 0);\n      }\n\n      function updateFilterTabs() {\n        [tabAll, tabIncorrect, tabUnattempted].forEach(function (t) {\n          t.classList.toggle('active', t.getAttribute('data-filter') === activeFilter);\n        });\n      }\n\n      function renderSolutionsList() {\n        if (!activeResultRecord) return;\n        const items = activeResultRecord.reviewItems.filter(function (item) {\n          if (activeFilter === 'all') return true;\n          return item.status === activeFilter;\n        });\n\n        solutionsList.innerHTML = '';\n\n        if (!items.length) {\n          const empty = document.createElement('div');\n          empty.className = 'empty-state';\n          if (activeResultRecord.reviewItems.length === 0) {\n            empty.textContent = 'All 24 questions answered correctly! There are no incorrect or unattempted questions to review.';\n          } else {\n            empty.textContent = 'No questions in this filter category.';\n          }\n          solutionsList.appendChild(empty);\n          return;\n        }\n\n        items.forEach(function (item) {\n          const card = document.createElement('article');\n          card.className = 'sol-item';\n\n          const statusClass = item.status === 'incorrect' ? 'incorrect' : 'unattempted';\n          const statusLabel = item.status === 'incorrect' ? 'Incorrect (\\u22120.5)' : 'Unattempted (0)';\n\n          let ansHtml = '';\n          if (item.status === 'incorrect') {\n            ansHtml += '<div class=\"ans-row wrong\"><strong>Your Answer:<\/strong> ' + escapeHtml(item.userAnswer) + '<\/div>';\n          }\n          ansHtml += '<div class=\"ans-row right\"><strong>Correct Answer:<\/strong> ' + escapeHtml(item.correctAnswer) + '<\/div>';\n\n          card.innerHTML =\n            '<div class=\"sol-item-head\">' +\n              '<span class=\"sol-qno\">Question #' + item.id + '<\/span>' +\n              '<span class=\"status-pill ' + statusClass + '\">' + statusLabel + '<\/span>' +\n            '<\/div>' +\n            (item.tag ? '<div class=\"sol-tag\">(' + escapeHtml(item.tag) + ')<\/div>' : '') +\n            '<div class=\"sol-question\">' + escapeHtml(item.question) + '<\/div>' +\n            '<div class=\"sol-answers\">' + ansHtml + '<\/div>' +\n            '<div class=\"sol-explanation\"><strong>Solution:<\/strong> ' + escapeHtml(item.explanation) + '<\/div>';\n\n          solutionsList.appendChild(card);\n        });\n      }\n\n      // Event Listeners\n      startTestBtn.addEventListener('click', startTest);\n\n      prevBtn.addEventListener('click', function () {\n        if (currentIndex > 0) {\n          currentIndex--;\n          renderQuestion();\n        }\n      });\n\n      nextBtn.addEventListener('click', function () {\n        if (currentIndex < questions.length - 1) {\n          currentIndex++;\n          renderQuestion();\n        }\n      });\n\n      clearBtn.addEventListener('click', function () {\n        responses[currentIndex] = null;\n        renderQuestion();\n      });\n\n      markNextBtn.addEventListener('click', function () {\n        marked[currentIndex] = true;\n        if (currentIndex < questions.length - 1) {\n          currentIndex++;\n        }\n        renderQuestion();\n      });\n\n      paletteGrid.addEventListener('click', function (e) {\n        const btn = e.target.closest('.pal-btn');\n        if (!btn) return;\n        const idx = parseInt(btn.getAttribute('data-qidx'), 10);\n        if (!isNaN(idx) && idx >= 0 && idx < questions.length) {\n          currentIndex = idx;\n          renderQuestion();\n        }\n      });\n\n      pauseBtn.addEventListener('click', function () {\n        if (isSubmitted) return;\n        isPaused = true;\n        pauseRemainingTime.textContent = formatTime(remainingSeconds);\n        pauseModal.classList.remove('hidden');\n      });\n\n      resumeBtn.addEventListener('click', function () {\n        isPaused = false;\n        pauseModal.classList.add('hidden');\n      });\n\n      fullscreenBtn.addEventListener('click', toggleFullscreen);\n\n      headerSubmitBtn.addEventListener('click', openSubmitModal);\n      footerSubmitBtn.addEventListener('click', openSubmitModal);\n      paletteSubmitBtn.addEventListener('click', openSubmitModal);\n      cancelSubmitBtn.addEventListener('click', closeSubmitModal);\n      confirmSubmitBtn.addEventListener('click', function () {\n        submitTest(false);\n      });\n\n      backToIntroBtn.addEventListener('click', function () {\n        renderHistory();\n        showView('intro');\n        window.scrollTo(0, 0);\n      });\n\n      retakeBtn.addEventListener('click', startTest);\n\n      [tabAll, tabIncorrect, tabUnattempted].forEach(function (tab) {\n        tab.addEventListener('click', function () {\n          activeFilter = tab.getAttribute('data-filter');\n          updateFilterTabs();\n          renderSolutionsList();\n        });\n      });\n\n      historyTableBody.addEventListener('click', function (e) {\n        const btn = e.target.closest('.view-history-btn');\n        if (!btn) return;\n        const idx = parseInt(btn.getAttribute('data-idx'), 10);\n        const list = loadHistory();\n        if (!isNaN(idx) && list[idx]) {\n          showResult(list[idx]);\n        }\n      });\n\n      clearHistoryBtn.addEventListener('click', function () {\n        clearHistoryModal.classList.remove('hidden');\n      });\n\n      cancelClearHistoryBtn.addEventListener('click', function () {\n        clearHistoryModal.classList.add('hidden');\n      });\n\n      confirmClearHistoryBtn.addEventListener('click', function () {\n        saveHistory([]);\n        clearHistoryModal.classList.add('hidden');\n        renderHistory();\n      });\n\n      // Initialize app on Introductory Screen\n      prepareQuestions();\n      renderHistory();\n      showView('intro');\n    })();\n  <\/script>\n<\/body>\n<\/html>"</script>

  <script>
    (function () {
      'use strict';

      var tabNotes = document.getElementById('tabNotes');
      var tabTest = document.getElementById('tabTest');
      var notesFrame = document.getElementById('notesFrame');
      var testFrame = document.getElementById('testFrame');
      var notesPayload = document.getElementById('notesPayload');
      var testPayload = document.getElementById('testPayload');

      if (notesFrame && notesPayload) {
        notesFrame.srcdoc = JSON.parse(notesPayload.textContent);
      }
      if (testFrame && testPayload) {
        testFrame.srcdoc = JSON.parse(testPayload.textContent);
      }

      function switchTab(target) {
        var showNotes = target === 'notes';
        notesFrame.classList.toggle('hidden', !showNotes);
        testFrame.classList.toggle('hidden', showNotes);

        tabNotes.classList.toggle('active', showNotes);
        tabTest.classList.toggle('active', !showNotes);

        tabNotes.setAttribute('aria-pressed', String(showNotes));
        tabTest.setAttribute('aria-pressed', String(!showNotes));
      }

      tabNotes.addEventListener('click', function () {
        switchTab('notes');
      });

      tabTest.addEventListener('click', function () {
        switchTab('test');
      });
    })();
  </script>
