  <script type="application/json" id="notesPayload">"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Units and Measurements \u2014 Verified Exam Notes (RRB NTPC &amp; Govt Exams)<\/title>\n\n  <!-- Load Tailwind CSS for responsive layout, spacing, grids, and clean UI -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n\n  <!-- Load Carlito (exact metric-compatible open fallback for Calibri on devices without Microsoft Calibri) -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap\" rel=\"stylesheet\" />\n\n  <style>\n    /* =========================================================================\n       CORE TYPOGRAPHY & BOOK-STYLE LIGHT THEME (CALIBRI MANDATED)\n       ========================================================================= */\n    :root {\n      --font-notes: 'Calibri', 'Carlito', 'Segoe UI', Arial, sans-serif;\n      --ink-primary: #0f172a;\n      --ink-secondary: #1e293b;\n      --border-crisp: #cbd5e1;\n    }\n\n    html, body {\n      font-family: var(--font-notes);\n      background-color: #f8fafc;\n      color: var(--ink-primary);\n      line-height: 1.55;\n      -webkit-font-smoothing: antialiased;\n    }\n\n    /* Mathematical Typesetting Utilities (Crisp, Offline-Ready, Print-Safe) */\n    .math {\n      font-family: var(--font-notes);\n      font-weight: 700;\n      color: #0f172a;\n      white-space: nowrap;\n    }\n\n    .math-var {\n      font-style: italic;\n      font-weight: 700;\n    }\n\n    .dim-box {\n      display: inline-block;\n      font-family: var(--font-notes);\n      font-weight: 700;\n      color: #0f172a;\n      background-color: #eef2ff;\n      border: 1px solid #a5b4fc;\n      border-radius: 0.35rem;\n      padding: 0.08rem 0.45rem;\n      white-space: nowrap;\n    }\n\n    .formula-pill {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.25rem;\n      font-weight: 700;\n      color: #0f172a;\n      background-color: #f0f9ff;\n      border: 1px solid #7dd3fc;\n      border-radius: 0.4rem;\n      padding: 0.25rem 0.65rem;\n    }\n\n    /* Stacked Mathematical Fraction */\n    .frac {\n      display: inline-flex;\n      flex-direction: column;\n      align-items: center;\n      vertical-align: middle;\n      margin: 0 0.2rem;\n      line-height: 1.15;\n      font-size: 0.94em;\n    }\n\n    .frac-num {\n      border-bottom: 1.5px solid #0f172a;\n      padding: 0 0.25rem 0.1rem;\n      text-align: center;\n    }\n\n    .frac-den {\n      padding: 0.1rem 0.25rem 0;\n      text-align: center;\n    }\n\n    /* Square Root Radical Styling */\n    .sqrt-wrap {\n      display: inline-flex;\n      align-items: center;\n      vertical-align: middle;\n    }\n\n    .sqrt-sign {\n      font-size: 1.3em;\n      line-height: 1;\n      margin-right: 1px;\n      font-weight: 700;\n    }\n\n    .sqrt-body {\n      border-top: 1.5px solid #0f172a;\n      padding: 0.1rem 0.25rem 0;\n      display: inline-flex;\n      align-items: center;\n    }\n\n    /* Book-like Section Header Styling */\n    .section-title {\n      border-bottom: 2px solid #1e3a8a;\n      padding-bottom: 0.35rem;\n      margin-bottom: 1rem;\n    }\n\n    /* Standard Academic Table Styling */\n    .notes-table {\n      width: 100%;\n      border-collapse: collapse;\n      font-size: 0.96rem;\n    }\n\n    .notes-table th,\n    .notes-table td {\n      border: 1px solid #94a3b8;\n      padding: 0.5rem 0.7rem;\n      text-align: left;\n      vertical-align: middle;\n      color: #0f172a;\n    }\n\n    .notes-table thead th {\n      font-weight: 700;\n      color: #0f172a;\n    }\n\n    .notes-table tbody tr:nth-child(even) {\n      background-color: #f8fafc;\n    }\n\n    /* Solution Reveal State */\n    .solution-box.is-hidden {\n      display: none;\n    }\n\n    /* =========================================================================\n       PRINT & PDF EXPORT OPTIMIZATION (DARK, CRISP, NO CUTOFFS)\n       ========================================================================= */\n    @page {\n      size: A4 portrait;\n      margin: 12mm 13mm;\n    }\n\n    @media print {\n      * {\n        -webkit-print-color-adjust: exact !important;\n        print-color-adjust: exact !important;\n      }\n\n      html, body {\n        background-color: #ffffff !important;\n        color: #000000 !important;\n        font-size: 10.5pt !important;\n        line-height: 1.42 !important;\n        margin: 0 !important;\n        padding: 0 !important;\n      }\n\n      /* Hide interactive buttons/toolbars on physical print */\n      .no-print {\n        display: none !important;\n      }\n\n      /* Remove outer page shell shadow and padding for full A4 utilization */\n      .book-sheet {\n        max-width: 100% !important;\n        width: 100% !important;\n        margin: 0 !important;\n        padding: 0 !important;\n        border: none !important;\n        box-shadow: none !important;\n        background: #ffffff !important;\n      }\n\n      /* Ensure every solution is printed even if hidden on screen */\n      .solution-box.is-hidden {\n        display: block !important;\n      }\n\n      /* Prevent orphan headings */\n      h1, h2, h3, h4, .section-title {\n        break-after: avoid !important;\n        page-break-after: avoid !important;\n        color: #000000 !important;\n      }\n\n      /* Keep cards, formulas, figures, numericals, and table rows intact */\n      .avoid-break,\n      .numerical-card,\n      .concept-card,\n      .figure-card,\n      .callout-box,\n      tr {\n        break-inside: avoid !important;\n        page-break-inside: avoid !important;\n      }\n\n      /* Repeat table headers if a large table spans two pages */\n      thead {\n        display: table-header-group !important;\n      }\n\n      /* Ensure horizontal scroll containers do not clip wide tables on paper */\n      .table-responsive {\n        overflow: visible !important;\n      }\n\n      /* Sharpen borders and darken text for crisp monochrome or color printing */\n      p, li, td, th, span, div {\n        color: #000000 !important;\n      }\n\n      .text-indigo-900, .text-blue-900 { color: #1e3a8a !important; }\n      .text-teal-900 { color: #134e4a !important; }\n      .text-emerald-900 { color: #064e3b !important; }\n      .text-amber-900 { color: #78350f !important; }\n      .text-rose-900 { color: #881337 !important; }\n\n      .notes-table th,\n      .notes-table td {\n        border: 1px solid #334155 !important;\n        padding: 0.35rem 0.5rem !important;\n        font-size: 9.5pt !important;\n      }\n\n      .shadow-sm, .shadow, .shadow-md {\n        box-shadow: none !important;\n      }\n    }\n  <\/style>\n<\/head>\n\n<body class=\"py-4 px-2 sm:px-6 lg:px-8\">\n\n  <!-- Main Book-Style Notes Sheet (Single Column, No Side Navigation) -->\n  <main class=\"book-sheet max-w-5xl mx-auto bg-white border border-slate-300 rounded-xl shadow-md p-5 sm:p-8 lg:p-10\">\n\n    <!-- =================================================================== -->\n    <!-- BOOK HEADER & PRINT CONTROLS                                        -->\n    <!-- =================================================================== -->\n    <header class=\"border-b-4 border-indigo-900 pb-5 mb-7\">\n      <div class=\"flex flex-col md:flex-row md:items-start md:justify-between gap-4\">\n        <div>\n          <div class=\"flex flex-wrap items-center gap-2 mb-2\">\n            <span class=\"inline-block bg-indigo-100 text-indigo-900 border border-indigo-300 text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md\">\n              Physics \u2014 Chapter 1\n            <\/span>\n            <span class=\"inline-block bg-emerald-100 text-emerald-900 border border-emerald-300 text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md\">\n              RRB NTPC \u2022 SSC \u2022 Railway ALP / Group D \u2022 Govt Exams\n            <\/span>\n            <span class=\"inline-block bg-amber-100 text-amber-900 border border-amber-300 text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md\">\n              Fact-Checked &amp; Printable\n            <\/span>\n          <\/div>\n          <h1 class=\"text-3xl sm:text-4xl font-bold text-slate-950 tracking-tight\">\n            Units and Measurements\n          <\/h1>\n          <p class=\"text-base sm:text-lg text-slate-800 mt-1 font-normal\">\n            Complete Exam-Oriented Notes: Physical Quantities, Systems of Units, SI Prefixes, Derived Quantities &amp; Dimensional Analysis\n          <\/p>\n        <\/div>\n\n        <!-- Action Buttons (Automatically hidden on print/PDF) -->\n        <div class=\"no-print flex flex-wrap items-center gap-2 shrink-0\">\n          <button\n            id=\"toggleSolutionsBtn\"\n            type=\"button\"\n            class=\"px-3.5 py-2 text-sm font-bold rounded-lg border border-emerald-700 bg-emerald-50 text-emerald-900 hover:bg-emerald-100 transition cursor-pointer\"\n            aria-pressed=\"false\"\n          >\n            Hide Solutions (Self-Test)\n          <\/button>\n          <button\n            id=\"printBtn\"\n            type=\"button\"\n            class=\"px-4 py-2 text-sm font-bold rounded-lg bg-indigo-900 text-white hover:bg-indigo-800 transition cursor-pointer\"\n          >\n            Print / Save PDF\n          <\/button>\n        <\/div>\n      <\/div>\n\n      <!-- Print Status Toast (Accessible feedback without alert()) -->\n      <div id=\"statusNotice\" class=\"no-print hidden mt-3 px-3 py-2 rounded-lg bg-blue-50 border border-blue-300 text-sm text-blue-950 font-semibold\" role=\"status\" aria-live=\"polite\"><\/div>\n    <\/header>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 1: PHYSICAL QUANTITIES & UNITS                              -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">1<\/span>\n        Physical Quantities &amp; Units\n      <\/h2>\n\n      <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n        <!-- Card: Physical Quantities -->\n        <article class=\"concept-card avoid-break bg-blue-50/70 border border-blue-300 rounded-xl p-4\">\n          <h3 class=\"text-lg font-bold text-blue-900 mb-2\">1.1 Physical Quantities<\/h3>\n          <p class=\"text-slate-900 mb-2.5\">\n            A <strong>Physical Quantity<\/strong> refers to any property of a material or system that can be measured directly or indirectly and expressed numerically along with a unit.\n          <\/p>\n          <ul class=\"list-disc pl-5 space-y-1 text-slate-900 mb-3\">\n            <li><strong>Examples:<\/strong> Mass, length, time, temperature, force, and velocity.<\/li>\n            <li><strong>Numerical Value (<span class=\"math-var\">n<\/span>):<\/strong> Indicates the magnitude (how many times the unit is contained in the quantity).<\/li>\n            <li><strong>Unit (<span class=\"math-var\">u<\/span>):<\/strong> Specifies the accepted standard of measurement (e.g., metre, kilogram).<\/li>\n          <\/ul>\n          <div class=\"bg-white border-l-4 border-blue-700 rounded-md px-3 py-2 text-center\">\n            <span class=\"font-bold text-slate-950\">Physical Quantity (<span class=\"math-var\">Q<\/span>) = Numerical Value (<span class=\"math-var\">n<\/span>) \u00d7 Unit (<span class=\"math-var\">u<\/span>)<\/span>\n          <\/div>\n          <p class=\"text-xs text-slate-800 mt-1.5\">\n            <em>*Verified Correction:<\/em> A physical quantity is the <strong>product<\/strong> (<span class=\"math\">n \u00d7 u<\/span>), not a sum (<span class=\"math\">n + u<\/span>). Example: <span class=\"math\">5 m = 5 \u00d7 1 metre<\/span>.\n          <\/p>\n        <\/article>\n\n        <!-- Card: Units -->\n        <article class=\"concept-card avoid-break bg-teal-50/70 border border-teal-300 rounded-xl p-4\">\n          <h3 class=\"text-lg font-bold text-teal-900 mb-2\">1.2 Units &amp; Their Importance<\/h3>\n          <p class=\"text-slate-900 mb-2.5\">\n            A <strong>Unit<\/strong> is an arbitrarily chosen, internationally accepted reference standard used to measure physical quantities of the same kind.\n          <\/p>\n          <ul class=\"list-disc pl-5 space-y-1.5 text-slate-900\">\n            <li><strong>Examples:<\/strong> The SI unit of length is the <strong>metre (m)<\/strong>, and the SI unit of mass is the <strong>kilogram (kg)<\/strong>.<\/li>\n            <li><strong>Consistency:<\/strong> Units ensure uniformity and accuracy in measurements everywhere.<\/li>\n            <li><strong>Global Communication:<\/strong> They allow scientists and engineers worldwide to exchange results in a standardized form.<\/li>\n            <li><strong>Calculations &amp; Comparisons:<\/strong> They form the basis for scientific formulas and meaningful comparison of magnitudes.<\/li>\n          <\/ul>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 2: FUNDAMENTAL & DERIVED UNITS                              -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">2<\/span>\n        Fundamental Units &amp; Derived Units\n      <\/h2>\n\n      <!-- 2.1 Fundamental Units -->\n      <div class=\"mb-5\">\n        <h3 class=\"text-lg font-bold text-slate-950 mb-2\">2.1 Fundamental (Base) Quantities &amp; Fundamental Units<\/h3>\n        <p class=\"text-slate-900 mb-3\">\n          <strong>Fundamental units<\/strong> are standard units used to measure the <strong>seven fundamental (base) physical quantities<\/strong>. These quantities are mutually independent and cannot be derived from one another.\n        <\/p>\n\n        <div class=\"table-responsive overflow-x-auto rounded-lg border border-slate-300\">\n          <table class=\"notes-table\">\n            <thead class=\"bg-indigo-100\">\n              <tr>\n                <th class=\"w-12 text-center\">S.No.<\/th>\n                <th>Fundamental Quantity<\/th>\n                <th>Quantity Symbol<\/th>\n                <th>SI Base Unit<\/th>\n                <th>Unit Symbol<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <tr>\n                <td class=\"text-center font-bold\">1<\/td>\n                <td class=\"font-semibold\">Mass<\/td>\n                <td class=\"math-var\">m<\/td>\n                <td>kilogram<\/td>\n                <td class=\"font-bold\">kg<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"text-center font-bold\">2<\/td>\n                <td class=\"font-semibold\">Length<\/td>\n                <td class=\"math-var\">l<\/td>\n                <td>metre<\/td>\n                <td class=\"font-bold\">m<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"text-center font-bold\">3<\/td>\n                <td class=\"font-semibold\">Time<\/td>\n                <td class=\"math-var\">t<\/td>\n                <td>second<\/td>\n                <td class=\"font-bold\">s<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"text-center font-bold\">4<\/td>\n                <td class=\"font-semibold\">Electric Current<\/td>\n                <td class=\"math-var\">I<\/td>\n                <td>ampere<\/td>\n                <td class=\"font-bold\">A<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"text-center font-bold\">5<\/td>\n                <td class=\"font-semibold\">Thermodynamic Temperature<\/td>\n                <td class=\"math-var\">T<\/td>\n                <td>kelvin<\/td>\n                <td class=\"font-bold\">K<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"text-center font-bold\">6<\/td>\n                <td class=\"font-semibold\">Amount of Substance<\/td>\n                <td class=\"math-var\">n<\/td>\n                <td>mole<\/td>\n                <td class=\"font-bold\">mol<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"text-center font-bold\">7<\/td>\n                <td class=\"font-semibold\">Luminous Intensity<\/td>\n                <td class=\"math-var\">I<sub>v<\/sub><\/td>\n                <td>candela<\/td>\n                <td class=\"font-bold\">cd<\/td>\n              <\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"callout-box avoid-break mt-3 bg-amber-50 border-l-4 border-amber-600 rounded-r-lg px-4 py-2.5 text-sm text-slate-900\">\n          <strong class=\"text-amber-900\">RRB NTPC Exam Rule (SI Naming Convention):<\/strong> Unit names are always written in <strong>lowercase<\/strong> even when named after a scientist (e.g., <em>kelvin, ampere, newton, joule<\/em>), whereas their symbols are <strong>capitalized<\/strong> (<strong>K, A, N, J<\/strong>). Note that the symbol for second is lowercase <strong>s<\/strong> (capital <strong>S<\/strong> stands for <em>siemens<\/em>, the unit of electrical conductance).\n        <\/div>\n      <\/div>\n\n      <!-- 2.2 Derived Units -->\n      <div class=\"avoid-break bg-slate-50 border border-slate-300 rounded-xl p-4 mb-4\">\n        <h3 class=\"text-lg font-bold text-slate-950 mb-2\">2.2 Derived Quantities &amp; Derived Units<\/h3>\n        <p class=\"text-slate-900 mb-2.5\">\n          <strong>Derived units<\/strong> are units used to measure derived physical quantities, which are obtained by multiplying or dividing two or more fundamental quantities.\n        <\/p>\n        <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5\">\n          <div class=\"bg-white border border-slate-300 rounded-lg p-2.5\">\n            <div class=\"font-bold text-indigo-900\">Area<\/div>\n            <div class=\"text-sm text-slate-900\">Length \u00d7 Breadth<\/div>\n            <div class=\"text-sm font-bold mt-1\">SI Unit: m<sup>2<\/sup><\/div>\n          <\/div>\n          <div class=\"bg-white border border-slate-300 rounded-lg p-2.5\">\n            <div class=\"font-bold text-indigo-900\">Volume<\/div>\n            <div class=\"text-sm text-slate-900\">Length \u00d7 Breadth \u00d7 Height<\/div>\n            <div class=\"text-sm font-bold mt-1\">SI Unit: m<sup>3<\/sup><\/div>\n          <\/div>\n          <div class=\"bg-white border border-slate-300 rounded-lg p-2.5\">\n            <div class=\"font-bold text-indigo-900\">Velocity<\/div>\n            <div class=\"text-sm text-slate-900\">Displacement / Time<\/div>\n            <div class=\"text-sm font-bold mt-1\">SI Unit: m/s (m\u00b7s<sup>\u22121<\/sup>)<\/div>\n          <\/div>\n          <div class=\"bg-white border border-slate-300 rounded-lg p-2.5\">\n            <div class=\"font-bold text-indigo-900\">Acceleration<\/div>\n            <div class=\"text-sm text-slate-900\">Change in Velocity / Time<\/div>\n            <div class=\"text-sm font-bold mt-1\">SI Unit: m/s<sup>2<\/sup> (m\u00b7s<sup>\u22122<\/sup>)<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Solved Practice Question 1 -->\n      <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n        <div class=\"font-bold text-emerald-900 mb-2\">\n          Q1. Write the SI unit (and base SI equivalent) of the following derived quantities: (1) Force, (2) Pressure, (3) Work, (4) Power, (5) Energy.\n        <\/div>\n        <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3\">\n          <div class=\"table-responsive overflow-x-auto\">\n            <table class=\"notes-table\">\n              <thead class=\"bg-emerald-100\">\n                <tr>\n                  <th>Quantity<\/th>\n                  <th>Formula<\/th>\n                  <th>Special SI Unit<\/th>\n                  <th>Base SI Equivalent<\/th>\n                  <th>CGS Unit (Exam Bonus)<\/th>\n                <\/tr>\n              <\/thead>\n              <tbody>\n                <tr>\n                  <td class=\"font-bold\">1. Force<\/td>\n                  <td>Mass \u00d7 Acceleration (<span class=\"math\">m \u00d7 a<\/span>)<\/td>\n                  <td class=\"font-bold\">newton (N)<\/td>\n                  <td>kg\u00b7m\u00b7s<sup>\u22122<\/sup><\/td>\n                  <td>dyne (<span class=\"math\">1 N = 10<sup>5<\/sup> dyne<\/span>)<\/td>\n                <\/tr>\n                <tr>\n                  <td class=\"font-bold\">2. Pressure<\/td>\n                  <td>Force / Area (<span class=\"math\">F / A<\/span>)<\/td>\n                  <td class=\"font-bold\">pascal (Pa)<\/td>\n                  <td>N\u00b7m<sup>\u22122<\/sup> = kg\u00b7m<sup>\u22121<\/sup>\u00b7s<sup>\u22122<\/sup><\/td>\n                  <td>barye (dyne/cm<sup>2<\/sup>)<\/td>\n                <\/tr>\n                <tr>\n                  <td class=\"font-bold\">3. Work<\/td>\n                  <td>Force \u00d7 Displacement (<span class=\"math\">F\u00b7d cos\u03b8<\/span>)<\/td>\n                  <td class=\"font-bold\">joule (J)<\/td>\n                  <td>N\u00b7m = kg\u00b7m<sup>2<\/sup>\u00b7s<sup>\u22122<\/sup><\/td>\n                  <td>erg (<span class=\"math\">1 J = 10<sup>7<\/sup> erg<\/span>)<\/td>\n                <\/tr>\n                <tr>\n                  <td class=\"font-bold\">4. Power<\/td>\n                  <td>Work / Time (<span class=\"math\">W / t<\/span>)<\/td>\n                  <td class=\"font-bold\">watt (W)<\/td>\n                  <td>J\u00b7s<sup>\u22121<\/sup> = kg\u00b7m<sup>2<\/sup>\u00b7s<sup>\u22123<\/sup><\/td>\n                  <td>erg/s (<span class=\"math\">1 HP = 746 W<\/span>)<\/td>\n                <\/tr>\n                <tr>\n                  <td class=\"font-bold\">5. Energy<\/td>\n                  <td>Capacity to do work<\/td>\n                  <td class=\"font-bold\">joule (J)<\/td>\n                  <td>kg\u00b7m<sup>2<\/sup>\u00b7s<sup>\u22122<\/sup><\/td>\n                  <td>erg (<span class=\"math\">1 kWh = 3.6 \u00d7 10<sup>6<\/sup> J<\/span>)<\/td>\n                <\/tr>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 3: SYSTEMS OF UNITS                                         -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">3<\/span>\n        Systems of Units\n      <\/h2>\n\n      <p class=\"text-slate-900 mb-3\">\n        A complete set of fundamental and derived units used to measure all physical quantities consistently is called a <strong>System of Units<\/strong>. The four major systems are:\n      <\/p>\n\n      <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n        <!-- CGS -->\n        <article class=\"concept-card avoid-break bg-sky-50/70 border border-sky-300 rounded-xl p-4\">\n          <div class=\"flex items-center justify-between mb-1.5\">\n            <h3 class=\"text-lg font-bold text-sky-950\">1. CGS System<\/h3>\n            <span class=\"text-xs font-bold bg-sky-200 text-sky-950 px-2 py-0.5 rounded\">Gaussian / Metric<\/span>\n          <\/div>\n          <ul class=\"list-disc pl-5 space-y-1 text-slate-900 text-sm sm:text-base\">\n            <li><strong>Base Units:<\/strong> Length = <strong>centimetre (cm)<\/strong>, Mass = <strong>gram (g)<\/strong>, Time = <strong>second (s)<\/strong>.<\/li>\n            <li><strong>Usage:<\/strong> Commonly used for small-scale laboratory measurements and classical physics.<\/li>\n          <\/ul>\n        <\/article>\n\n        <!-- FPS -->\n        <article class=\"concept-card avoid-break bg-amber-50/70 border border-amber-300 rounded-xl p-4\">\n          <div class=\"flex items-center justify-between mb-1.5\">\n            <h3 class=\"text-lg font-bold text-amber-950\">2. FPS System<\/h3>\n            <span class=\"text-xs font-bold bg-amber-200 text-amber-950 px-2 py-0.5 rounded\">British System<\/span>\n          <\/div>\n          <ul class=\"list-disc pl-5 space-y-1 text-slate-900 text-sm sm:text-base\">\n            <li><strong>Base Units:<\/strong> Length = <strong>foot (ft)<\/strong>, Mass = <strong>pound (lb)<\/strong>, Time = <strong>second (s)<\/strong>.<\/li>\n            <li><strong>Usage:<\/strong> Historically British; still used in certain engineering applications in the United States.<\/li>\n          <\/ul>\n        <\/article>\n\n        <!-- MKS -->\n        <article class=\"concept-card avoid-break bg-teal-50/70 border border-teal-300 rounded-xl p-4\">\n          <div class=\"flex items-center justify-between mb-1.5\">\n            <h3 class=\"text-lg font-bold text-teal-950\">3. MKS System<\/h3>\n            <span class=\"text-xs font-bold bg-teal-200 text-teal-950 px-2 py-0.5 rounded\">Metric<\/span>\n          <\/div>\n          <ul class=\"list-disc pl-5 space-y-1 text-slate-900 text-sm sm:text-base\">\n            <li><strong>Base Units:<\/strong> Length = <strong>metre (m)<\/strong>, Mass = <strong>kilogram (kg)<\/strong>, Time = <strong>second (s)<\/strong>.<\/li>\n            <li><strong>Usage:<\/strong> Widely used in mechanics and larger-scale engineering; served as the foundation for the SI system.<\/li>\n          <\/ul>\n        <\/article>\n\n        <!-- SI -->\n        <article class=\"concept-card avoid-break bg-indigo-50/80 border border-indigo-400 rounded-xl p-4\">\n          <div class=\"flex items-center justify-between mb-1.5\">\n            <h3 class=\"text-lg font-bold text-indigo-950\">4. SI System (International System)<\/h3>\n            <span class=\"text-xs font-bold bg-indigo-200 text-indigo-950 px-2 py-0.5 rounded\">Global Standard<\/span>\n          <\/div>\n          <ul class=\"list-disc pl-5 space-y-1 text-slate-900 text-sm sm:text-base\">\n            <li><strong>Full Form:<\/strong> <em>Syst\u00e8me International d'Unit\u00e9s<\/em> (adopted globally in 1960 by CGPM).<\/li>\n            <li><strong>Structure:<\/strong> Consists of <strong>7 Base Units<\/strong> (m, kg, s, A, K, mol, cd), <strong>2 Supplementary Units<\/strong> (rad, sr), and <strong>Derived Units<\/strong>.<\/li>\n            <li><strong>Advantage:<\/strong> Rational, coherent, and decimal-based (powers of 10).<\/li>\n          <\/ul>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 4: SUPPLEMENTARY QUANTITIES                                 -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">4<\/span>\n        Supplementary Quantities\n      <\/h2>\n\n      <p class=\"text-slate-900 mb-3\">\n        <strong>Supplementary quantities<\/strong> are purely geometrical quantities used to measure 2D and 3D angles. They have <strong>specific SI units but are dimensionless<\/strong> (<span class=\"dim-box\">[M<sup>0<\/sup>L<sup>0<\/sup>T<sup>0<\/sup>]<\/span>).\n      <\/p>\n\n      <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n        <!-- Plane Angle -->\n        <article class=\"figure-card avoid-break bg-purple-50/60 border border-purple-300 rounded-xl p-4\">\n          <h3 class=\"text-lg font-bold text-purple-950 mb-1.5\">4.1 Plane Angle (<span class=\"math-var\">\u03b8<\/span> or <span class=\"math\">d\u03b8<\/span>)<\/h3>\n          <p class=\"text-slate-900 text-sm sm:text-base mb-2\">\n            Represents the 2D angle subtended by a circular arc at the center of a circle.\n          <\/p>\n          <ul class=\"list-disc pl-5 space-y-1 text-slate-900 text-sm sm:text-base mb-3\">\n            <li><strong>SI Unit:<\/strong> <strong>radian (rad)<\/strong><\/li>\n            <li>\n              <strong>Formula:<\/strong>\n              <span class=\"formula-pill ml-1\">\n                <span class=\"math-var\">d\u03b8<\/span> =\n                <span class=\"frac\">\n                  <span class=\"frac-num\">Arc Length (<span class=\"math-var\">ds<\/span>)<\/span>\n                  <span class=\"frac-den\">Radius (<span class=\"math-var\">r<\/span>)<\/span>\n                <\/span>\n              <\/span>\n            <\/li>\n            <li><strong>Exam Conversions:<\/strong> <span class=\"math\">180\u00b0 = \u03c0 rad<\/span>; Full circle = <span class=\"math\">2\u03c0 rad<\/span>; <span class=\"math\">1 rad \u2248 57.3\u00b0<\/span>.<\/li>\n          <\/ul>\n\n          <!-- Crisp SVG Diagram for Plane Angle (Source Page 13) -->\n          <div class=\"bg-white border border-purple-200 rounded-lg p-2 flex justify-center\">\n            <svg viewBox=\"0 0 260 115\" class=\"w-full max-w-[250px] h-auto\" role=\"img\" aria-label=\"Plane angle diagram showing center O, radius r, arc length ds, and angle d theta\">\n              <!-- Sector fill -->\n              <path d=\"M 35 90 L 210 90 A 175 175 0 0 0 185 22 Z\" fill=\"#f3e8ff\" stroke=\"#1e293b\" stroke-width=\"1.8\" />\n              <!-- Angle arc -->\n              <path d=\"M 80 90 A 45 45 0 0 0 73 72\" fill=\"none\" stroke=\"#6b21a8\" stroke-width=\"2\" />\n              <!-- Center point -->\n              <circle cx=\"35\" cy=\"90\" r=\"3\" fill=\"#0f172a\" />\n              <!-- Labels -->\n              <text x=\"16\" y=\"95\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#0f172a\">O<\/text>\n              <text x=\"90\" y=\"84\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#6b21a8\">d\u03b8<\/text>\n              <text x=\"102\" y=\"47\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"15\" font-style=\"italic\" font-weight=\"700\" fill=\"#0f172a\">r<\/text>\n              <text x=\"214\" y=\"60\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"15\" font-weight=\"700\" fill=\"#0f172a\">ds<\/text>\n            <\/svg>\n          <\/div>\n        <\/article>\n\n        <!-- Solid Angle -->\n        <article class=\"figure-card avoid-break bg-purple-50/60 border border-purple-300 rounded-xl p-4\">\n          <h3 class=\"text-lg font-bold text-purple-950 mb-1.5\">4.2 Solid Angle (<span class=\"math-var\">\u03a9<\/span> or <span class=\"math\">d\u03a9<\/span>)<\/h3>\n          <p class=\"text-slate-900 text-sm sm:text-base mb-2\">\n            Represents the 3D conical angle subtended by a surface area at the center of a sphere.\n          <\/p>\n          <ul class=\"list-disc pl-5 space-y-1 text-slate-900 text-sm sm:text-base mb-3\">\n            <li><strong>SI Unit:<\/strong> <strong>steradian (sr)<\/strong><\/li>\n            <li>\n              <strong>Formula:<\/strong>\n              <span class=\"formula-pill ml-1\">\n                <span class=\"math-var\">d\u03a9<\/span> =\n                <span class=\"frac\">\n                  <span class=\"frac-num\">Surface Area (<span class=\"math-var\">dA<\/span>)<\/span>\n                  <span class=\"frac-den\">Radius<sup>2<\/sup> (<span class=\"math-var\">r<\/span><sup>2<\/sup>)<\/span>\n                <\/span>\n              <\/span>\n            <\/li>\n            <li><strong>Exam Fact:<\/strong> Total solid angle of a complete sphere = <span class=\"math\">4\u03c0r<sup>2<\/sup> / r<sup>2<\/sup> = 4\u03c0 sr<\/span>.<\/li>\n          <\/ul>\n\n          <!-- Crisp SVG Diagram for Solid Angle (Source Page 13) -->\n          <div class=\"bg-white border border-purple-200 rounded-lg p-2 flex justify-center\">\n            <svg viewBox=\"0 0 260 115\" class=\"w-full max-w-[250px] h-auto\" role=\"img\" aria-label=\"Solid angle cone diagram showing vertex O, radius r, solid angle d Omega, and surface area dA\">\n              <!-- Cone edges -->\n              <polygon points=\"30,62 195,18 228,58 205,102\" fill=\"#f3e8ff\" opacity=\"0.55\" />\n              <line x1=\"30\" y1=\"62\" x2=\"195\" y2=\"18\" stroke=\"#1e293b\" stroke-width=\"1.8\" />\n              <line x1=\"30\" y1=\"62\" x2=\"205\" y2=\"102\" stroke=\"#1e293b\" stroke-width=\"1.8\" />\n              <line x1=\"30\" y1=\"62\" x2=\"182\" y2=\"58\" stroke=\"#1e293b\" stroke-width=\"1.4\" />\n              <line x1=\"30\" y1=\"62\" x2=\"228\" y2=\"58\" stroke=\"#1e293b\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\" />\n              <!-- Curved spherical patch dA -->\n              <path d=\"M 195 18 Q 220 35 228 58 Q 222 84 205 102 Q 194 78 182 58 Q 192 36 195 18 Z\" fill=\"#e9d5ff\" stroke=\"#1e293b\" stroke-width=\"1.8\" />\n              <!-- Small solid angle indicator near vertex -->\n              <polygon points=\"82,48 94,61 84,74 72,62\" fill=\"none\" stroke=\"#6b21a8\" stroke-width=\"1.6\" />\n              <circle cx=\"30\" cy=\"62\" r=\"3\" fill=\"#0f172a\" />\n              <!-- Labels -->\n              <text x=\"12\" y=\"67\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#0f172a\">O<\/text>\n              <text x=\"106\" y=\"34\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"15\" font-style=\"italic\" font-weight=\"700\" fill=\"#0f172a\">r<\/text>\n              <text x=\"97\" y=\"54\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#6b21a8\">d\u03a9<\/text>\n              <text x=\"200\" y=\"63\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#0f172a\">dA<\/text>\n            <\/svg>\n          <\/div>\n        <\/article>\n      <\/div>\n\n      <p class=\"text-xs text-slate-800 mt-2\">\n        <em>*Contextual Note (SI Standard):<\/em> Since 1995 (20th CGPM), radian and steradian are formally classified as <strong>dimensionless derived units<\/strong> with special names, though competitive exam syllabi (NCERT, RRB NTPC, SSC) still widely refer to them as the 2 supplementary units.\n      <\/p>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 5: CONVERSION OF UNITS, SI PREFIXES & NUMERICALS            -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">5<\/span>\n        Conversion of Units &amp; SI Prefixes\n      <\/h2>\n\n      <!-- 5.1 Conversion Concept + Graph -->\n      <div class=\"grid grid-cols-1 md:grid-cols-5 gap-4 mb-5\">\n        <article class=\"concept-card avoid-break md:col-span-3 bg-blue-50/70 border border-blue-300 rounded-xl p-4\">\n          <h3 class=\"text-lg font-bold text-blue-900 mb-2\">5.1 Concept of Unit Conversion<\/h3>\n          <p class=\"text-slate-900 mb-2\">\n            The magnitude of a physical quantity remains constant regardless of the unit system used to measure it:\n          <\/p>\n          <div class=\"flex flex-wrap gap-2 mb-3\">\n            <span class=\"formula-pill\">Q = n \u00d7 u = constant<\/span>\n            <span class=\"formula-pill\">n<sub>1<\/sub>\u00b7u<sub>1<\/sub> = n<sub>2<\/sub>\u00b7u<sub>2<\/sub><\/span>\n            <span class=\"formula-pill\">n \u221d 1/u<\/span>\n          <\/div>\n          <ul class=\"list-disc pl-5 space-y-1 text-slate-900\">\n            <li><strong>Inverse Relation:<\/strong> The numerical value (<span class=\"math-var\">n<\/span>) is <strong>inversely proportional<\/strong> to the size of the unit (<span class=\"math-var\">u<\/span>). A larger unit gives a smaller numerical value, and vice versa.<\/li>\n            <li><strong>Example:<\/strong> <span class=\"math\">3 m = 300 cm<\/span> (Here, <span class=\"math\">m &gt; cm<\/span>, so <span class=\"math\">3 &lt; 300<\/span>).<\/li>\n            <li><strong>Dimensional Conversion Formula:<\/strong> If <span class=\"math\">[Q] = [M<sup>a<\/sup>L<sup>b<\/sup>T<sup>c<\/sup>]<\/span>, then:\n              <div class=\"mt-1.5 font-bold text-slate-950\">\n                n<sub>2<\/sub> = n<sub>1<\/sub> \u00b7 [M<sub>1<\/sub>/M<sub>2<\/sub>]<sup>a<\/sup> \u00b7 [L<sub>1<\/sub>/L<sub>2<\/sub>]<sup>b<\/sup> \u00b7 [T<sub>1<\/sub>/T<sub>2<\/sub>]<sup>c<\/sup>\n              <\/div>\n            <\/li>\n          <\/ul>\n        <\/article>\n\n        <!-- Crisp SVG Graph of n vs u (Source Page 14) -->\n        <figure class=\"figure-card avoid-break md:col-span-2 bg-white border border-slate-300 rounded-xl p-3 flex flex-col items-center justify-center\">\n          <svg viewBox=\"0 0 240 185\" class=\"w-full max-w-[230px] h-auto\" role=\"img\" aria-label=\"Graph of numerical value n versus unit u showing a rectangular hyperbola\">\n            <!-- Subtle Grid -->\n            <g stroke=\"#e2e8f0\" stroke-width=\"1\">\n              <line x1=\"40\" y1=\"25\" x2=\"215\" y2=\"25\" />\n              <line x1=\"40\" y1=\"60\" x2=\"215\" y2=\"60\" />\n              <line x1=\"40\" y1=\"95\" x2=\"215\" y2=\"95\" />\n              <line x1=\"40\" y1=\"130\" x2=\"215\" y2=\"130\" />\n              <line x1=\"80\" y1=\"20\" x2=\"80\" y2=\"155\" />\n              <line x1=\"125\" y1=\"20\" x2=\"125\" y2=\"155\" />\n              <line x1=\"170\" y1=\"20\" x2=\"170\" y2=\"155\" />\n            <\/g>\n            <!-- Axes -->\n            <line x1=\"40\" y1=\"155\" x2=\"40\" y2=\"16\" stroke=\"#b91c1c\" stroke-width=\"2.2\" />\n            <polygon points=\"40,12 36,20 44,20\" fill=\"#b91c1c\" />\n            <line x1=\"40\" y1=\"155\" x2=\"220\" y2=\"155\" stroke=\"#b91c1c\" stroke-width=\"2.2\" />\n            <polygon points=\"224,155 216,151 216,159\" fill=\"#b91c1c\" />\n            <!-- Hyperbola Curve n = k/u -->\n            <path d=\"M 52 24 C 55 82, 74 128, 212 144\" fill=\"none\" stroke=\"#0f172a\" stroke-width=\"2.8\" stroke-linecap=\"round\" />\n            <!-- Labels -->\n            <text x=\"16\" y=\"88\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#b91c1c\">n<\/text>\n            <text x=\"128\" y=\"176\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#b91c1c\">u<\/text>\n            <text x=\"108\" y=\"68\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#0f172a\">n \u00b7 u = constant<\/text>\n            <text x=\"108\" y=\"85\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"12\" fill=\"#334155\">(Rectangular Hyperbola)<\/text>\n          <\/svg>\n          <figcaption class=\"text-xs font-bold text-slate-800 mt-1 text-center\">\n            Fig. 5.1: Graph between Numerical Value (<span class=\"math-var\">n<\/span>) and Unit (<span class=\"math-var\">u<\/span>)\n          <\/figcaption>\n        <\/figure>\n      <\/div>\n\n      <!-- Solved MCQ (Page 15) -->\n      <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4 mb-5\">\n        <div class=\"font-bold text-emerald-900 mb-1.5\">\n          Q2. A physical quantity is measured and its value is found to be <span class=\"math\">nu<\/span>, where <span class=\"math-var\">n<\/span> = numerical value and <span class=\"math-var\">u<\/span> = unit. Which of the following relations is true?\n        <\/div>\n        <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-2 text-slate-900 mb-2 text-sm sm:text-base\">\n          <div>(a) <span class=\"math\">n \u221d u<sup>2<\/sup><\/span><\/div>\n          <div>(b) <span class=\"math\">n \u221d \u221au<\/span><\/div>\n          <div>(c) <span class=\"math\">n \u221d u<\/span><\/div>\n          <div>(d) <span class=\"math\">n \u221d 1/u<\/span><\/div>\n        <\/div>\n        <div class=\"solution-box bg-white border border-emerald-200 rounded-lg px-3 py-2 text-sm sm:text-base\">\n          <strong class=\"text-emerald-900\">Answer: (d) <span class=\"math\">n \u221d 1/u<\/span>.<\/strong> Since <span class=\"math\">Q = n \u00d7 u = constant<\/span>, numerical value varies inversely with the size of the unit.\n        <\/div>\n      <\/div>\n\n      <!-- 5.2 SI Prefixes Table (Page 16 - Fact-Checked & Corrected) -->\n      <div class=\"mb-5\">\n        <h3 class=\"text-lg font-bold text-slate-950 mb-2\">5.2 Prefixes for SI Units (Fact-Checked &amp; Verified)<\/h3>\n        <div class=\"table-responsive overflow-x-auto rounded-lg border border-slate-300\">\n          <table class=\"notes-table\">\n            <thead class=\"bg-indigo-100\">\n              <tr>\n                <th>Decimal Factor<\/th>\n                <th>Power of 10<\/th>\n                <th>Prefix<\/th>\n                <th class=\"text-center\">Symbol<\/th>\n                <th>Example<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <tr>\n                <td>1,000,000,000<\/td>\n                <td class=\"font-bold\">10<sup>9<\/sup><\/td>\n                <td class=\"font-semibold\">giga<\/td>\n                <td class=\"text-center font-bold\">G<\/td>\n                <td>1 gigametre (Gm) = 10<sup>9<\/sup> m<\/td>\n              <\/tr>\n              <tr>\n                <td>1,000,000<\/td>\n                <td class=\"font-bold\">10<sup>6<\/sup><\/td>\n                <td class=\"font-semibold\">mega<\/td>\n                <td class=\"text-center font-bold\">M<\/td>\n                <td>1 megametre (Mm) = 10<sup>6<\/sup> m<\/td>\n              <\/tr>\n              <tr>\n                <td>1,000<\/td>\n                <td class=\"font-bold\">10<sup>3<\/sup><\/td>\n                <td class=\"font-semibold\">kilo<\/td>\n                <td class=\"text-center font-bold\">k<\/td>\n                <td>1 kilogram (kg) = 10<sup>3<\/sup> g<\/td>\n              <\/tr>\n              <tr>\n                <td>100<\/td>\n                <td class=\"font-bold\">10<sup>2<\/sup><\/td>\n                <td class=\"font-semibold\">hecto<\/td>\n                <td class=\"text-center font-bold\">h<\/td>\n                <td>1 hectogram (hg) = 100 g<\/td>\n              <\/tr>\n              <tr>\n                <td>10<\/td>\n                <td class=\"font-bold\">10<sup>1<\/sup><\/td>\n                <td class=\"font-semibold\">deca (deka)<\/td>\n                <td class=\"text-center font-bold\">da<\/td>\n                <td>1 decagram (dag) = 10 g<\/td>\n              <\/tr>\n              <tr>\n                <td>0.1<\/td>\n                <td class=\"font-bold\">10<sup>\u22121<\/sup><\/td>\n                <td class=\"font-semibold\">deci<\/td>\n                <td class=\"text-center font-bold\">d<\/td>\n                <td>1 decimetre (dm) = 0.1 m<\/td>\n              <\/tr>\n              <tr>\n                <td>0.01<\/td>\n                <td class=\"font-bold\">10<sup>\u22122<\/sup><\/td>\n                <td class=\"font-semibold\">centi<\/td>\n                <td class=\"text-center font-bold\">c<\/td>\n                <td>1 centimetre (cm) = 0.01 m<\/td>\n              <\/tr>\n              <tr>\n                <td>0.001<\/td>\n                <td class=\"font-bold\">10<sup>\u22123<\/sup><\/td>\n                <td class=\"font-semibold\">milli<\/td>\n                <td class=\"text-center font-bold\">m<\/td>\n                <td>1 milligram (mg) = 0.001 g<\/td>\n              <\/tr>\n              <tr>\n                <td>0.000001<\/td>\n                <td class=\"font-bold\">10<sup>\u22126<\/sup><\/td>\n                <td class=\"font-semibold\">micro<\/td>\n                <td class=\"text-center font-bold\">\u03bc<\/td>\n                <td>1 micrometre (\u03bcm) = 10<sup>\u22126<\/sup> m<\/td>\n              <\/tr>\n              <tr>\n                <td>0.000000001<\/td>\n                <td class=\"font-bold\">10<sup>\u22129<\/sup><\/td>\n                <td class=\"font-semibold\">nano<\/td>\n                <td class=\"text-center font-bold\">n<\/td>\n                <td>1 nanosecond (ns) = 10<sup>\u22129<\/sup> s<\/td>\n              <\/tr>\n              <tr>\n                <td>0.000000000001<\/td>\n                <td class=\"font-bold\">10<sup>\u221212<\/sup><\/td>\n                <td class=\"font-semibold\">pico<\/td>\n                <td class=\"text-center font-bold\">p<\/td>\n                <td>1 picosecond (ps) = 10<sup>\u221212<\/sup> s<\/td>\n              <\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n\n        <!-- Exam High-Yield Extra Units Box -->\n        <div class=\"callout-box avoid-break mt-3 bg-amber-50 border-l-4 border-amber-600 rounded-r-lg px-4 py-2.5 text-sm text-slate-900\">\n          <strong class=\"text-amber-900\">High-Frequency RRB NTPC Extra Prefixes &amp; Length Units:<\/strong>\n          <ul class=\"list-disc pl-5 mt-1 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-0.5\">\n            <li><strong>Tera (T)<\/strong> = 10<sup>12<\/sup> &nbsp;|&nbsp; <strong>Peta (P)<\/strong> = 10<sup>15<\/sup> &nbsp;|&nbsp; <strong>Exa (E)<\/strong> = 10<sup>18<\/sup><\/li>\n            <li><strong>Femto / Fermi (f)<\/strong> = 10<sup>\u221215<\/sup> &nbsp;|&nbsp; <strong>Atto (a)<\/strong> = 10<sup>\u221218<\/sup><\/li>\n            <li><strong>1 Angstrom (\u00c5)<\/strong> = 10<sup>\u221210<\/sup> m (atomic/wavelength scale)<\/li>\n            <li><strong>1 Astronomical Unit (AU)<\/strong> = 1.496 \u00d7 10<sup>11<\/sup> m (Earth\u2013Sun mean distance)<\/li>\n            <li><strong>1 Light Year (ly)<\/strong> = 9.46 \u00d7 10<sup>15<\/sup> m (distance, <em>not<\/em> time!)<\/li>\n            <li><strong>1 Parsec<\/strong> = 3.08 \u00d7 10<sup>16<\/sup> m \u2248 3.26 light years (largest unit of distance)<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <!-- 5.3 Unit Conversion Numericals (Pages 17, 18, 19) -->\n      <h3 class=\"text-lg font-bold text-slate-950 mb-2.5\">5.3 Solved Numericals on Unit Conversion<\/h3>\n      <div class=\"space-y-3\">\n        <!-- Q3 -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q3. Convert <span class=\"math\">72 km/h<\/span> into the CGS unit of velocity (<span class=\"math\">cm/s<\/span>).\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-1.5\">\n            <div><strong>Given:<\/strong> <span class=\"math\">v = 72 km/h<\/span>. We know <span class=\"math\">1 km = 1000 m = 10<sup>5<\/sup> cm<\/span> and <span class=\"math\">1 h = 3600 s<\/span>.<\/div>\n            <div>\n              <strong>Step 1 (Direct Method):<\/strong>\n              <span class=\"math\">v = 72 \u00d7<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">10<sup>5<\/sup> cm<\/span><span class=\"frac-den\">3600 s<\/span><\/span>\n              <span class=\"math\">= 72 \u00d7<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">1000<\/span><span class=\"frac-den\">36<\/span><\/span>\n              <span class=\"math\">cm/s = 2 \u00d7 1000 = 2000 cm/s<\/span>.\n            <\/div>\n            <div>\n              <strong>Exam Shortcut:<\/strong> Multiply by <span class=\"math\">5/18<\/span> to get m/s: <span class=\"math\">72 \u00d7 (5/18) = 20 m/s = 20 \u00d7 100 = 2000 cm/s<\/span>.\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Q4 -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q4. The density of a substance is <span class=\"math\">5 g/cm<sup>3<\/sup><\/span>. Convert it into <span class=\"math\">kg/m<sup>3<\/sup><\/span>.\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-1.5\">\n            <div><strong>Relations:<\/strong> <span class=\"math\">1 g = 10<sup>\u22123<\/sup> kg<\/span> and <span class=\"math\">1 cm = 10<sup>\u22122<\/sup> m \u21d2 1 cm<sup>3<\/sup> = (10<sup>\u22122<\/sup> m)<sup>3<\/sup> = 10<sup>\u22126<\/sup> m<sup>3<\/sup><\/span>.<\/div>\n            <div>\n              <strong>Calculation:<\/strong>\n              <span class=\"math\">\u03c1 = 5 \u00d7<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">10<sup>\u22123<\/sup> kg<\/span><span class=\"frac-den\">10<sup>\u22126<\/sup> m<sup>3<\/sup><\/span><\/span>\n              <span class=\"math\">= 5 \u00d7 10<sup>3<\/sup> kg/m<sup>3<\/sup> = 5000 kg/m<sup>3<\/sup><\/span>.\n            <\/div>\n            <div><strong>Exam Shortcut:<\/strong> Always remember <span class=\"math\">1 g/cm<sup>3<\/sup> = 1000 kg/m<sup>3<\/sup><\/span>.<\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Q5 -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q5. The value of acceleration due to gravity is <span class=\"math\">980 cm/s<sup>2<\/sup><\/span>. What will be its value if the unit of length is kilometre (<span class=\"math\">km<\/span>) and the unit of time is minute (<span class=\"math\">min<\/span>)?\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-1.5\">\n            <div><strong>Relations:<\/strong> <span class=\"math\">1 cm = 10<sup>\u22125<\/sup> km<\/span> and <span class=\"math\">1 s = (1/60) min \u21d2 1 s<sup>2<\/sup> = (1/3600) min<sup>2<\/sup><\/span>.<\/div>\n            <div>\n              <strong>Calculation:<\/strong>\n              <span class=\"math\">g = 980 \u00d7<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">10<sup>\u22125<\/sup> km<\/span><span class=\"frac-den\">(1/3600) min<sup>2<\/sup><\/span><\/span>\n              <span class=\"math\">= 980 \u00d7 3600 \u00d7 10<sup>\u22125<\/sup> km/min<sup>2<\/sup><\/span>\n            <\/div>\n            <div>\n              <span class=\"math\">g = 3,528,000 \u00d7 10<sup>\u22125<\/sup> = <strong>35.28 km/min<sup>2<\/sup><\/strong><\/span>.\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 6: DIMENSIONS & DIMENSIONAL FORMULA                         -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">6<\/span>\n        Dimensions &amp; Dimensional Formula\n      <\/h2>\n\n      <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4 mb-4\">\n        <article class=\"concept-card avoid-break bg-indigo-50/70 border border-indigo-300 rounded-xl p-4\">\n          <h3 class=\"text-lg font-bold text-indigo-900 mb-2\">6.1 Dimensions<\/h3>\n          <p class=\"text-slate-900 mb-2\">\n            The <strong>dimensions<\/strong> of a physical quantity are the <strong>powers (exponents)<\/strong> to which the fundamental quantities (Mass, Length, Time, etc.) must be raised to represent that quantity.\n          <\/p>\n          <p class=\"text-sm text-slate-900\">\n            <em>Example:<\/em> Since Force <span class=\"math\">= [M<sup>1<\/sup>L<sup>1<\/sup>T<sup>\u22122<\/sup>]<\/span>, the dimensions of force are <strong>1 in mass, 1 in length, and \u22122 in time<\/strong>.\n          <\/p>\n        <\/article>\n\n        <article class=\"concept-card avoid-break bg-teal-50/70 border border-teal-300 rounded-xl p-4\">\n          <h3 class=\"text-lg font-bold text-teal-900 mb-2\">6.2 Dimensional Formula &amp; Equation<\/h3>\n          <p class=\"text-slate-900 mb-2\">\n            A <strong>dimensional formula<\/strong> expresses a physical quantity in terms of fundamental quantities inside square brackets:\n          <\/p>\n          <div class=\"bg-white border border-teal-300 rounded-lg px-3 py-2 text-center mb-2\">\n            <span class=\"font-bold text-lg text-slate-950\">General Form: [M<sup>a<\/sup> L<sup>b<\/sup> T<sup>c<\/sup>]<\/span>\n          <\/div>\n          <p class=\"text-sm text-slate-900\">\n            Where <span class=\"math-var\">a<\/span> = power of Mass (M), <span class=\"math-var\">b<\/span> = power of Length (L), and <span class=\"math-var\">c<\/span> = power of Time (T). Equating a quantity to its formula (e.g., <span class=\"math\">[F] = [MLT<sup>\u22122<\/sup>]<\/span>) gives its <strong>Dimensional Equation<\/strong>.\n          <\/p>\n        <\/article>\n      <\/div>\n\n      <!-- Table: 7 Fundamental Quantities & Their Dimensions (Page 20) -->\n      <h3 class=\"text-lg font-bold text-slate-950 mb-2\">6.3 Fundamental Quantities and Their Dimension Symbols<\/h3>\n      <div class=\"table-responsive overflow-x-auto rounded-lg border border-slate-300\">\n        <table class=\"notes-table\">\n          <thead class=\"bg-indigo-100\">\n            <tr>\n              <th>Fundamental Physical Quantity<\/th>\n              <th>Primary Dimension Symbol (NCERT / SI)<\/th>\n              <th>Alternative Standard Symbol (ISO)<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <tr>\n              <td class=\"font-semibold\">Length<\/td>\n              <td><span class=\"dim-box\">[L]<\/span><\/td>\n              <td><span class=\"dim-box\">[L]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Mass<\/td>\n              <td><span class=\"dim-box\">[M]<\/span><\/td>\n              <td><span class=\"dim-box\">[M]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Time<\/td>\n              <td><span class=\"dim-box\">[T]<\/span><\/td>\n              <td><span class=\"dim-box\">[T]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Electric Current<\/td>\n              <td><span class=\"dim-box\">[A]<\/span><\/td>\n              <td><span class=\"dim-box\">[I]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Thermodynamic Temperature<\/td>\n              <td><span class=\"dim-box\">[K]<\/span><\/td>\n              <td><span class=\"dim-box\">[\u0398]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Amount of Substance<\/td>\n              <td><span class=\"dim-box\">[mol]<\/span><\/td>\n              <td><span class=\"dim-box\">[N]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Luminous Intensity<\/td>\n              <td><span class=\"dim-box\">[cd]<\/span><\/td>\n              <td><span class=\"dim-box\">[J]<\/span><\/td>\n            <\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 7: DIMENSIONAL FORMULAS OF DERIVED QUANTITIES & NUMERICALS  -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">7<\/span>\n        Dimensional Formulas of Important Derived Quantities\n      <\/h2>\n\n      <!-- Table 7.1: Source Quantities (Pages 22\u201325) -->\n      <h3 class=\"text-lg font-bold text-slate-950 mb-2\">7.1 Core Derived Quantities (Complete with Formulas &amp; SI Units)<\/h3>\n      <div class=\"table-responsive overflow-x-auto rounded-lg border border-slate-300 mb-5\">\n        <table class=\"notes-table\">\n          <thead class=\"bg-indigo-100\">\n            <tr>\n              <th>Physical Quantity<\/th>\n              <th>Formula / Relation<\/th>\n              <th>SI Unit<\/th>\n              <th>Dimensional Formula<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <tr>\n              <td class=\"font-semibold\">Distance / Displacement<\/td>\n              <td>Length (<span class=\"math-var\">d<\/span>)<\/td>\n              <td>m<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup>L<sup>1<\/sup>T<sup>0<\/sup>]<\/span> or <span class=\"dim-box\">[L]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Area<\/td>\n              <td><span class=\"math\">l \u00d7 b<\/span><\/td>\n              <td>m<sup>2<\/sup><\/td>\n              <td><span class=\"dim-box\">[L<sup>2<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Volume<\/td>\n              <td><span class=\"math\">l \u00d7 b \u00d7 h<\/span><\/td>\n              <td>m<sup>3<\/sup><\/td>\n              <td><span class=\"dim-box\">[L<sup>3<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Speed / Velocity<\/td>\n              <td><span class=\"math\">d / t<\/span><\/td>\n              <td>m/s<\/td>\n              <td><span class=\"dim-box\">[L T<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Acceleration<\/td>\n              <td><span class=\"math\">\u0394v / t<\/span><\/td>\n              <td>m/s<sup>2<\/sup><\/td>\n              <td><span class=\"dim-box\">[L T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Density (<span class=\"math-var\">\u03c1<\/span>)<\/td>\n              <td><span class=\"math\">m / V<\/span><\/td>\n              <td>kg/m<sup>3<\/sup><\/td>\n              <td><span class=\"dim-box\">[M L<sup>\u22123<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Linear Momentum (<span class=\"math-var\">p<\/span>)<\/td>\n              <td><span class=\"math\">m \u00d7 v<\/span><\/td>\n              <td>kg\u00b7m/s<\/td>\n              <td><span class=\"dim-box\">[M L T<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Force (<span class=\"math-var\">F<\/span>)<\/td>\n              <td><span class=\"math\">m \u00d7 a<\/span><\/td>\n              <td>newton (N)<\/td>\n              <td><span class=\"dim-box\">[M L T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Impulse (<span class=\"math-var\">J<\/span>)<\/td>\n              <td><span class=\"math\">F \u00d7 \u0394t<\/span><\/td>\n              <td>N\u00b7s (or kg\u00b7m/s)<\/td>\n              <td><span class=\"dim-box\">[M L T<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Work (<span class=\"math-var\">W<\/span>)<\/td>\n              <td><span class=\"math\">F \u00d7 d \u00d7 cos\u03b8<\/span><\/td>\n              <td>joule (J) or N\u00b7m<\/td>\n              <td><span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Kinetic Energy (<span class=\"math\">KE<\/span>)<\/td>\n              <td><span class=\"math\">(1/2) m v<sup>2<\/sup><\/span><\/td>\n              <td>joule (J)<\/td>\n              <td><span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Torque (<span class=\"math-var\">\u03c4<\/span>)<\/td>\n              <td>Force \u00d7 Perpendicular Distance (<span class=\"math\">F \u00d7 r<\/span>)<\/td>\n              <td>N\u00b7m<\/td>\n              <td><span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Power (<span class=\"math-var\">P<\/span>)<\/td>\n              <td>Work (Energy) / Time (<span class=\"math\">W / t<\/span>)<\/td>\n              <td>watt (W) or J/s<\/td>\n              <td><span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22123<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Pressure (<span class=\"math-var\">P<\/span>)<\/td>\n              <td>Force / Area (<span class=\"math\">F / A<\/span>)<\/td>\n              <td>pascal (Pa) or N/m<sup>2<\/sup><\/td>\n              <td><span class=\"dim-box\">[M L<sup>\u22121<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Stress<\/td>\n              <td>Restoring Force / Area (<span class=\"math\">F / A<\/span>)<\/td>\n              <td>N/m<sup>2<\/sup> or Pa<\/td>\n              <td><span class=\"dim-box\">[M L<sup>\u22121<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Strain<\/td>\n              <td>Change in Length / Original Length (<span class=\"math\">\u0394L / L<\/span>)<\/td>\n              <td>Unitless<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Coefficient of Elasticity<\/td>\n              <td>Stress / Strain<\/td>\n              <td>N/m<sup>2<\/sup> or Pa<\/td>\n              <td><span class=\"dim-box\">[M L<sup>\u22121<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Universal Gravitational Constant (<span class=\"math-var\">G<\/span>)<\/td>\n              <td><span class=\"math\">F = Gm<sub>1<\/sub>m<sub>2<\/sub>/r<sup>2<\/sup> \u21d2 G = Fr<sup>2<\/sup>/(m<sub>1<\/sub>m<sub>2<\/sub>)<\/span><\/td>\n              <td>N\u00b7m<sup>2<\/sup>/kg<sup>2<\/sup><\/td>\n              <td><span class=\"dim-box\">[M<sup>\u22121<\/sup> L<sup>3<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Surface Tension (<span class=\"math-var\">T<\/span>)<\/td>\n              <td>Force / Length (<span class=\"math\">F / l<\/span>)<\/td>\n              <td>N/m<\/td>\n              <td><span class=\"dim-box\">[M L<sup>0<\/sup> T<sup>\u22122<\/sup>]<\/span> or <span class=\"dim-box\">[M T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n\n      <!-- Table 7.2: RRB NTPC & Govt Exams High-Yield Additional Derived Quantities -->\n      <h3 class=\"text-lg font-bold text-slate-950 mb-2\">7.2 High-Yield Exam Compendium (Frequently Asked in RRB NTPC / SSC / Railway Exams)<\/h3>\n      <div class=\"table-responsive overflow-x-auto rounded-lg border border-slate-300 mb-4\">\n        <table class=\"notes-table\">\n          <thead class=\"bg-teal-100\">\n            <tr>\n              <th>Physical Quantity<\/th>\n              <th>Formula<\/th>\n              <th>SI Unit<\/th>\n              <th>Dimensional Formula<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <tr>\n              <td class=\"font-semibold\">Frequency (<span class=\"math-var\">\u03bd<\/span> or <span class=\"math-var\">f<\/span>)<\/td>\n              <td><span class=\"math\">1 / Time Period (1/T)<\/span><\/td>\n              <td>hertz (Hz) or s<sup>\u22121<\/sup><\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Angular Velocity (<span class=\"math-var\">\u03c9<\/span>)<\/td>\n              <td><span class=\"math\">\u03b8 / t<\/span><\/td>\n              <td>rad/s<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Angular Momentum (<span class=\"math-var\">L<\/span>)<\/td>\n              <td><span class=\"math\">m \u00d7 v \u00d7 r<\/span><\/td>\n              <td>kg\u00b7m<sup>2<\/sup>/s (or J\u00b7s)<\/td>\n              <td><span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Moment of Inertia (<span class=\"math-var\">I<\/span>)<\/td>\n              <td><span class=\"math\">m \u00d7 r<sup>2<\/sup><\/span><\/td>\n              <td>kg\u00b7m<sup>2<\/sup><\/td>\n              <td><span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>0<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Spring / Force Constant (<span class=\"math-var\">k<\/span>)<\/td>\n              <td><span class=\"math\">F / x<\/span><\/td>\n              <td>N/m<\/td>\n              <td><span class=\"dim-box\">[M L<sup>0<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Coefficient of Viscosity (<span class=\"math-var\">\u03b7<\/span>)<\/td>\n              <td><span class=\"math\">F / (A \u00b7 dv/dx)<\/span><\/td>\n              <td>Pa\u00b7s (poiseuille)<\/td>\n              <td><span class=\"dim-box\">[M L<sup>\u22121<\/sup> T<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Electric Charge (<span class=\"math-var\">Q<\/span>)<\/td>\n              <td><span class=\"math\">I \u00d7 t<\/span><\/td>\n              <td>coulomb (C)<\/td>\n              <td><span class=\"dim-box\">[A T]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Electric Potential / Voltage (<span class=\"math-var\">V<\/span>)<\/td>\n              <td><span class=\"math\">W / Q<\/span><\/td>\n              <td>volt (V)<\/td>\n              <td><span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22123<\/sup> A<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Electrical Resistance (<span class=\"math-var\">R<\/span>)<\/td>\n              <td><span class=\"math\">V / I<\/span><\/td>\n              <td>ohm (\u03a9)<\/td>\n              <td><span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22123<\/sup> A<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Latent Heat (<span class=\"math-var\">L<\/span>)<\/td>\n              <td><span class=\"math\">Heat Energy / Mass (Q/m)<\/span><\/td>\n              <td>J/kg<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Specific Heat Capacity (<span class=\"math-var\">c<\/span>)<\/td>\n              <td><span class=\"math\">Q / (m \u00b7 \u0394T)<\/span><\/td>\n              <td>J/(kg\u00b7K)<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>2<\/sup> T<sup>\u22122<\/sup> K<sup>\u22121<\/sup>]<\/span><\/td>\n            <\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n\n      <!-- Exam Golden Box: Same Dimensional Formula Groups -->\n      <div class=\"callout-box avoid-break bg-amber-50 border border-amber-400 rounded-xl p-4 mb-5\">\n        <h4 class=\"font-bold text-amber-900 mb-2\">RRB NTPC Super-Hit Table: Physical Quantities with Identical Dimensions<\/h4>\n        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-900\">\n          <div class=\"bg-white border border-amber-200 rounded-md p-2\">\n            <strong>[M L T<sup>\u22121<\/sup>]:<\/strong> Linear Momentum &amp; Impulse\n          <\/div>\n          <div class=\"bg-white border border-amber-200 rounded-md p-2\">\n            <strong>[M L<sup>2<\/sup> T<sup>\u22122<\/sup>]:<\/strong> Work, Energy (all forms), Heat &amp; Torque\n          <\/div>\n          <div class=\"bg-white border border-amber-200 rounded-md p-2\">\n            <strong>[M L<sup>\u22121<\/sup> T<sup>\u22122<\/sup>]:<\/strong> Pressure, Stress, Energy Density &amp; Modulus of Elasticity\n          <\/div>\n          <div class=\"bg-white border border-amber-200 rounded-md p-2\">\n            <strong>[M L<sup>2<\/sup> T<sup>\u22121<\/sup>]:<\/strong> Planck's Constant (<span class=\"math-var\">h<\/span>) &amp; Angular Momentum (<span class=\"math-var\">L<\/span>)\n          <\/div>\n          <div class=\"bg-white border border-amber-200 rounded-md p-2\">\n            <strong>[M T<sup>\u22122<\/sup>]:<\/strong> Surface Tension, Surface Energy &amp; Spring Constant\n          <\/div>\n          <div class=\"bg-white border border-amber-200 rounded-md p-2\">\n            <strong>[T<sup>\u22121<\/sup>]:<\/strong> Frequency, Angular Velocity &amp; Velocity Gradient\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- 7.3 Solved Dimensional Analysis Numericals (Pages 26\u201329) -->\n      <h3 class=\"text-lg font-bold text-slate-950 mb-2.5\">7.3 Solved Questions on Dimensions<\/h3>\n      <div class=\"space-y-3\">\n        <!-- Q6 -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q6. Using dimensional analysis, determine the dimensions of: (a) Planck's constant (<span class=\"math-var\">h<\/span>) from <span class=\"math\">E = h\u03bd<\/span>, and (b) Universal gas constant (<span class=\"math-var\">R<\/span>) from <span class=\"math\">PV = nRT<\/span>.\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-2\">\n            <div>\n              <strong>(a) Planck's Constant (<span class=\"math-var\">h<\/span>):<\/strong>\n              From <span class=\"math\">E = h\u03bd \u21d2 h = E / \u03bd<\/span>.\n              Here <span class=\"math\">[E] = [M L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span> and Frequency <span class=\"math\">[\u03bd] = [T<sup>\u22121<\/sup>]<\/span>.\n              <br />\n              <span class=\"math\">[h] =<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">[M L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span><span class=\"frac-den\">[T<sup>\u22121<\/sup>]<\/span><\/span>\n              <span class=\"math\">= <span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22121<\/sup>]<\/span><\/span> &nbsp; (SI Unit: J\u00b7s).\n            <\/div>\n            <div class=\"border-t border-slate-200 pt-2\">\n              <strong>(b) Universal Gas Constant (<span class=\"math-var\">R<\/span>):<\/strong>\n              From <span class=\"math\">PV = nRT \u21d2 R = PV / (nT)<\/span>.\n              Here <span class=\"math\">[P] = [M L<sup>\u22121<\/sup> T<sup>\u22122<\/sup>]<\/span>, <span class=\"math\">[V] = [L<sup>3<\/sup>]<\/span>, <span class=\"math\">[n] = [mol]<\/span>, <span class=\"math\">[T] = [K]<\/span>.\n              <br />\n              <span class=\"math\">[R] =<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">[M L<sup>\u22121<\/sup> T<sup>\u22122<\/sup>] \u00b7 [L<sup>3<\/sup>]<\/span><span class=\"frac-den\">[mol] \u00b7 [K]<\/span><\/span>\n              <span class=\"math\">= <span class=\"dim-box\">[M L<sup>2<\/sup> T<sup>\u22122<\/sup> K<sup>\u22121<\/sup> mol<sup>\u22121<\/sup>]<\/span><\/span> &nbsp; (SI Unit: J\u00b7mol<sup>\u22121<\/sup>\u00b7K<sup>\u22121<\/sup>).\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Q7 -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q7. Evaluate the dimensional formula, the dimensional equation, and the dimensions of the refractive index.\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-1\">\n            <div>\n              <strong>Formula:<\/strong> Refractive Index <span class=\"math-var\">n<\/span> =\n              <span class=\"frac\"><span class=\"frac-num\">Speed of light in vacuum (<span class=\"math-var\">c<\/span>)<\/span><span class=\"frac-den\">Speed of light in medium (<span class=\"math-var\">v<\/span>)<\/span><\/span>\n              = <span class=\"frac\"><span class=\"frac-num\">[L T<sup>\u22121<\/sup>]<\/span><span class=\"frac-den\">[L T<sup>\u22121<\/sup>]<\/span><\/span> = <span class=\"math\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span>.\n            <\/div>\n            <ul class=\"list-disc pl-5 pt-1\">\n              <li><strong>Dimensional Formula:<\/strong> <span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span><\/li>\n              <li><strong>Dimensional Equation:<\/strong> <span class=\"math\">[n] = [M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span><\/li>\n              <li><strong>Dimensions:<\/strong> 0 in Mass, 0 in Length, and 0 in Time (Dimensionless).<\/li>\n            <\/ul>\n          <\/div>\n        <\/div>\n\n        <!-- Q8 & Q9 Grid -->\n        <div class=\"grid grid-cols-1 md:grid-cols-2 gap-3\">\n          <!-- Q8 -->\n          <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n            <div class=\"font-bold text-emerald-900 mb-1.5\">\n              Q8. Which of the following quantities is dimensionless?\n            <\/div>\n            <div class=\"grid grid-cols-2 gap-1 text-sm text-slate-900 mb-2\">\n              <div>(a) Pressure<\/div>\n              <div>(b) Strain<\/div>\n              <div>(c) Work<\/div>\n              <div>(d) Force<\/div>\n            <\/div>\n            <div class=\"solution-box bg-white border border-emerald-200 rounded-lg px-3 py-2 text-sm\">\n              <strong class=\"text-emerald-900\">Answer: (b) Strain.<\/strong> Strain = <span class=\"math\">\u0394L / L = [L]/[L] = [M<sup>0<\/sup>L<sup>0<\/sup>T<sup>0<\/sup>]<\/span>.\n            <\/div>\n          <\/div>\n\n          <!-- Q9 -->\n          <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n            <div class=\"font-bold text-emerald-900 mb-1.5\">\n              Q9. A force <span class=\"math-var\">F<\/span> is given by <span class=\"math\">F = mv<sup>2<\/sup> / r<\/span>. Find the dimensions of <span class=\"math-var\">F<\/span> using this relation.\n            <\/div>\n            <div class=\"solution-box bg-white border border-emerald-200 rounded-lg px-3 py-2 text-sm\">\n              <span class=\"math\">[F] =<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">[M] \u00b7 [L T<sup>\u22121<\/sup>]<sup>2<\/sup><\/span><span class=\"frac-den\">[L]<\/span><\/span>\n              <span class=\"math\">=<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">[M L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span><span class=\"frac-den\">[L]<\/span><\/span>\n              <span class=\"math\">= <span class=\"dim-box\">[M L T<sup>\u22122<\/sup>]<\/span><\/span>.\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 8: DIMENSIONLESS QUANTITIES                                 -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">8<\/span>\n        Dimensionless Quantities\n      <\/h2>\n\n      <p class=\"text-slate-900 mb-3\">\n        <strong>Dimensionless quantities<\/strong> are physical quantities that have zero dimensions in all fundamental quantities, i.e., their dimensional formula is <span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span>. They are usually ratios of two identical physical quantities whose units cancel out.\n      <\/p>\n\n      <!-- Table: Dimensionless Variables (Page 31) -->\n      <h3 class=\"text-lg font-bold text-slate-950 mb-2\">8.1 Dimensionless Variables (Physical Quantities)<\/h3>\n      <div class=\"table-responsive overflow-x-auto rounded-lg border border-slate-300 mb-4\">\n        <table class=\"notes-table\">\n          <thead class=\"bg-purple-100\">\n            <tr>\n              <th>Dimensionless Quantity<\/th>\n              <th>Formula (Ratio of Similar Quantities)<\/th>\n              <th>Dimensional Formula<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <tr>\n              <td class=\"font-semibold\">Strain<\/td>\n              <td>Change in length / Original length (<span class=\"math\">\u0394L / L<\/span>)<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Refractive Index (<span class=\"math-var\">n<\/span>)<\/td>\n              <td>Speed of light in vacuum / Speed of light in medium (<span class=\"math\">c / v<\/span>)<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Poisson's Ratio (<span class=\"math-var\">\u03c3<\/span>)<\/td>\n              <td>Lateral strain / Longitudinal strain<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Relative Density (Specific Gravity)<\/td>\n              <td>Density of substance / Density of water (at 4\u00b0C)<\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"font-semibold\">Plane Angle &amp; Solid Angle*<\/td>\n              <td><span class=\"math\">\u03b8 = s / r<\/span> &nbsp;|&nbsp; <span class=\"math\">\u03a9 = A / r<sup>2<\/sup><\/span><\/td>\n              <td><span class=\"dim-box\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>0<\/sup>]<\/span> (Have SI units: rad, sr)<\/td>\n            <\/tr>\n          <\/tbody>\n        <\/tabl
