e>\n      <\/div>\n\n      <!-- Dimensionless Constants + Fact-Check Clarification -->\n      <div class=\"avoid-break bg-slate-50 border border-slate-300 rounded-xl p-4\">\n        <h3 class=\"text-lg font-bold text-slate-950 mb-2\">8.2 Dimensionless Constants<\/h3>\n        <ul class=\"list-disc pl-5 space-y-1.5 text-slate-900\">\n          <li><strong><span class=\"math\">\u03c0<\/span> (Pi \u2248 3.14159):<\/strong> Mathematical ratio of circumference to diameter of a circle.<\/li>\n          <li><strong><span class=\"math\">e<\/span> (Euler's Number \u2248 2.71828):<\/strong> Base of the natural logarithm.<\/li>\n          <li><strong>Pure Numbers &amp; Trigonometric Ratios:<\/strong> <span class=\"math\">1/2, 2, sin\u03b8, cos\u03b8, log x<\/span>.<\/li>\n          <li>\n            <strong>Avogadro's Number vs. Avogadro's Constant (<em>Important Fact-Check<\/em>):<\/strong>\n            <strong>Avogadro's Number<\/strong> (<span class=\"math\">6.022 \u00d7 10<sup>23<\/sup><\/span>) as a pure count of particles is dimensionless, whereas <strong>Avogadro's Constant (<span class=\"math\">N<sub>A<\/sub><\/span>)<\/strong> is expressed per mole (<span class=\"math\">6.022 \u00d7 10<sup>23<\/sup> mol<sup>\u22121<\/sup><\/span>) and has dimension <span class=\"dim-box\">[mol<sup>\u22121<\/sup>]<\/span>.\n          <\/li>\n        <\/ul>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 9: PRINCIPLE OF HOMOGENEITY & NUMERICALS                    -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">9<\/span>\n        Principle of Homogeneity of Dimensions\n      <\/h2>\n\n      <article class=\"concept-card avoid-break bg-blue-50/70 border border-blue-300 rounded-xl p-4 mb-4\">\n        <p class=\"text-slate-900 mb-2\">\n          <strong>Statement:<\/strong> <em>\"A physical equation is dimensionally correct only if the dimensions of every individual term on both sides of the equation are identical.\"<\/em> Only physical quantities having the same dimensions can be added, subtracted, or equated.\n        <\/p>\n        <div class=\"bg-white border-l-4 border-blue-700 rounded-md px-4 py-2.5 text-slate-950 space-y-1\">\n          <div>If <span class=\"math\">A + B = C<\/span>, then: &nbsp; <span class=\"math\">[A] = [B] = [C]<\/span><\/div>\n          <div><strong>Example:<\/strong> In <span class=\"math\">v = u + at<\/span>, we have <span class=\"math\">[v] = [L T<sup>\u22121<\/sup>]<\/span>, <span class=\"math\">[u] = [L T<sup>\u22121<\/sup>]<\/span>, and <span class=\"math\">[at] = [L T<sup>\u22122<\/sup>][T] = [L T<sup>\u22121<\/sup>]<\/span>. Hence dimensionally consistent.<\/div>\n        <\/div>\n      <\/article>\n\n      <!-- Solved Numericals (Pages 33\u201336) -->\n      <h3 class=\"text-lg font-bold text-slate-950 mb-2.5\">9.1 Solved Numericals on Principle of Homogeneity<\/h3>\n      <div class=\"space-y-3\">\n        <!-- Q10 -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q10. Using dimensional analysis, check the dimensional correctness of the following equations:\n            (1) <span class=\"math\">s = ut + (1/2)at<sup>2<\/sup><\/span>, &nbsp;\n            (2) <span class=\"math\">v = u + at<sup>2<\/sup><\/span>, &nbsp;\n            (3) <span class=\"math\">v<sup>2<\/sup> = u<sup>2<\/sup> + 2as<\/span>.\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-2\">\n            <div>\n              <strong>(1) <span class=\"math\">s = ut + (1/2)at<sup>2<\/sup><\/span>:<\/strong>\n              <span class=\"math\">[s] = [L]<\/span>; &nbsp;\n              <span class=\"math\">[ut] = [LT<sup>\u22121<\/sup>][T] = [L]<\/span>; &nbsp;\n              <span class=\"math\">[(1/2)at<sup>2<\/sup>] = [LT<sup>\u22122<\/sup>][T<sup>2<\/sup>] = [L]<\/span> (1/2 is dimensionless).\n              <br />\n              Since <span class=\"math\">[L] = [L] + [L]<\/span> \u21d2 <strong class=\"text-emerald-900\">Dimensionally Correct.<\/strong>\n            <\/div>\n            <div class=\"border-t border-slate-200 pt-2\">\n              <strong>(2) <span class=\"math\">v = u + at<sup>2<\/sup><\/span>:<\/strong>\n              <span class=\"math\">[v] = [LT<sup>\u22121<\/sup>]<\/span>; &nbsp;\n              <span class=\"math\">[u] = [LT<sup>\u22121<\/sup>]<\/span>; &nbsp;\n              <span class=\"math\">[at<sup>2<\/sup>] = [LT<sup>\u22122<\/sup>][T<sup>2<\/sup>] = [L]<\/span>.\n              <br />\n              Since <span class=\"math\">[LT<sup>\u22121<\/sup>] \u2260 [L]<\/span> \u21d2 <strong class=\"text-rose-900\">Dimensionally Incorrect.<\/strong>\n            <\/div>\n            <div class=\"border-t border-slate-200 pt-2\">\n              <strong>(3) <span class=\"math\">v<sup>2<\/sup> = u<sup>2<\/sup> + 2as<\/span>:<\/strong>\n              <span class=\"math\">[v<sup>2<\/sup>] = [L<sup>2<\/sup>T<sup>\u22122<\/sup>]<\/span>; &nbsp;\n              <span class=\"math\">[u<sup>2<\/sup>] = [L<sup>2<\/sup>T<sup>\u22122<\/sup>]<\/span>; &nbsp;\n              <span class=\"math\">[2as] = [LT<sup>\u22122<\/sup>][L] = [L<sup>2<\/sup>T<sup>\u22122<\/sup>]<\/span>.\n              <br />\n              Since all terms equal <span class=\"math\">[L<sup>2<\/sup>T<sup>\u22122<\/sup>]<\/span> \u21d2 <strong class=\"text-emerald-900\">Dimensionally Correct.<\/strong>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Q11 -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q11. Consider the equation <span class=\"math\">(1/2)mv<sup>2<\/sup> = mgh<\/span>, where <span class=\"math-var\">m<\/span> = mass, <span class=\"math-var\">v<\/span> = velocity, <span class=\"math-var\">g<\/span> = acceleration due to gravity, and <span class=\"math-var\">h<\/span> = height. Check whether it is dimensionally correct.\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-1\">\n            <div><strong>LHS:<\/strong> <span class=\"math\">[(1/2)mv<sup>2<\/sup>] = [M][L T<sup>\u22121<\/sup>]<sup>2<\/sup> = [M L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span><\/div>\n            <div><strong>RHS:<\/strong> <span class=\"math\">[mgh] = [M][L T<sup>\u22122<\/sup>][L] = [M L<sup>2<\/sup> T<sup>\u22122<\/sup>]<\/span><\/div>\n            <div>Since <strong>LHS = RHS<\/strong>, the equation is <strong class=\"text-emerald-900\">Dimensionally Correct.<\/strong><\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Q12 & Q13 Grid -->\n        <div class=\"grid grid-cols-1 md:grid-cols-2 gap-3\">\n          <!-- Q12 -->\n          <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n            <div class=\"font-bold text-emerald-900 mb-2\">\n              Q12. If <span class=\"math\">x + y = Force<\/span>, find the dimensions of <span class=\"math-var\">x<\/span> and <span class=\"math-var\">y<\/span>.\n            <\/div>\n            <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base\">\n              By the Principle of Homogeneity, every added term must have the same dimension as the result:<br />\n              <span class=\"math\">[x] = [y] = [Force] = <span class=\"dim-box\">[M L T<sup>\u22122<\/sup>]<\/span><\/span>.\n            <\/div>\n          <\/div>\n\n          <!-- Q13 (Page 36 - Fact-Checked Option (d) typo) -->\n          <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n            <div class=\"font-bold text-emerald-900 mb-1.5\">\n              Q13. If <span class=\"math\">x = at + bt<sup>2<\/sup><\/span>, where <span class=\"math-var\">x<\/span> is distance in km and <span class=\"math-var\">t<\/span> is time in seconds, then the unit of <span class=\"math-var\">b<\/span> is:\n            <\/div>\n            <div class=\"grid grid-cols-2 gap-1 text-sm text-slate-900 mb-2\">\n              <div>(a) km/s<\/div>\n              <div>(b) km\u00b7s<\/div>\n              <div>(c) km/s<sup>2<\/sup><\/div>\n              <div>(d) km\u00b7s<sup>2<\/sup><\/div>\n            <\/div>\n            <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-2.5 text-sm\">\n              <strong class=\"text-emerald-900\">Answer: (c) km/s<sup>2<\/sup><\/strong> (also written as km\u00b7s<sup>\u22122<\/sup>).\n              Since <span class=\"math\">[bt<sup>2<\/sup>] = [x] \u21d2 b = x / t<sup>2<\/sup> = km / s<sup>2<\/sup><\/span>.\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 10: APPLICATIONS OF DIMENSIONAL ANALYSIS                    -->\n    <!-- =================================================================== -->\n    <section class=\"mb-8\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">10<\/span>\n        Applications of Dimensional Analysis (Deriving Formulas)\n      <\/h2>\n\n      <p class=\"text-slate-900 mb-3\">\n        Dimensional analysis has three major applications: <strong>(1)<\/strong> Checking dimensional consistency of equations, <strong>(2)<\/strong> Converting a physical quantity from one unit system to another, and <strong>(3)<\/strong> Deducing mathematical relationships among physical quantities.\n      <\/p>\n\n      <!-- Worked Derivation 1: Simple Pendulum (Pages 37\u201340) -->\n      <div class=\"numerical-card avoid-break bg-indigo-50/60 border border-indigo-300 rounded-xl p-4 mb-4\">\n        <div class=\"grid grid-cols-1 md:grid-cols-4 gap-4 items-center\">\n          <div class=\"md:col-span-3\">\n            <h3 class=\"text-lg font-bold text-indigo-950 mb-2\">\n              10.1 Worked Example: Derive the formula for the time period (<span class=\"math-var\">T<\/span>) of a simple pendulum.\n            <\/h3>\n            <p class=\"text-slate-900 text-sm sm:text-base mb-2\">\n              Let the time period <span class=\"math-var\">T<\/span> depend on length (<span class=\"math-var\">l<\/span>) and acceleration due to gravity (<span class=\"math-var\">g<\/span>):\n              <span class=\"math\">T \u221d l<sup>a<\/sup> g<sup>b<\/sup> \u21d2 T = k \u00b7 l<sup>a<\/sup> g<sup>b<\/sup><\/span> (where <span class=\"math-var\">k<\/span> is a dimensionless constant).\n            <\/p>\n            <div class=\"bg-white border border-indigo-200 rounded-lg p-3 text-sm sm:text-base space-y-1.5\">\n              <div><strong>Step 1 (Substitute Dimensions):<\/strong> <span class=\"math\">[T] = [T]<\/span>, <span class=\"math\">[l] = [L]<\/span>, <span class=\"math\">[g] = [L T<sup>\u22122<\/sup>]<\/span>.<\/div>\n              <div><span class=\"math\">[L<sup>0<\/sup> T<sup>1<\/sup>] = [L]<sup>a<\/sup> \u00b7 [L T<sup>\u22122<\/sup>]<sup>b<\/sup> = [L<sup>a+b<\/sup> T<sup>\u22122b<\/sup>]<\/span><\/div>\n              <div><strong>Step 2 (Compare Exponents):<\/strong>\n                For Time (T): <span class=\"math\">1 = \u22122b \u21d2 b = \u22121/2<\/span>. &nbsp;\n                For Length (L): <span class=\"math\">0 = a + b \u21d2 a = \u2212b = +1/2<\/span>.\n              <\/div>\n              <div>\n                <strong>Step 3 (Final Relation):<\/strong>\n                <span class=\"math\">T = k \u00b7 l<sup>1/2<\/sup> \u00b7 g<sup>\u22121/2<\/sup> = k<\/span>\n                <span class=\"sqrt-wrap\">\n                  <span class=\"sqrt-sign\">\u221a<\/span>\n                  <span class=\"sqrt-body\">\n                    <span class=\"frac\"><span class=\"frac-num\">l<\/span><span class=\"frac-den\">g<\/span><\/span>\n                  <\/span>\n                <\/span>.\n                From theory &amp; experiment, <span class=\"math\">k = 2\u03c0<\/span>, so:\n                <span class=\"formula-pill ml-1\">\n                  T = 2\u03c0\n                  <span class=\"sqrt-wrap\">\n                    <span class=\"sqrt-sign\">\u221a<\/span>\n                    <span class=\"sqrt-body\">\n                      <span class=\"frac\"><span class=\"frac-num\">l<\/span><span class=\"frac-den\">g<\/span><\/span>\n                    <\/span>\n                  <\/span>\n                <\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <!-- Crisp SVG Diagram of Simple Pendulum (Source Page 37) -->\n          <figure class=\"bg-white border border-indigo-200 rounded-lg p-2.5 flex flex-col items-center justify-center\">\n            <svg viewBox=\"0 0 180 155\" class=\"w-full max-w-[165px] h-auto\" role=\"img\" aria-label=\"Simple pendulum oscillating about its mean position\">\n              <!-- Support ceiling -->\n              <rect x=\"35\" y=\"10\" width=\"110\" height=\"8\" fill=\"#cbd5e1\" stroke=\"#0f172a\" stroke-width=\"1.5\" />\n              <!-- Strings -->\n              <line x1=\"90\" y1=\"18\" x2=\"90\" y2=\"112\" stroke=\"#1e3a8a\" stroke-width=\"2\" />\n              <line x1=\"90\" y1=\"18\" x2=\"42\" y2=\"100\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\" />\n              <line x1=\"90\" y1=\"18\" x2=\"138\" y2=\"100\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\" />\n              <!-- Swing arc -->\n              <path d=\"M 42 100 Q 90 124 138 100\" fill=\"none\" stroke=\"#b91c1c\" stroke-width=\"1.6\" stroke-dasharray=\"4,3\" />\n              <!-- Bobs -->\n              <circle cx=\"42\" cy=\"100\" r=\"10\" fill=\"#e2e8f0\" stroke=\"#475569\" stroke-width=\"1.5\" />\n              <circle cx=\"138\" cy=\"100\" r=\"10\" fill=\"#e2e8f0\" stroke=\"#475569\" stroke-width=\"1.5\" />\n              <circle cx=\"90\" cy=\"112\" r=\"11\" fill=\"#3b82f6\" stroke=\"#0f172a\" stroke-width=\"1.8\" />\n              <!-- Labels -->\n              <text x=\"95\" y=\"65\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"14\" font-style=\"italic\" font-weight=\"700\" fill=\"#0f172a\">l<\/text>\n              <text x=\"84\" y=\"116\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#ffffff\">m<\/text>\n              <text x=\"58\" y=\"143\" font-family=\"Calibri, Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#1e3a8a\">Simple Pendulum<\/text>\n            <\/svg>\n          <\/figure>\n        <\/div>\n        <p class=\"text-xs text-slate-800 mt-2\">\n          <strong>RRB NTPC Exam Point:<\/strong> Time period (<span class=\"math-var\">T<\/span>) of a simple pendulum is <strong>independent of the mass (<span class=\"math-var\">m<\/span>)<\/strong> of the bob!\n        <\/p>\n      <\/div>\n\n      <!-- Practice Derivations (Pages 41 & 42) -->\n      <div class=\"space-y-3\">\n        <!-- Q14 -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q14. Using dimensional analysis, derive the formula that relates centripetal force (<span class=\"math-var\">F<\/span>) with mass (<span class=\"math-var\">m<\/span>), velocity (<span class=\"math-var\">v<\/span>), and radius (<span class=\"math-var\">r<\/span>).\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-1.5\">\n            <div><strong>Step 1:<\/strong> Assume <span class=\"math\">F = k \u00b7 m<sup>a<\/sup> v<sup>b<\/sup> r<sup>c<\/sup><\/span>. Substitute dimensions:<\/div>\n            <div><span class=\"math\">[M<sup>1<\/sup> L<sup>1<\/sup> T<sup>\u22122<\/sup>] = [M]<sup>a<\/sup> [L T<sup>\u22121<\/sup>]<sup>b<\/sup> [L]<sup>c<\/sup> = [M<sup>a<\/sup> L<sup>b+c<\/sup> T<sup>\u2212b<\/sup>]<\/span><\/div>\n            <div><strong>Step 2 (Compare Exponents):<\/strong>\n              <span class=\"math\">a = 1<\/span>; &nbsp;\n              <span class=\"math\">\u2212b = \u22122 \u21d2 b = 2<\/span>; &nbsp;\n              <span class=\"math\">b + c = 1 \u21d2 2 + c = 1 \u21d2 c = \u22121<\/span>.\n            <\/div>\n            <div>\n              <strong>Step 3 (Final Formula):<\/strong>\n              <span class=\"math\">F = k \u00b7 m<sup>1<\/sup> v<sup>2<\/sup> r<sup>\u22121<\/sup> = k<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">mv<sup>2<\/sup><\/span><span class=\"frac-den\">r<\/span><\/span>.\n              Experimentally <span class=\"math\">k = 1<\/span>, hence\n              <span class=\"formula-pill ml-1\">\n                F = <span class=\"frac\"><span class=\"frac-num\">mv<sup>2<\/sup><\/span><span class=\"frac-den\">r<\/span><\/span>\n              <\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Q15 (Page 42 - Fixed missing symbol \u03bc) -->\n        <div class=\"numerical-card avoid-break bg-emerald-50/70 border border-emerald-400 rounded-xl p-4\">\n          <div class=\"font-bold text-emerald-900 mb-2\">\n            Q15. Using dimensional analysis, derive the formula that relates the frequency (<span class=\"math-var\">f<\/span>) of a vibrating string with tension (<span class=\"math-var\">T<\/span>), linear mass density (<span class=\"math-var\">\u03bc<\/span>), and length (<span class=\"math-var\">L<\/span>) of the string.\n          <\/div>\n          <div class=\"solution-box bg-white border border-emerald-200 rounded-lg p-3 text-sm sm:text-base space-y-1.5\">\n            <div>\n              <strong>Dimensions:<\/strong>\n              Frequency <span class=\"math\">[f] = [T<sup>\u22121<\/sup>]<\/span>; &nbsp;\n              Tension (Force) <span class=\"math\">[T<sub>force<\/sub>] = [M L T<sup>\u22122<\/sup>]<\/span>; &nbsp;\n              Linear mass density <span class=\"math\">[\u03bc] = [Mass/Length] = [M L<sup>\u22121<\/sup>]<\/span>; &nbsp;\n              Length <span class=\"math\">[L] = [L]<\/span>.\n            <\/div>\n            <div>\n              <strong>Step 1:<\/strong> Let <span class=\"math\">f = k \u00b7 T<sup>a<\/sup> \u03bc<sup>b<\/sup> L<sup>c<\/sup><\/span> \u21d2\n              <span class=\"math\">[M<sup>0<\/sup> L<sup>0<\/sup> T<sup>\u22121<\/sup>] = [M L T<sup>\u22122<\/sup>]<sup>a<\/sup> [M L<sup>\u22121<\/sup>]<sup>b<\/sup> [L]<sup>c<\/sup> = [M<sup>a+b<\/sup> L<sup>a\u2212b+c<\/sup> T<sup>\u22122a<\/sup>]<\/span>\n            <\/div>\n            <div>\n              <strong>Step 2 (Compare Exponents):<\/strong>\n              <span class=\"math\">\u22122a = \u22121 \u21d2 a = 1/2<\/span>; &nbsp;\n              <span class=\"math\">a + b = 0 \u21d2 b = \u22121/2<\/span>; &nbsp;\n              <span class=\"math\">a \u2212 b + c = 0 \u21d2 (1/2) \u2212 (\u22121/2) + c = 0 \u21d2 c = \u22121<\/span>.\n            <\/div>\n            <div>\n              <strong>Step 3 (Final Formula):<\/strong>\n              <span class=\"math\">f = k \u00b7 T<sup>1/2<\/sup> \u03bc<sup>\u22121/2<\/sup> L<sup>\u22121<\/sup> =<\/span>\n              <span class=\"frac\"><span class=\"frac-num\">k<\/span><span class=\"frac-den\">L<\/span><\/span>\n              <span class=\"sqrt-wrap\">\n                <span class=\"sqrt-sign\">\u221a<\/span>\n                <span class=\"sqrt-body\">\n                  <span class=\"frac\"><span class=\"frac-num\">T<\/span><span class=\"frac-den\">\u03bc<\/span><\/span>\n                <\/span>\n              <\/span>.\n              (For fundamental mode, <span class=\"math\">k = 1/2<\/span>, so\n              <span class=\"formula-pill ml-1\">\n                f = <span class=\"frac\"><span class=\"frac-num\">1<\/span><span class=\"frac-den\">2L<\/span><\/span>\n                <span class=\"sqrt-wrap\">\n                  <span class=\"sqrt-sign\">\u221a<\/span>\n                  <span class=\"sqrt-body\">\n                    <span class=\"frac\"><span class=\"frac-num\">T<\/span><span class=\"frac-den\">\u03bc<\/span><\/span>\n                  <\/span>\n                <\/span>\n              <\/span>).\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- SECTION 11: LIMITATIONS & DIMENSIONAL VS PHYSICAL CORRECTNESS       -->\n    <!-- =================================================================== -->\n    <section class=\"mb-6\">\n      <h2 class=\"section-title text-2xl font-bold text-indigo-900 flex items-center gap-2\">\n        <span class=\"inline-flex items-center justify-center w-7 h-7 rounded-md bg-indigo-900 text-white text-sm font-bold\">11<\/span>\n        Limitations &amp; Dimensional vs. Physical Correctness\n      <\/h2>\n\n      <!-- 11.1 Limitations (Page 43) -->\n      <div class=\"avoid-break bg-rose-50/70 border border-rose-300 rounded-xl p-4 mb-4\">\n        <h3 class=\"text-lg font-bold text-rose-900 mb-2\">11.1 Limitations of Dimensional Analysis<\/h3>\n        <ol class=\"list-decimal pl-5 space-y-1.5 text-slate-900\">\n          <li><strong>Cannot determine dimensionless constants:<\/strong> It gives no information about pure numerical constants like <span class=\"math\">\u03c0, e, 1/2, 2\u03c0<\/span>, etc.<\/li>\n          <li><strong>Cannot be applied to non-algebraic functions:<\/strong> It fails for trigonometric (<span class=\"math\">sin\u03b8, cos\u03b8<\/span>), logarithmic (<span class=\"math\">log x<\/span>), and exponential (<span class=\"math\">e<sup>x<\/sup><\/span>) functions because their arguments and values are dimensionless.<\/li>\n          <li><strong>Ignores scalar/vector nature:<\/strong> It does not distinguish whether a physical quantity is a scalar or a vector (e.g., Work and Torque have identical dimensions).<\/li>\n          <li><strong>Fails when dependent on more than 3 variables:<\/strong> In mechanics (only 3 base dimensions M, L, T), it cannot uniquely determine exponents if a quantity depends on more than three independent variables.<\/li>\n          <li><strong>Cannot derive equations with addition or subtraction:<\/strong> It only derives product/power-law relations, not multi-term formulas like <span class=\"math\">s = ut + (1/2)at<sup>2<\/sup><\/span>.<\/li>\n        <\/ol>\n      <\/div>\n\n      <!-- 11.2 Dimensional Correctness vs Physical Correctness (Page 44) -->\n      <div class=\"avoid-break bg-amber-50/80 border border-amber-400 rounded-xl p-4\">\n        <h3 class=\"text-lg font-bold text-amber-900 mb-2\">11.2 Dimensional Correctness vs. Physical Correctness<\/h3>\n        <div class=\"bg-white border border-amber-300 rounded-lg px-4 py-2 text-center mb-3\">\n          <span class=\"text-base sm:text-lg font-bold text-rose-900\">Dimensional Correctness &nbsp;\u2260&nbsp; Physical Correctness<\/span>\n        <\/div>\n        <p class=\"text-slate-900 mb-2\">\n          An equation can be <strong>dimensionally correct<\/strong> yet still be <strong>physically wrong<\/strong> because dimensional analysis cannot verify numerical constants.\n        <\/p>\n        <ul class=\"list-disc pl-5 space-y-1 text-slate-900 text-sm sm:text-base\">\n          <li><strong>Example:<\/strong> <span class=\"math\">s = ut + (1/3)at<sup>2<\/sup><\/span> is <strong>dimensionally correct<\/strong> (<span class=\"math\">[L] = [L] + [L]<\/span>), but <strong>physically incorrect<\/strong> (the true constant is <span class=\"math\">1/2<\/span>, not <span class=\"math\">1/3<\/span>).<\/li>\n          <li><strong>Golden Rule 1:<\/strong> Every physically correct equation <strong>must<\/strong> be dimensionally correct.<\/li>\n          <li><strong>Golden Rule 2:<\/strong> A dimensionally correct equation <strong>may or may not<\/strong> be physically correct.<\/li>\n          <li><strong>Golden Rule 3:<\/strong> A dimensionally incorrect equation is <strong>always<\/strong> physically incorrect.<\/li>\n        <\/ul>\n      <\/div>\n    <\/section>\n\n    <!-- =================================================================== -->\n    <!-- BOOK FOOTER                                                         -->\n    <!-- =================================================================== -->\n    <footer class=\"border-t-2 border-slate-300 pt-3 mt-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs text-slate-700\">\n      <div>\n        <strong>Chapter Notes:<\/strong> Units &amp; Measurements (Initial to Dimensional Analysis) \u2014 Verified for RRB NTPC &amp; Govt Exams\n      <\/div>\n      <div>\n        Formatted in Calibri \u2022 Print-Ready A4 Layout\n      <\/div>\n    <\/footer>\n\n  <\/main>\n\n  <!-- ===================================================================== -->\n  <!-- EMBEDDED JAVASCRIPT (PRINT HANDLER & SELF-TEST SOLUTION TOGGLE)       -->\n  <!-- ===================================================================== -->\n  <script>\n    (function () {\n      'use strict';\n\n      try {\n        const printBtn = document.getElementById('printBtn');\n        const toggleSolutionsBtn = document.getElementById('toggleSolutionsBtn');\n        const statusNotice = document.getElementById('statusNotice');\n        const solutionBoxes = document.querySelectorAll('.solution-box');\n\n        let solutionsHidden = false;\n\n        /**\n         * Displays a subtle inline notice message (never uses alert/confirm).\n         * @param {string} msg - Message to display to the learner.\n         */\n        function showNotice(msg) {\n          if (!statusNotice) return;\n          statusNotice.textContent = msg;\n          statusNotice.classList.remove('hidden');\n          window.clearTimeout(showNotice._timer);\n          showNotice._timer = window.setTimeout(function () {\n            statusNotice.classList.add('hidden');\n          }, 3500);\n        }\n\n        /**\n         * Updates the visibility of all worked solutions for interactive self-testing.\n         * @param {boolean} hide - Whether to hide solutions on screen.\n         */\n        function setSolutionsVisibility(hide) {\n          solutionsHidden = hide;\n          solutionBoxes.forEach(function (box) {\n            if (hide) {\n              box.classList.add('is-hidden');\n            } else {\n              box.classList.remove('is-hidden');\n            }\n          });\n\n          if (toggleSolutionsBtn) {\n            toggleSolutionsBtn.setAttribute('aria-pressed', String(hide));\n            toggleSolutionsBtn.textContent = hide\n              ? 'Show All Solutions'\n              : 'Hide Solutions (Self-Test)';\n          }\n        }\n\n        // Attach solution toggle handler\n        if (toggleSolutionsBtn) {\n          toggleSolutionsBtn.addEventListener('click', function () {\n            setSolutionsVisibility(!solutionsHidden);\n            showNotice(\n              solutionsHidden\n                ? 'Self-Test Mode enabled: Solutions are hidden on screen (they will still appear when printed).'\n                : 'All worked solutions are now visible.'\n            );\n          });\n        }\n\n        // Attach print / save PDF handler\n        if (printBtn) {\n          printBtn.addEventListener('click', function () {\n            try {\n              window.print();\n            } catch (err) {\n              showNotice('Please use Ctrl+P (or Cmd+P) in your browser to print or save as PDF.');\n            }\n          });\n        }\n\n        // Ensure solutions are temporarily expanded before printing if user toggled them off\n        let wasHiddenBeforePrint = false;\n        window.addEventListener('beforeprint', function () {\n          wasHiddenBeforePrint = solutionsHidden;\n          if (solutionsHidden) {\n            setSolutionsVisibility(false);\n          }\n        });\n\n        window.addEventListener('afterprint', function () {\n          if (wasHiddenBeforePrint) {\n            setSolutionsVisibility(true);\n          }\n        });\n      } catch (error) {\n        console.error('Initialization error in Units & Measurements Notes:', error);\n      }\n    })();\n  <\/script>\n<\/body>\n<\/html>"</script>
  <script type="application/json" id="testPayload">"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>RRB NTPC Physics \u2014 Units &amp; Measurements Mock Test (24 Questions)<\/title>\n  <style>\n    :root {\n      --tcs-blue: #1e4e8c;\n      --tcs-blue-dark: #163a69;\n      --tcs-blue-light: #e8f0fe;\n      --bg-page: #f1f5f9;\n      --bg-surface: #ffffff;\n      --bg-subtle: #f8fafc;\n      --border: #cbd5e1;\n      --border-light: #e2e8f0;\n      --text-main: #0f172a;\n      --text-muted: #475569;\n      --text-light: #64748b;\n      --status-answered: #16a34a;\n      --status-not-answered: #dc2626;\n      --status-marked: #7c3aed;\n      --status-not-visited: #e2e8f0;\n      --danger: #dc2626;\n      --warning: #d97706;\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    html, body {\n      height: 100%;\n      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n      background: var(--bg-page);\n      color: var(--text-main);\n      -webkit-font-smoothing: antialiased;\n    }\n\n    button {\n      font-family: inherit;\n      cursor: pointer;\n    }\n\n    .hidden {\n      display: none !important;\n    }\n\n    /* ================= TOP HEADER ================= */\n    .exam-header {\n      background: var(--tcs-blue);\n      color: #ffffff;\n      height: 54px;\n      padding: 0 18px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 12px;\n      flex-shrink: 0;\n      border-bottom: 2px solid var(--tcs-blue-dark);\n    }\n\n    .header-brand {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      min-width: 0;\n    }\n\n    .header-badge {\n      background: rgba(255, 255, 255, 0.18);\n      border: 1px solid rgba(255, 255, 255, 0.32);\n      padding: 3px 8px;\n      borde         <div class=\"meta-value\">14m 24s<\/div>\n          <\/div>\n          <div class=\"meta-item\">\n            <div class=\"meta-label\">Marking Scheme<\/div>\n            <div class=\"meta-value\">+2 / &minus;0.5<\/div>\n          <\/div>\n          <div class=\"meta-item\">\n            <div class=\"meta-label\">Maximum Marks<\/div>\n            <div class=\"meta-value\">48 Marks<\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <section class=\"card instructions-card\">\n        <h2>General Instructions<\/h2>\n        <ol class=\"instructions-list\">\n          <li>This mock test contains <strong>24 Multiple Choice Questions<\/strong> strictly selected from RRB NTPC exams (2021&ndash;2026, Units &amp; Measurements).<\/li>\n          <li>Total time allotted is <strong>14 minutes 24 seconds<\/strong> (36 seconds per question). The test submits automatically once the countdown timer reaches <strong>00:00<\/strong>.<\/li>\n          <li><strong>Marking Scheme:<\/strong> <strong>+2 marks<\/strong> for every correct answer, <strong>&minus;0.5 marks<\/strong> for every incorrect answer, and <strong>0 marks<\/strong> for unattempted questions.<\/li>\n          <li>Options are randomized on every refresh, while questions remain in fixed order (Q1 to Q24). Selecting an option does not reveal the answer or auto-advance.<\/li>\n          <li>Use <strong>Previous<\/strong>, <strong>Clear<\/strong>, <strong>Mark for Review &amp; Next<\/strong>, and <strong>Next<\/strong> to navigate. The right-side Question Palette lets you jump directly to any question.<\/li>\n          <li>On submission, your complete score analysis is saved in browser storage and detailed solutions are displayed <strong>only for incorrect and unattempted questions<\/strong>.<\/li>\n        <\/ol>\n\n        <div class=\"legend-grid\">\n          <div class=\"legend-item\"><span class=\"p-dot st-not-visited\">1<\/span> Not Visited<\/div>\n          <div class=\"legend-item\"><span class=\"p-dot st-not-answered\">2<\/span> Not Answered<\/div>\n          <div class=\"legend-item\"><span class=\"p-dot st-answered\">3<\/span> Answered<\/div>\n          <div class=\"legend-item\"><span class=\"p-dot st-marked\">4<\/span> Marked for Review<\/div>\n          <div class=\"legend-item\"><span class=\"p-dot st-answered-marked\">5<\/span> Answered &amp; Marked<\/div>\n        <\/div>\n\n        <div class=\"start-row\">\n          <span class=\"start-note\">Clicking \"Start Test\" will enter Fullscreen mode and begin the 14:24 countdown timer.<\/span>\n          <button type=\"button\" id=\"startTestBtn\" class=\"btn-primary\">Start Test<\/button>\n        <\/div>\n      <\/section>\n\n      <section id=\"historySection\" class=\"card history-card hidden\">\n        <div class=\"history-header\">\n          <h2>Saved Attempts (Browser Storage)<\/h2>\n          <button type=\"button\" id=\"clearHistoryBtn\" class=\"btn-danger-outline\">Clear History<\/button>\n        <\/div>\n        <div class=\"history-table-wrap\">\n          <table class=\"history-table\">\n            <thead>\n              <tr>\n                <th>Date &amp; Time<\/th>\n                <th>Score<\/th>\n                <th>Correct<\/th>\n                <th>Incorrect<\/th>\n                <th>Unattempted<\/th>\n                <th>Accuracy<\/th>\n                <th>Action<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"historyTableBody\"><\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n    <\/main>\n  <\/div>\n\n  <!-- ================= VIEW 2: MAIN EXAM INTERFACE ================= -->\n  <div id=\"examView\" class=\"hidden\">\n    <header class=\"exam-header\">\n      <div class=\"header-brand\">\n        <span class=\"header-badge\">RRB NTPC<\/span>\n        <span class=\"header-title\">Units &amp; Measurements Mock Test<\/span>\n      <\/div>\n      <div class=\"header-controls\">\n        <div id=\"timerDisplay\" class=\"timer-
